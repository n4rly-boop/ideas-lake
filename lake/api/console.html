    version: el("input", { value: "v1" }),
    success: el("select", {}, ...["—", "успех", "провал"].map((t) => el("option", {}, t))),
    meta: el("input", { class: "mono grow", placeholder: '{"fitness_delta": 0.12}' }),
  };

  host.replaceChildren(
    el("div", { class: "panel" },
      el("h2", {}, "GET /sources"),
      el("p", { class: "help" }, "Статьи, документация и логи прогонов. id выводится из (url, version), "
        + "поэтому повторный POST заменяет строку, а не плодит вторую."),
      ignoredRunNote(ctx),
      el("div", { class: "row" }, el("button", { class: "ghost", onclick: () => load() }, "Обновить")),
      statusHost),
    el("details", { class: "panel" },
      el("summary", { style: "cursor:pointer;color:var(--muted);font-size:12px;letter-spacing:.1em;text-transform:uppercase" },
        "POST /sources — записать источник (сюда блок C сдаёт исход прогона)"),
      el("p", { class: "help", style: "margin-top:12px" },
        "Единственная запись, кроме ингеста. title и type у существующего id заморожены: попытка "
        + "переписать их — 409, потому что это провенанс уже записанных листьев."),
      el("div", { class: "row" },
        el("label", { class: "f grow" }, "url", f.url),
        el("label", { class: "f grow" }, "title", f.title),
        el("label", { class: "f" }, "type", f.type),
        el("label", { class: "f" }, "version", f.version),
        el("label", { class: "f" }, "run_success", f.success),
        el("label", { class: "f grow" }, "run_meta (JSON)", f.meta),
        el("button", { class: "act", onclick: guard(async () => {
          const body = { url: f.url.value.trim(), title: f.title.value.trim(),
                         type: f.type.value, version: f.version.value.trim() || "v1" };
          if (f.success.value !== "—") body.run_success = f.success.value === "успех";
          if (f.meta.value.trim()) {
            try { body.run_meta = JSON.parse(f.meta.value); }
            catch (err) { setStatus(formStatus, "err", null, "run_meta не JSON: " + err.message); return; }

          await run(formStatus, "пишу источник…", async () => {

            if (typeof src.id !== "string")
              throw new Error("ответ /sources без id: " + JSON.stringify(src).slice(0, 200));
            setStatus(formStatus, "ok", codeOf(src), `записан ${src.id}`);
            load();
            return src;
          });
        }) }, "Записать")),
      formStatus),
    out);
  // §2.2: same page, no request, unless the offset moved since it was fetched.
  if (state.page && state.pageOffset === state.offset) renderPage(state.page); else load(state.offset);
});

            setStatus(opsStatus, res.orphans ? "warn" : "ok", codeOf(res),

    el("div", { class: "panel" },

/* ------------------------------------------------------------------ 7. graph */

const TRUST_RAMP = ["#1c5cab", "#256abf", "#2a78d6", "#3987e5", "#5598e7",
                    "#6da7ec", "#86b6ef", "#b7d3f6", "#cde2fb"];
const trustColor = (v) => TRUST_RAMP[Math.max(0, Math.min(8, Math.round((v || 0) * 10)))];

/* Fruchterman-Reingold, seeded on a circle. 225 nodes on the main loop is a few
   hundred ms — no worker, no library, and the layout is recomputed on demand only. */
function layout(nodes, links, w, h, iters = 320) {
  const n = nodes.length;
  if (!n) return;
  const k = Math.sqrt((w * h) / n) * 0.62;
  nodes.forEach((node, i) => {
    const a = (i / n) * Math.PI * 2;
    node.x = w / 2 + Math.cos(a) * w * 0.32 * (0.55 + ((i * 37) % 100) / 200);
    node.y = h / 2 + Math.sin(a) * h * 0.32 * (0.55 + ((i * 61) % 100) / 200);
    node.dx = node.dy = 0;
  });
  const index = new Map(nodes.map((node, i) => [node.id, i]));
  const edges = links.map((e) => [index.get(e.source), index.get(e.target), e.weight || 1])
                     .filter(([a, b]) => a !== undefined && b !== undefined);
  for (let step = 0; step < iters; step++) {
    const temp = Math.max(w, h) * 0.06 * Math.pow(1 - step / iters, 1.5) + 0.5;
    for (const node of nodes) node.dx = node.dy = 0;
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        let dx = nodes[i].x - nodes[j].x, dy = nodes[i].y - nodes[j].y;
        let d2 = dx * dx + dy * dy;
        if (d2 < 0.01) { dx = (i % 7) - 3; dy = (j % 5) - 2; d2 = dx * dx + dy * dy + 0.01; }
        const f = (k * k) / d2;
        nodes[i].dx += dx * f; nodes[i].dy += dy * f;
        nodes[j].dx -= dx * f; nodes[j].dy -= dy * f;
      }
    }
    for (const [a, b, weight] of edges) {
      const dx = nodes[a].x - nodes[b].x, dy = nodes[a].y - nodes[b].y;
      const d = Math.hypot(dx, dy) + 1e-6;
      const f = (d * d) / k * Math.log1p(weight) * 0.9 / d;
      nodes[a].dx -= dx * f; nodes[a].dy -= dy * f;
      nodes[b].dx += dx * f; nodes[b].dy += dy * f;
    }
    for (const node of nodes) {
      const d = Math.hypot(node.dx, node.dy) + 1e-9;
      node.x += (node.dx / d) * Math.min(d, temp);
      node.y += (node.dy / d) * Math.min(d, temp);
      node.x = Math.max(18, Math.min(w - 18, node.x));
      node.y = Math.max(18, Math.min(h - 18, node.y));
    }
  }
  // Fit to the box at the end: clipping against the frame during the run leaves the
  // drawing hugging one corner, which reads as "half the graph is missing".
  const xs = nodes.map((node) => node.x), ys = nodes.map((node) => node.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const scale = Math.min((w - 44) / Math.max(x1 - x0, 1e-6), (h - 44) / Math.max(y1 - y0, 1e-6));
  for (const node of nodes) {
    node.x = 22 + (node.x - x0) * scale;
    node.y = 22 + (node.y - y0) * scale;
  }
}

const LOOKS_LIKE_ID = /^idea_[0-9a-f]{6,}$/i;

/* Free text -> идеи, через тот же гибридный индекс, что и read path: BM25 + косинус,
   слитые RRF (`GET /search`). Не `/retrieve`: тот тратит вызов 9B на rewrite и, главное,
   оставляет строку в `retrieve.jsonl` — а этот лог и есть замер A/B, операторская
   навигация по графу в нём загрязнение.

   Поиск идёт по ТЕЗИСАМ, поэтому найденное — идея-родитель лучшего листа, а не
   ближайшая по своему тексту идея. Векторов идей в браузере нет и энкодера тут нет,
   так что честнее так и сказать в интерфейсе, чем сделать вид, что сравниваем идеи. */
async function resolveIdea(text, k = 12) {
  if (LOOKS_LIKE_ID.test(text)) return { id: text, exact: true, candidates: [], hits: null };
  const hits = await api(`/search?q=${encodeURIComponent(text)}&k=${k}`);
  const candidates = [];
  for (const hit of hits) {
    if (candidates.some((c) => c.id === hit.idea_id)) continue;
    candidates.push({ id: hit.idea_id, score: hit.score, bm25: hit.bm25_rank,
                      vec: hit.vec_rank, thesis: hit.thesis_id });
  }
  // `hits` kept on the result so a caller with nothing to draw can still show the real
  // code the search answered with, instead of assuming 200.
  return { id: candidates.length ? candidates[0].id : null, exact: false, candidates, hits };
}

/* Which arm of the hybrid found this row. `—` in one column is not a detail: a hit the
   vector arm alone returned is a semantic match, and one only BM25 returned is a word
   match — the operator picking a root should see which they are getting. */
function armBadge(candidate) {
  const both = candidate.bm25 !== null && candidate.vec !== null;
  const label = both ? "слова + смысл" : candidate.vec !== null ? "смысл" : "слова";
  return el("span", { class: "badge", title:
    `BM25 rank ${candidate.bm25 ?? "—"} · vector rank ${candidate.vec ?? "—"} · RRF ${candidate.score.toFixed(5)}` },
    label);
}

view("graph", "Граф", (host, ctx) => {
  const statusHost = el("div"), wrap = el("div", { class: "graphwrap" }), info = el("div");
  const picks = el("div", { class: "legend wrap", style: "margin-top:10px" });
  const p = ctx.params;
  const seed = el("input", { class: "grow", placeholder: "запрос словами, или idea_… (пусто = всё озеро)", value: p.root || "" });
  const hops = el("select", {}, ...[1, 2, 3].map((n) => el("option", { selected: String(n) === (p.hops || "1") ? "" : null }, n)));
  const minW = el("input", { type: "number", min: 0, step: 1, placeholder: "любой", value: p.min_weight || "" });
  const cap = el("input", { type: "number", min: 10, max: 400, value: Number(p.cap) || 200 });
  // Idea text for a candidate outside the drawn neighbourhood, filled in by `drawPicks`
  // (§2.2, kept on `ctx.state` like `GRAPH_CACHE`/`LEAF_TEXT`): a thesis — and the idea
  // text built from it — never changes, so a label read once stays right, including
  // across a mount-time redraw that must not repeat the request that found it.
  ctx.state.labels = ctx.state.labels || new Map();

  // §2.2: the address mirrors the form. `root` takes the literal typed text (a query OR
  // an id — this view accepts both), not just an id, unlike the dial's `q`.
  function syncParams(root) {
    setParams({
      root: root || undefined,
      hops: hops.value !== "1" ? hops.value : undefined,
      min_weight: minW.value || undefined,
      cap: (Number(cap.value) || 200) !== 200 ? cap.value : undefined,
    });
  }
  for (const [field, evt] of [[hops, "change"], [minW, "input"], [cap, "input"]])
    field.addEventListener(evt, () => syncParams(seed.value.trim()));
  seed.addEventListener("input", () => syncParams(seed.value.trim()));

  // Two draws can be in flight — a whole-lake sweep takes 261 requests, an ego graph a
  // handful — and without this the slow one lands last and overwrites the picture the
  // operator actually asked for, status line included. Every await re-checks its turn.
  let generation = 0;

  async function draw(forcedRoot) {
    const mine = ++generation;
    const stale = () => mine !== generation;
    const typed = (forcedRoot || seed.value).trim();
    syncParams(typed);   // a click "тоже обновляет адрес" (§2.2), even a candidate button
    const limit = Math.min(200, Math.max(10, Number(cap.value) || 200));
    const params = new URLSearchParams({ hops: hops.value });
    if (minW.value) params.set("min_weight", minW.value);
    picks.replaceChildren();

    let rootId = "", found = null;
    if (typed) {
      found = await run(statusHost, "ищу корень по смыслу…", () => resolveIdea(typed));
      if (stale()) return;
      if (!found) return;
      if (!found.id) {
        // NOT a fall-through to the whole lake: drawing 200 unrelated ideas after a
        // query that matched nothing would look like the search had worked.
        wrap.replaceChildren();
        setStatus(statusHost, "warn", codeOf(found.hits), `индекс ничего не нашёл по «${typed}» — корня нет, `
          + "граф не построен. Пустое поле нарисует всё озеро.");
        return;
      }
      rootId = found.id;
    }

    const data = await run(statusHost, rootId ? "тяну окрестность идеи…"
      : "тяну идеи и рёбра каждой из них…", async () => {
      if (rootId) {
        const [idea, edges] = await Promise.all([
          api(`/ideas/${encodeURIComponent(rootId)}`),
          api(`/ideas/${encodeURIComponent(rootId)}/neighbors?${params}`),
        ]);
        const ids = [...new Set([idea.id, ...edges.flatMap((e) => [e.source_id, e.target_id])])]
          .filter((id) => id !== idea.id);
        const bodies = new Map([[idea.id, idea]]);
        // Neighbours come back as edges only, so their bodies are fetched one by one —
        // there is no bulk read for a set of ids, and inventing one client-side would
        // mean drawing a node whose trust and leaf count nobody looked up. A 404 here
        // is a real answer (an edge to an idea that is gone), so it drops the node
        // rather than the whole picture.
        for (const [id, body] of await pool(ids, (id) =>
            api(`/ideas/${encodeURIComponent(id)}`).catch((err) => {
              if (err.status === 404) return null;
              throw err;
            })))
          if (body) bodies.set(id, body);
        // `idea` is the one call in this branch with a status worth showing — the
        // neighbours and the pooled bodies can each fail their own way and already say so.
        return { bodies, edges, total: bodies.size, shown: bodies.size, truncated: false,
                 code: codeOf(idea) };
      }
      const page = await api(`/ideas?limit=${limit}&offset=0`);
      const bodies = new Map(page.items.map((idea) => [idea.id, idea]));
      const edges = [];
      for (const [, part] of await pool([...bodies.keys()], (id) =>
          api(`/ideas/${encodeURIComponent(id)}/neighbors?${params}`)))
        for (const edge of part) if (bodies.has(edge.target_id)) edges.push(edge);
      return { bodies, edges, total: page.total, shown: bodies.size,
               truncated: page.total > bodies.size, code: codeOf(page) };
    });
    if (stale() || !data) return;
    ctx.state.graph = { data, rootId, found, typed };   // §2.2: cached for mount-time restore
    paint(data, rootId, found, typed, stale);
  }

  // Pure(ish) render of an already-fetched neighbourhood: the graph read (`data`) is
  // already in hand, so everything from here on is layout + SVG + `drawPicks`' own
  // (cached, see `ctx.state.labels` above) candidate-label lookup — nothing here repeats
  // the N+1 read that got `data` in the first place. Shared by a live `draw()` and by
  // the mount-time restore below, which is the entire "switch tabs and back redraws,
  // no request" fix for this view.
  function paint(data, rootId, found, typed, stale) {

    const nodes = [...data.bodies.values()].map((idea) => ({
      id: idea.id, idea, r: 4 + 1.5 * Math.sqrt(Math.max(0, idea.theses.length - 1)) }));
    const seen = new Set();
    const links = [];
    for (const edge of data.edges) {
      const key = [edge.source_id, edge.target_id].sort().join("|");
      if (seen.has(key)) continue;
      seen.add(key);
      links.push({ source: edge.source_id, target: edge.target_id, weight: edge.weight || 1,
                   type: edge.type });
    }
    setStatus(statusHost, data.truncated ? "warn" : "ok", data.code, rootId
      ? `окрестность: ${nodes.length} узлов, ${links.length} связей на ${hops.value} хоп(а); `
        + `в озере всего ${fmt(LAST_STATS ? LAST_STATS.ideas : data.total)} идей`
        + (found && !found.exact
            ? `. Корень выбран по смыслу: «${typed}» → ${rootId}, лучший из `
              + `${found.candidates.length} идей в ответе индекса`
            : "")
        + (links.length === 0
            ? ". Рёбер у неё нет: co-citation возникает, только когда два листа пришли из "
              + "одного источника — больше хопов тут не помогут, попробуй другое совпадение ниже"
            : "")
      : `узлов ${nodes.length} из ${fmt(data.total)} идей в озере, связей ${links.length}`
        + (data.truncated
            ? ` — СПИСОК ОБРЕЗАН до ${nodes.length}: рёбра к идеям вне выборки не нарисованы`
            : " — обрезки нет"));

    // The other candidates stay on screen: the top hit of a hybrid search is a guess,
    // and the operator is the one who can tell which idea they meant. Rendered AFTER the
    // graph, deliberately: the labels cost six more requests, and the picture must not
    // wait on a convenience.
    const drawPicks = async () => {
    if (found && !found.exact && found.candidates.length > 1) {
      const shortlist = found.candidates.slice(0, 6);
      // The ids are hex; what the operator recognises is the text. Bodies of candidates
      // outside the drawn neighbourhood are not on hand, so they are fetched — six
      // requests, through the same pool, and a failure costs that one label, not the row.
      // Checked against `ctx.state.labels` first (§2.2, an idea's text never changes):
      // a mount-time restore calls this same function, and without the cache it would
      // re-fire these six requests on every tab switch back to a graph that never moved.
      const missing = shortlist.filter((c) => !data.bodies.has(c.id) && !ctx.state.labels.has(c.id))
        .map((c) => c.id);
      const labels = new Map([...data.bodies].map(([id, body]) => [id, body.text]));
      for (const [id, text] of ctx.state.labels) labels.set(id, text);
      for (const [id, body] of await pool(missing, (id) =>
          api(`/ideas/${encodeURIComponent(id)}`).catch(() => null)))
        if (body) { labels.set(id, body.text); ctx.state.labels.set(id, body.text); }
      if (stale()) return;
      picks.append(el("span", { class: "dim" }, "другие совпадения индекса:"));
      for (const candidate of shortlist) {
        const text = labels.get(candidate.id);
        picks.append(el("button", {
          class: "ghost sm",
          style: candidate.id === rootId ? "border-color:var(--s2);color:var(--ink)" : null,
          title: `${candidate.id}\n${text || "(текст не прочитан)"}`,
          onclick: () => draw(candidate.id),
        }, candidate.id === rootId ? "● " : "", text ? cut(text, 64) : candidate.id),
          armBadge(candidate));
      }
    }
    };

    // Everything below is rendering, and a throw here used to leave an empty box under
    // a green "200" — the picture missing while the status said it arrived. Same class
    // of lie as an empty list for a broken store, so it gets the same treatment.
    try {
    const w = wrap.clientWidth || 1200, h = Math.min(720, Math.round(window.innerHeight * 0.7));
    layout(nodes, links, w, h);
    const pos = new Map(nodes.map((node) => [node.id, node]));
    const mk = (tag, attrs = {}) => {
      const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [k2, v] of Object.entries(attrs)) node.setAttribute(k2, v);
      return node;
    };
    // createElementNS, not `el()`: `document.createElement("svg")` builds an
    // HTMLUnknownElement that lays out as nothing and renders no children.
    const svg = mk("svg", { class: "graph", viewBox: `0 0 ${w} ${h}` });
    const tip = (parent, text) => { const t = mk("title"); t.textContent = text; parent.append(t); };
    const gEdges = mk("g", { class: "edges" }), gNodes = mk("g", { class: "nodes" }),
          gLabels = mk("g", { class: "labels" });
    for (const link of links) {
      const a = pos.get(link.source), b = pos.get(link.target);
      if (!a || !b) continue;
      const strength = Math.min(1, Math.log1p(link.weight) / Math.log1p(6));
      const line = mk("line", { class: "edge", x1: a.x.toFixed(1), y1: a.y.toFixed(1),
        x2: b.x.toFixed(1), y2: b.y.toFixed(1), "stroke-opacity": (0.06 + 0.24 * strength).toFixed(3),
        "stroke-width": (0.6 + 0.9 * strength).toFixed(2) });
      tip(line, `${link.type} · вес ${link.weight}`);
      gEdges.append(line);
    }
    for (const node of nodes) {
      const circle = mk("circle", { class: "node" + (node.id === rootId ? " sel" : ""),
        cx: node.x.toFixed(1), cy: node.y.toFixed(1), r: node.r.toFixed(1),
        fill: trustColor(node.idea.trust_score) });
      tip(circle, `${cut(node.idea.text, 160)}\ntrust ${node.idea.trust_score.toFixed(1)} · `
        + `листьев ${node.idea.theses.length}`);
      circle.addEventListener("click", () => {
        info.replaceChildren(el("div", { class: "cards" }, ideaCard(node.idea, null)),
          el("div", { class: "row", style: "margin-top:10px" },
            el("button", { class: "ghost", onclick: () => { seed.value = node.id; draw(); } },
              "Раскрыть окрестность этой идеи"),
            el("button", { class: "ghost", onclick: () => openIdea(node.id) }, "Открыть в «Идеях»")));
        info.scrollIntoView({ behavior: "smooth", block: "nearest" });
      });
      gNodes.append(circle);
      if (node.id === rootId) {
        const label = mk("text", { class: "nl", x: node.x.toFixed(1),
          y: (node.y - node.r - 7).toFixed(1), "text-anchor": "middle" });
        label.textContent = "корень";
        gLabels.append(label);
      }
    }
    svg.append(gEdges, gNodes, gLabels);
    wrap.replaceChildren(svg);
    drawPicks();                     // not awaited: the graph is already on screen
    } catch (err) {
      wrap.replaceChildren();
      setStatus(statusHost, "err", null,
        `данные пришли (${nodes.length} узлов), но отрисовка упала: ${err.message}`);
      throw err;
    }
  }

  host.replaceChildren(
    el("div", { class: "panel" },
      el("h2", {}, "Граф идея—идея"),
      el("p", { class: "help" }, "Корень задаётся словами, а не id: текст уходит в тот же "
        + "гибридный индекс, что и read path (BM25 + косинус, слитые RRF), и корнем берётся "
        + "идея лучшего попадания. Поиск идёт по тезисам, поэтому это идея-родитель "
        + "ближайшего листа, а не ближайшая по своему тексту идея. Точный id, если он есть под "
        + "рукой, тоже принимается. Ничего не нашлось — граф не строится, а не подменяется "
        + "всем озером."),
      el("p", { class: "help" }, "Рёбра читаются через /ideas/{id}/neighbors — по одной идее за вызов, "
        + "массового чтения рёбер в API нет. Поэтому «всё озеро» это N+1 запросов (по 6 в полёте): "
        + "при 261 идее терпимо, при полном корпусе понадобится отдельная ручка. Раскладка "
        + "force-directed в браузере, цвет — trust, размер — число листьев."),
      ignoredRunNote(ctx),
      el("div", { class: "row" },
        el("label", { class: "f grow" }, "корень: запрос или id", seed),
        el("label", { class: "f" }, "хопов", hops),
        el("label", { class: "f" }, "min_weight", minW),
        el("label", { class: "f" }, "идей максимум", cap),
        el("button", { class: "act", onclick: guard(() => draw()) }, "Нарисовать")),
      statusHost, picks,
      el("div", { class: "legend" },
        el("span", {}, el("span", { class: "ramp" },
          ...TRUST_RAMP.map((c) => el("i", { style: "background:" + c }))), " trust 0.0 → 0.8"),
        el("span", {}, el("span", { class: "sw", style: "border-radius:50%;width:7px;height:7px" }),
          el("span", { class: "sw", style: "border-radius:50%;width:15px;height:15px;margin-left:4px" }),
          " размер — число листьев"),
        el("span", { class: "dim" }, "клик по узлу — карточка идеи ниже"))),
    wrap, el("div", { style: "height:14px" }), info);
  if (ctx.state.graph) {
    // §2.2: redraw the last neighbourhood from state — no request, and in particular no
    // repeat of the N+1 read (up to 261 calls for the whole lake) that built it.
    const g = ctx.state.graph;
    const mine = ++generation;
    paint(g.data, g.rootId, g.found, g.typed, () => mine !== generation);
  } else {
    // Nothing is drawn on a bare mount on purpose: the whole-lake view is one request per
    // idea, and spending 261 of them because a tab was opened is not a default anybody
    // asked for (same rule as everywhere else in §2.2 — no auto-request on open).
    setStatus(statusHost, "", null, "Введи запрос словами — корень найдётся по смыслу. "
      + "Пустое поле нарисует всё озеро, и это по одному запросу на идею.");
  }
});

/* ------------------------------------------------------------------- 8. raw */

view("raw", "Ручки", (host, ctx) => {
  const out = el("div"), statusHost = el("div");
  const method = el("select", {}, ...["GET", "POST", "PATCH"].map((m) => el("option", {}, m)));
  const path = el("input", { class: "mono grow", value: "/stats" });
  const body = el("textarea", { class: "mono", rows: 5, style:
    "width:100%;background:var(--surface-2);border:1px solid var(--hair);border-radius:8px;padding:10px",
    placeholder: '{"query": "diversity", "k": 3}' });

  host.replaceChildren(
    el("div", { class: "panel" },
      el("h2", {}, "Прямой вызов"),
      ignoredRunNote(ctx),
      el("p", { class: "help" }, "Тот же ключ, тот же origin, ответ как есть. Полный список ручек — "),
      el("p", { class: "help" }, el("a", { href: "/docs", target: "_blank" }, "/docs"), " · ",
        el("a", { href: "/openapi.json", target: "_blank" }, "/openapi.json"),
        " — они и есть контракт; это два из нескольких путей, открытых без ключа "
        + "(GET/HEAD only — полный список см. OPEN_PATHS в app.py)."),

        el("label", { class: "f" }, "метод", method),

          let parsed = null;
          if (method.value !== "GET" && body.value.trim()) {
            try { parsed = JSON.parse(body.value); }
            catch (err) { setStatus(statusHost, "err", null, "тело не JSON: " + err.message); return; }
          }
          let status;
          out.replaceChildren();
          const res = await run(statusHost, "…", () =>
            api(path.value.trim(), { method: method.value, body: parsed,
                                     onStatus: (s) => { status = s; } }));
          // `res === undefined` is the failure the wrapper already reported; `res === null`
          // is a 204, a real answer with an empty body, not the same thing.
          if (res === undefined) return;

            JSON.stringify(res, null, 2)));

/* =================================================================== router */

// Route shape: #<tab>[/<arg>][?<query>]. `arg` is an idea id and nothing longer — a
// hypothesis or a filter text belongs in the query part, not the path. Query values come
// back DECODED (URLSearchParams does that); `formatHash` is the exact inverse, so a route
// survives one parse/format round trip — NOT byte for byte (checked by the self-test
// below with real characters, not just an id): URLSearchParams re-encodes a space as `+`
// rather than `%20`, and a trailing slash on `path` is dropped. What round-trips is the
// percent-encoding, normalised.
function parseHash(hash) {
  const raw = (hash || "").replace(/^#/, "");
  const qIdx = raw.indexOf("?");
  const path = qIdx === -1 ? raw : raw.slice(0, qIdx);
  const query = qIdx === -1 ? "" : raw.slice(qIdx + 1);
  const slashIdx = path.indexOf("/");
  const tab = (slashIdx === -1 ? path : path.slice(0, slashIdx)) || VIEWS[0].id;
  const arg = slashIdx === -1 ? null : (path.slice(slashIdx + 1) || null);
  const params = {};
  // Repeated keys (?a=1&a=2) collapse to the last value — last value wins. Harmless
  // today (nothing reads params yet); §2.2 puts filters here, still one value each.
  for (const [k, v] of new URLSearchParams(query)) params[k] = v;
  return { tab, arg, params };
}

function formatHash(tab, arg, params = {}) {
  const h = "#" + tab + (arg ? "/" + arg : "");
  const qs = new URLSearchParams(params).toString();
  return qs ? h + "?" + qs : h;
}

// The one call site every idea link goes through. A single hash assignment fires
// `hashchange` below, which mounts "Идеи" WITH the argument already in hand — no
// `setTimeout` race against the tab's own mount, which is what made this dead on a fresh
// load until "Идеи" happened to have been opened by hand first (§0.1).
function openIdea(id) { location.hash = formatHash("ideas", id); }

const initialRoute = parseHash(location.hash);
let CURRENT = initialRoute.tab;
let CURRENT_ARG = initialRoute.arg;
let CURRENT_PARAMS = initialRoute.params;

// What the boot probe found, not just "have a key or not": a dead upstream (503, or no
// answer at all) is neither "open" nor "needs a key", and showing it as either is the
// exact lie §4.1 names. `probing` is the state until the first probe resolves.
let AUTH = API_KEY ? "open" : "probing";

// A bare tab switch (the nav strip's own buttons) carries no params of its own — reuse
// whatever that tab's `VIEW_STATE` last held, so leaving and coming back does not reset an
// offset/flag/filter to its default (§2.2's "листание в идеях, уход и возврат" check). An
// explicit `params` argument (a real link — `openIdea`, the "тезисы" button in
// «Источники») always wins over whatever is remembered.
function switchTo(tab, arg, params) {
  CURRENT = tab;
  CURRENT_ARG = arg || null;
  CURRENT_PARAMS = params || stateFor(tab).params || {};
  history.replaceState(null, "", formatHash(CURRENT, CURRENT_ARG, CURRENT_PARAMS));
  render();
}

// A control that changes a query param (an input, a checkbox, the pager) calls this
// instead of touching `location.hash` itself: one call site that (a) updates the address
// so the view stays a shareable link and (b) never remounts — `history.replaceState`, not
// `location.hash =`, so no `hashchange` fires and the view's own DOM/listeners survive.
// A key set to `undefined`/`null`/`""` is DELETED rather than written as the literal
// string "undefined" — that is what keeps a default value (rewrite=on, offset=0) out of
// the link instead of baking it in forever.
function setParams(patch) {
  for (const [key, value] of Object.entries(patch)) {
    if (value === undefined || value === null || value === "") delete CURRENT_PARAMS[key];
    else CURRENT_PARAMS[key] = String(value);
  }
  history.replaceState(null, "", formatHash(CURRENT, CURRENT_ARG, CURRENT_PARAMS));
}

// `run=1` is meaningful on exactly one tab (§2.2, §9.3): `/dial` only reads the index and
// writes nowhere, every other tab either logs (`/retrieve` → retrieve.jsonl, the A/B
// measurement) or writes (ingest). A hand-edited or forwarded link that puts `run=1` on
// any OTHER tab must not silently do nothing — that is the exact class of quiet lie §4.1
// bans, just moved into the router. Every non-dial view's mount calls this once.
function ignoredRunNote(ctx) {
  return ctx.params.run ? el("div", { class: "status warn", style: "margin-bottom:14px" },
    el("span", { class: "code" }, "—"),
    "run=1 в адресе работает только у циферблата — здесь этот параметр игнорируется") : null;
}

// The tab last mounted, so the NEXT render() knows whose timers to stop. Not the same
// thing as CURRENT: this only changes once a view actually mounts (never inside the auth
// gate branches below), so a probe that flips AUTH mid-session cannot leave a stale id
// pointing at a view that never ran in the first place.
let MOUNTED_TAB = null;

// §4.2: the one place every view-owned timer dies. A view registers an interval/timeout
// id under a fixed name on its OWN `ctx.state` (`state.leafTimer` on the dial,
// `state.autoTimer` on ingest's queue auto-refresh) instead of a local closure variable —
// closures are recreated fresh on every mount (that is the whole point of §2.2), so an id
// living only in one is unreachable from the next and `render()`'s `main.replaceChildren()`
// orphans it still running. `clearTimeout`/`clearInterval` are cross-safe on every id in
// every shipping browser (the HTML spec keeps one shared id space), so both run on both
// fields rather than trying to remember which call created which.
function stopTabTimers(state) {
  if (!state) return;
  clearTimeout(state.leafTimer); clearInterval(state.leafTimer); state.leafTimer = null;
  clearTimeout(state.autoTimer); clearInterval(state.autoTimer); state.autoTimer = null;
}

// The one place that turns AUTH into #main content. Called before the probe even starts
// (§7.6: tabs and an explanation belong on screen immediately, not after a 10s round trip),
// so every branch below must tolerate LAST_PROBE_ERR being unset yet.
let LAST_PROBE_ERR = null;

function render() {
  const tabs = $("#tabs");
  tabs.replaceChildren(...VIEWS.map((v) => el("button", {
    role: "tab", "aria-selected": String(v.id === CURRENT), onclick: () => switchTo(v.id),
  }, v.title)));
  const main = $("#main");
  main.replaceChildren();
  $("#gate").classList.add("hide");

  // Whatever was mounted before this call owns no more DOM as of the line above — its
  // timers must go with it, on EVERY render (a probe resolving is exactly as much a
  // "left the view" event as a tab switch, and is the one case a timer used to survive
  // past: a dead key mid session used to leave ingest's auto-refresh calling a server
  // that had just started 401'ing on it).
  if (MOUNTED_TAB) { stopTabTimers(stateFor(MOUNTED_TAB)); MOUNTED_TAB = null; }

  const known = VIEWS.some((v) => v.id === CURRENT);
  const chosen = VIEWS.find((v) => v.id === CURRENT) || VIEWS[0];
  // Looked up, never built fresh: this is the one line that has to survive every future
  // refactor of this function for §2.2 to mean anything, so the self-test below drives it
  // directly through `switchTo`, not through a copy of this lookup. Computed even when the
  // auth gate is about to bail below, on purpose — that is what lets the self-test verify
  // this line without a mounted view or the network (AUTH is still "probing" at that point).
  const state = stateFor(chosen.id);
  state.params = CURRENT_PARAMS;
  const ctx = { arg: CURRENT_ARG, params: CURRENT_PARAMS, state };

  if (AUTH === "probing") {
    main.replaceChildren(el("div", { class: "panel" },
      busy(el("div"), "проверяю сервер…")));
    return;
  }
  if (AUTH === "broken" || AUTH === "offline") {
    const err = LAST_PROBE_ERR;
    const host = el("div");
    main.replaceChildren(el("div", { class: "panel" }, host,
      el("button", { class: "act", style: "margin-top:12px", onclick: probe }, "Повторить")));
    if (err) failed(host, err);
    else setStatus(host, "err", "—", "нет связи с API");
    return;
  }
  if (AUTH === "need-key") {
    // No message here on purpose: AUTH only reaches "need-key" from probe()'s catch on a
    // 401, and api() already put a real explanation into #key-msg before throwing — this
    // call must not have a fallback string that could clobber it (§4.1's third bug).
    openGate();
    return;
  }
  MOUNTED_TAB = chosen.id;
  if (known) {
    chosen.mount(main, ctx);
    return;
  }
  // An unknown tab in the hash is not a blank page: say so, then show the first tab
  // anyway — a stale or hand-edited link should never be indistinguishable from a crash.
  main.append(el("div", { class: "panel status warn" }, el("span", { class: "code" }, "—"),
    `вкладки «${CURRENT}» нет — показана «${chosen.title}»`));
  const viewHost = el("div");
  main.append(viewHost);
  chosen.mount(viewHost, ctx);
}

window.addEventListener("hashchange", () => {
  const route = parseHash(location.hash);
  CURRENT = route.tab;
  CURRENT_ARG = route.arg;
  // A bare `location.hash = "#tab"` (no query string at all) carries no params of its
  // own — same reasoning as `switchTo`'s fallback above: reuse whatever this tab's
  // `VIEW_STATE` last remembered rather than wiping it, so a round trip through this
  // event (the operator typing a hash by hand, or a same-tab `location.hash =` that
  // §2.2's own views use to close a card) does not read as "reset every param". A hash
  // that DOES carry a query string always wins outright — a real link's params are never
  // second-guessed.
  CURRENT_PARAMS = Object.keys(route.params).length ? route.params
    : (stateFor(route.tab).params || {});
  // Defect 3: `switchTo` writes this same recovered object back into the address bar
  // (its own `history.replaceState` call above) — this handler used to stop one line
  // short of that, so a bare hash (typed by hand, back/forward, a stale bookmark) restored
  // the view from `VIEW_STATE` on screen while the address stayed the bare tab name. §2.2
  // says the address IS the state; a reload right after that moment got the empty form the
  // screen no longer showed. No remount here — `replaceState` alone, same as `setParams`.
  history.replaceState(null, "", formatHash(CURRENT, CURRENT_ARG, CURRENT_PARAMS));
  render();
});

// One probe, shared by boot and the "Повторить" button. A 200 means this server runs
// --no-auth; a 401 means it wants a key and `api()` has already primed the gate's text;
// a 503 is `app.py`'s "started without LAKE_API_KEY" (or any other broken-lake reason) —
// never a key problem; no status at all (network/timeout) is `offline`, also never a key
// problem. `api()`'s own 401 handler already calls `openGate` with real text, so this
// function only has to choose the AUTH value and let render() do the drawing.
async function probe() {
  if (API_KEY) { AUTH = "open"; render(); return; }
  AUTH = "probing";
  LAST_PROBE_ERR = null;
  render();
  try {
    await api("/healthz", { timeout: 10000 });
    NO_AUTH = true;
    AUTH = "open";
  } catch (err) {
    if (!(err instanceof ApiError)) throw err;
    LAST_PROBE_ERR = err;
    AUTH = err.status === 401 ? "need-key" : err.status === 0 ? "offline" : "broken";
  }
  render();
  if (AUTH === "open") startStrip();
}

(async function boot() {
  // §7.6: tabs and an explanation are on screen before any network round trip, not after.
  render();
  // A key in sessionStorage means no keyless probe (unchanged from before) — AUTH is
  // already "open" from its initial value above; real requests report their own failures
  // through the strip/view status (§4.1 already separates 0 from 401 there).
  if (API_KEY) { startStrip(); return; }
  await probe();
})();

/* =================================================================== selftest
   Query-string gated (`?selftest=1` on the DOCUMENT, never the hash — the hash is the
   route under test): a plain page load must never pay for this. Prints exactly one line,
   `SELFTEST OK`, or throws on the first failed assertion with what was expected and what
   came back. Cheap on purpose — this checks the router and the mark-picking rule, not
   the network. */
if (new URLSearchParams(location.search).get("selftest") === "1") {
  (async function selftest() {
    function assertEq(actual, expected, what) {
      if (actual !== expected) throw new Error(
        `SELFTEST FAIL (${what}): expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
    }

    // parseHash/formatHash round-trip on a tab + idea argument.
    const r1 = parseHash("#ideas/idea_ab12");
    assertEq(r1.tab, "ideas", "parseHash tab");
    assertEq(r1.arg, "idea_ab12", "parseHash arg");
    assertEq(formatHash(r1.tab, r1.arg, r1.params), "#ideas/idea_ab12", "formatHash round-trip");

    // Query params inside the hash come back decoded.
    const r2 = parseHash("#dial?q=a%20b&k=3");
    assertEq(r2.tab, "dial", "parseHash tab (query)");
    assertEq(r2.params.q, "a b", "parseHash query q decoded");
    assertEq(r2.params.k, "3", "parseHash query k decoded");

    // Empty hash falls back to the default tab, with no argument.
    const r3 = parseHash("");
    assertEq(r3.tab, VIEWS[0].id, "parseHash default tab");
    assertEq(r3.arg, null, "parseHash default arg");

    // formatHash's ENCODING half — r1/r2 above only ever fed it empty params, so a naive
    // `"&"`-join of the query (the regression this guards against) sailed through green.
    // A value with a space, "&", "#" and Cyrillic together: space must survive as `+`
    // (not literally, not vanish), and "&"/"#" must not fall out unescaped and truncate
    // or split the query. Checked by feeding formatHash's own output back through
    // parseHash — not string equality — because URLSearchParams's encoding is not
    // byte-for-byte either (`%20` becomes `+`, see the router's own comment above).
    const trickyParams = { q: "гипотеза с пробелом & амперсандом # решёткой" };
    const r4 = parseHash(formatHash("dial", null, trickyParams));
    assertEq(r4.tab, "dial", "formatHash/parseHash round-trip tab");
    assertEq(r4.params.q, trickyParams.q, "formatHash/parseHash round-trip encodes & and #");

    // nearestMark must prefer a hit over a leaf that merely sits CLOSER — the real dial
    // case is a leaf 1.5 px wide lying exactly under the cursor while the popadanie it is
    // covering sits a few px off to the side. Distance alone picks the leaf every time
    // (dist 0 - r 1.5 = -1.5 beats dist 10 - r 8 = 2); only the rank term (hit rank 2,
    // leaf rank 0) pulls the hit's score below the leaf's (10 - 8 - 2*3 = -4). A test
    // that instead co-locates both marks (as this one used to) lets radius alone decide
    // and passes even with the rank term deleted — this one does not.
    const marks = [
      { x: 10, y: 10, r: 1.5, rank: 0, head: "leaf" },
      { x: 20, y: 10, r: 8, rank: 2, head: "hit" },
    ];
    const nearest = nearestMark(marks, 10, 10);
    assertEq(nearest.mark && nearest.mark.head, "hit", "nearestMark layer weight (rank, not radius)");

    // §2.2/§0.2: VIEW_STATE must hand a tab the SAME object across a round trip through
    // the real router, not rebuild one — that rebuild IS the bug (every field on every
    // tab lost on a switch). Driven through `switchTo`/`render()` themselves, not through
    // `stateFor` called directly — calling `stateFor` alone would stay green even if
    // `render()` stopped using it and built `ctx.state` fresh inline, which is the exact
    // regression this has to catch. A disposable view is spliced into VIEWS only for the
    // two calls below (popped immediately after) so no real view needs test-only code,
    // and AUTH is forced "open" for the same two calls so the mount actually runs
    // regardless of whether boot()'s own probe() has resolved yet (it usually has not,
    // this early) — both are restored before this block returns, so neither can race the
    // page's real boot sequence.
    {
      let mounts = 0, seenState = null, mismatch = false;
      VIEWS.push({ id: "__selftest_state__", title: "", mount: (host, ctx) => {
        mounts++;
        if (seenState === null) seenState = ctx.state;
        else if (ctx.state !== seenState) mismatch = true;
      } });
      const savedAuth = AUTH, savedTab = CURRENT, savedArg = CURRENT_ARG, savedParams = CURRENT_PARAMS;
      AUTH = "open";
      switchTo("__selftest_state__");
      switchTo("graph");           // graph draws nothing on mount (no network either way)
      switchTo("__selftest_state__");
      VIEWS.pop();
      VIEW_STATE.delete("__selftest_state__");
      AUTH = savedAuth;
      CURRENT = savedTab; CURRENT_ARG = savedArg; CURRENT_PARAMS = savedParams;
      history.replaceState(null, "", formatHash(CURRENT, CURRENT_ARG, CURRENT_PARAMS));
      render();
      if (mounts !== 2 || mismatch) throw new Error(
        `SELFTEST FAIL (VIEW_STATE identity): expected 2 mounts sharing one state object, `
        + `got mounts=${mounts} mismatch=${mismatch}`);
    }

    // M7: guard()'s own contract, exercised directly — every real call site routes its
    // work through run(), which catches everything and never rejects, so a test built on
    // a real button click (failed_call_returns_the_button in tools/e2e_console.py) only
    // ever proves run()'s guarantee, never guard()'s own `finally`. A synthetic button and
    // a `fn` that throws synchronously is the only way to see guard() with nothing else in
    // the way: disabled must come back off, and the throw must come out the other side —
    // not be swallowed — because a wrapper that eats exceptions turns every future bug in
    // an onclick handler into a silently stuck spinner instead of a visible error.
    {
      const btn = document.createElement("button");
      const wrapped = guard(() => { throw new Error("guard selftest boom"); });
      let rethrown = false;
      btn.disabled = false;
      try {
        await wrapped({ currentTarget: btn });
      } catch (err) {
        rethrown = err instanceof Error && err.message === "guard selftest boom";
      }
      if (!rethrown) throw new Error(
        "SELFTEST FAIL (guard): exception from fn was not rethrown — guard() swallowed it");
      if (btn.disabled) throw new Error(
        "SELFTEST FAIL (guard): button still disabled after fn threw — finally did not run");
    }

    console.log("SELFTEST OK");
  })();
}
</script>
</body>
