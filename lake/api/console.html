<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ideas Lake — консоль блока A</title>
<style>
:root{
  color-scheme:dark;
  --plane:#0d0d0d; --surface:#141414; --surface-2:#1a1a19; --raised:#1f1f1e;
  --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --hair:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
}
:root[data-theme="light"]{
  color-scheme:light;
  --plane:#f9f9f7; --surface:#fcfcfb; --surface-2:#f4f3f0; --raised:#fff;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --hair:rgba(11,11,11,.10);
  --s1:#2a78d6; --s2:#eb6834;
}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--ink);
  font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--s1)}
button,input,select,textarea{font:inherit;color:inherit}
.mono,input.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
  font-variant-numeric:tabular-nums}
.dim{color:var(--muted)}
.hide{display:none !important}

/* ---------- chrome ---------- */
header.bar{position:sticky;top:0;z-index:20;background:var(--surface);
  border-bottom:1px solid var(--hair);padding:10px 18px;display:flex;gap:16px;
  align-items:center;flex-wrap:wrap}
.brand{font-weight:650;letter-spacing:-.01em}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.06em;
  text-transform:uppercase}
.stat-strip{display:flex;gap:14px;flex-wrap:wrap;margin-left:auto;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);
  border:1px solid var(--hair);border-radius:999px;padding:5px 11px;font-size:12px;color:var(--ink-2)}
.chip b{color:var(--ink);font-variant-numeric:tabular-nums}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.chip.ok .dot{background:var(--good)} .chip.warn .dot{background:var(--warning)}
.chip.bad .dot{background:var(--critical)}
nav.tabs{display:flex;gap:2px;padding:0 18px;background:var(--surface);
  border-bottom:1px solid var(--hair);position:sticky;top:53px;z-index:19;overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:11px 14px;
  color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button:hover{color:var(--ink-2)}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--s1)}
main{padding:20px 18px 80px;max-width:1560px;margin:0 auto}

/* ---------- controls ---------- */
.panel{background:var(--surface);border:1px solid var(--hair);border-radius:12px;
  padding:16px 18px;margin-bottom:14px}
.panel h2{margin:0 0 4px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);font-weight:600}
.panel p.help{margin:0 0 14px;color:var(--ink-2);font-size:13px;max-width:1000px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
label.f{display:flex;flex-direction:column;gap:5px;font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted)}
label.f input,label.f select{background:var(--surface-2);border:1px solid var(--hair);
  border-radius:8px;padding:8px 10px;min-width:90px}
label.f input:focus,label.f select:focus{outline:2px solid var(--s1);outline-offset:-1px}
label.f.grow{flex:1 1 340px}
label.f.grow input{width:100%}
label.cb{display:inline-flex;gap:7px;align-items:center;font-size:13px;color:var(--ink-2);
  padding-bottom:9px}
button.act{background:var(--s1);border:0;border-radius:8px;padding:9px 16px;color:#fff;
  cursor:pointer;font-weight:550}
button.act:hover{filter:brightness(1.08)}
button.act[disabled]{opacity:.5;cursor:progress}
button.ghost{background:var(--surface-2);border:1px solid var(--hair);border-radius:8px;
  padding:8px 13px;cursor:pointer;color:var(--ink-2)}
button.ghost:hover{color:var(--ink)}
button.ghost.sm{padding:4px 9px;font-size:12px}
button.danger{border-color:var(--serious);color:var(--serious)}

/* ---------- status line ---------- */
.status{margin-top:12px;border-radius:8px;padding:10px 13px;font-size:13px;
  border:1px solid var(--hair);background:var(--surface-2);display:flex;gap:10px;align-items:baseline}
.status.err{border-color:var(--critical);color:var(--critical)}
.status.warn{border-color:var(--warning);color:var(--warning)}
.status.ok{border-color:var(--good)}
.status .code{font-family:ui-monospace,Menlo,monospace;font-weight:650}
.spinner{display:inline-block;width:11px;height:11px;border:2px solid var(--hair);
  border-top-color:var(--s1);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- tables ---------- */
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--hair);
  position:sticky;top:0;background:var(--surface)}
table.tbl td{padding:9px 10px;border-bottom:1px solid var(--hair);color:var(--ink-2);
  vertical-align:top}
table.tbl tr:hover td{background:var(--surface-2)}
table.tbl td.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.scroller{overflow:auto;max-height:60vh;border:1px solid var(--hair);border-radius:10px}
.pager{display:flex;gap:10px;align-items:center;margin-top:10px;font-size:12.5px;color:var(--muted)}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;
  font-size:11.5px;border:1px solid var(--hair);background:var(--surface-2);color:var(--ink-2);
  white-space:nowrap}
.badge .g{font-size:10px}
.b-thesis .g{color:var(--good)} .b-edge .g{color:var(--warning)}
.b-padding{color:var(--muted)} .b-padding .g{color:var(--serious)}
.b-ok{border-color:var(--good)} .b-failed{border-color:var(--critical);color:var(--critical)}
.b-running,.b-queued,.b-staged{border-color:var(--warning)}
.b-run{border-color:var(--s2)} .b-paper{border-color:var(--s1)}
.b-dirty{border-color:var(--warning);color:var(--warning)}

/* ---------- idea cards ---------- */
.cards{display:grid;gap:11px}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:15px 17px}
.card.pad{border-left:3px solid var(--serious)}
.card-h{display:flex;gap:12px;align-items:flex-start}
.rank{flex:0 0 24px;height:24px;border-radius:7px;background:var(--surface-2);color:var(--ink-2);
  display:grid;place-items:center;font-size:12px;font-weight:600}
.card-t{font-size:15px;line-height:1.45;font-weight:550}
.metrics{display:flex;flex-wrap:wrap;gap:7px 16px;margin:11px 0 0;padding-top:10px;
  border-top:1px solid var(--hair);font-size:12.5px;align-items:center}
.m{display:inline-flex;align-items:center;gap:6px}
.m .k{color:var(--muted);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase}
.m .v{font-variant-numeric:tabular-nums;font-weight:600}
.cos-hi{color:var(--good)} .cos-mid{color:var(--warning)} .cos-lo{color:var(--muted)}
.tbar{width:48px;height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--s1)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px 22px;
  margin-top:12px}
.fl{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.fv{margin-top:4px;font-size:13px;color:var(--ink-2)}
details.blk{margin-top:12px;border-top:1px solid var(--hair);padding-top:10px}
details.blk summary{cursor:pointer;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted)}
ul.fm{margin:9px 0 0;padding-left:17px} ul.fm li{font-size:12.5px;color:var(--ink-2);margin-bottom:5px}
.leaf{border-left:2px solid var(--s1);padding:1px 0 1px 12px;margin:10px 0}
.leaf-t{font-size:12.5px;color:var(--ink-2);line-height:1.5}
.leaf-m{margin-top:5px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:11.5px}
.leaf-m .loc{color:var(--muted);font-family:ui-monospace,Menlo,monospace}
.leaf-m .eff{background:var(--surface-2);border-radius:6px;padding:2px 6px;color:var(--ink-2)}
.idbox{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted)}

/* ---------- ab compare ---------- */
.ab{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ab .col-h{display:flex;gap:10px;align-items:baseline;margin-bottom:8px}
.ab .col-h b{font-size:13px}
@media (max-width:1100px){.ab{grid-template-columns:1fr}}

/* ---------- graph ---------- */
.graphwrap{position:relative;background:var(--surface-2);border:1px solid var(--hair);
  border-radius:10px;overflow:hidden}
svg.graph{display:block;width:100%;height:min(70vh,720px)}
svg.graph .edge{stroke:var(--ink-2)}
svg.graph .node{stroke:var(--surface);stroke-width:1;cursor:pointer}
svg.graph .node.sel{stroke:var(--s2);stroke-width:2.5}
svg.graph text.nl{fill:var(--ink);font-size:10.5px;pointer-events:none}
/* Halo, not just colour: these captions sit on top of three thousand dots, and stroke
   under fill is the only thing that keeps them readable there. */
svg.graph text.ringlab,svg.graph text.hitlab{pointer-events:none;paint-order:stroke;
  stroke:var(--surface-2);stroke-width:3.5px;stroke-linejoin:round}
svg.graph text.ringlab{fill:var(--ink-2);font-size:10px;font-variant-numeric:tabular-nums}
svg.graph text.hitlab{fill:var(--ink);font-size:11.5px}
svg.graph circle.ideanode{cursor:pointer}
svg.graph circle.ideanode:hover{stroke:var(--s2);stroke-width:2.5}
svg.graph text.hitrank{fill:#fff;font-size:9.5px;font-weight:600;pointer-events:none}
svg.graph circle.hoverring{pointer-events:none}
.hovercard{position:absolute;z-index:5;max-width:340px;pointer-events:none;
  background:var(--raised);border:1px solid var(--hair);border-radius:9px;padding:9px 11px;
  box-shadow:0 8px 24px rgba(0,0,0,.45);font-size:12.5px;line-height:1.42}
.hovercard .hc-head{color:var(--muted);font-size:11px;margin-bottom:4px;
  font-variant-numeric:tabular-nums}
.hovercard .hc-body{color:var(--ink);white-space:pre-wrap}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--ink-2);
  align-items:center}
.sw{width:11px;height:11px;border-radius:3px;background:var(--muted);display:inline-block}
.ramp{display:inline-flex;gap:2px}.ramp i{width:14px;height:10px;display:block;border-radius:2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12.5px;margin-top:10px}
.kv dt{color:var(--muted)} .kv dd{margin:0;color:var(--ink-2)}

/* ---------- key gate ---------- */
.gate{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;z-index:50}
.gate .box{background:var(--surface);border:1px solid var(--hair);border-radius:14px;
  padding:26px 28px;width:min(520px,92vw)}
.gate h3{margin:0 0 8px;font-size:19px}
.gate p{color:var(--ink-2);font-size:13px;margin:0 0 16px}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);
  border:1px solid var(--hair);border-radius:999px;padding:4px 10px;cursor:pointer;background:none}
</style>
</head>
<body>

<header class="bar">
  <div class="brand">Ideas Lake<small>блок A · консоль</small></div>
  <div class="stat-strip" id="strip"><span class="chip"><span class="dot"></span>подключаюсь…</span></div>
  <button class="pill" id="theme-btn" title="Светлая / тёмная">◐ тема</button>
  <button class="pill" id="key-btn" title="Сменить ключ">🔑 ключ</button>
</header>

<nav class="tabs" id="tabs"></nav>
<main id="main"></main>

<div class="gate hide" id="gate">
  <div class="box">
    <h3>Ключ доступа</h3>
    <p>Все ручки, кроме <span class="mono">/openapi.json</span>, <span class="mono">/docs</span> и
      этой страницы, требуют <span class="mono">Authorization: Bearer $LAKE_API_KEY</span>. Ключ
      живёт в <span class="mono">sessionStorage</span> этой вкладки: закрыл вкладку — ключа нет.
      В URL он не попадает и на сервер, кроме этого же API, не уходит.</p>
    <label class="f grow" style="margin-bottom:14px">LAKE_API_KEY
      <input type="password" id="key-input" class="mono" autocomplete="off" spellcheck="false">
    </label>
    <div class="row">
      <button class="act" id="key-save">Сохранить и проверить</button>
      <span class="dim" id="key-msg"></span>
    </div>
  </div>
</div>

<script>
"use strict";
/* =====================================================================
   Ideas Lake console — one file, no build, no dependencies.

   Two rules the UI must not soften, because the API does not:
     1. 503 is not []. A store that raised is shown as "озеро сломано";
        an empty 200 is shown as "пусто" and they never look the same.
     2. A number is either right or absent. Totals come from `total`,
        never from items.length; a truncated list says so.
   ===================================================================== */

const KEY_STORE = "lake.api.key";
const $ = (sel, root = document) => root.querySelector(sel);
const el = (tag, attrs = {}, ...kids) => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") node.className = v;
    else if (k === "html") node.innerHTML = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    node.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return node;
};
const fmt = (n) => typeof n === "number" ? n.toLocaleString("ru-RU") : n;
const cut = (s, n) => (s || "").length > n ? s.slice(0, n - 1) + "…" : (s || "");

/* ---------------------------------------------------------------- transport */

let API_KEY = sessionStorage.getItem(KEY_STORE) || "";
/* Set only after the server has ANSWERED a keyless request: `--no-auth` is a thing an
   operator types for a loopback port, and demanding a key the server does not check is
   friction that teaches people to paste secrets into forms that ignore them. The
   direction stays fail-closed — this is never assumed, only observed, and a 401 puts
   the gate back. */
let NO_AUTH = false;

class ApiError extends Error {
  constructor(status, message, body) {
    super(message); this.status = status; this.body = body;
  }
}

async function api(path, { method = "GET", body = null, timeout = 120000 } = {}) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), timeout);
  let res;
  try {
    res = await fetch(path, {
      method,
      signal: ctl.signal,
      headers: {
        ...(API_KEY ? { Authorization: "Bearer " + API_KEY } : {}),
        ...(body ? { "Content-Type": "application/json" } : {}),
      },
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch (err) {
    clearTimeout(timer);
    // A network failure is not an empty answer either: no status, so say that.
    throw new ApiError(0, err.name === "AbortError"
      ? `нет ответа за ${Math.round(timeout / 1000)} с (таймаут на стороне страницы)`
      : `сеть недоступна: ${err.message}`, null);
  }
  clearTimeout(timer);
  const text = await res.text();
  let payload = null;
  try { payload = text ? JSON.parse(text) : null; } catch { payload = { error: text }; }
  if (res.status === 401) { openGate("Ключ не принят: 401."); throw new ApiError(401, "ключ не принят", payload); }
  if (!res.ok) {
    const retry = res.headers.get("Retry-After");
    throw new ApiError(res.status, (payload && payload.error) || res.statusText,
                       retry ? { ...payload, retry_after: retry } : payload);
  }
  return payload;
}

/* Human wording per status, so no caller has to invent one. The distinctions are
   the API's own: 409 is a refusal to act, 503 is a broken lake, 0 is no answer. */
function explain(err) {
  const map = {
    0: "нет связи с API",
    400: "запрос не принят",
    401: "ключ не принят",
    404: "такой строки нет",
    409: "отказ: слот занят или запись не наша",
    429: "очередь ингеста заполнена" + (err.body?.retry_after ? `, повтор через ${err.body.retry_after} с` : ""),
    503: "ОЗЕРО НЕДОСТУПНО — это не «пусто»",
  };
  return map[err.status] || `ошибка ${err.status}`;
}

/* ------------------------------------------------------------------ status UI */

function setStatus(host, kind, code, text, extra) {
  const box = el("div", { class: "status " + kind },
    code !== null && code !== undefined ? el("span", { class: "code" }, String(code)) : null,
    el("span", {}, text), extra || null);
  host.replaceChildren(box);
  return box;
}
const busy = (host, what) => setStatus(host, "", null,
  what, el("span", { class: "spinner", style: "margin-left:8px" }));
const failed = (host, err) => setStatus(host, err.status === 409 || err.status === 429 ? "warn" : "err",
  err.status || "—", `${explain(err)} · ${err.message}`);

/* N calls, `width` of them in flight. The graph view needs one request per idea (there
   is no bulk read for edges), and doing that strictly one at a time is minutes over a
   tunnel; firing all 200 at once is a self-inflicted load test on the school's box. */
async function pool(items, worker, width = 6) {
  const queue = [...items];
  const out = [];
  await Promise.all(Array.from({ length: Math.min(width, queue.length) }, async () => {
    while (queue.length) {
      const item = queue.shift();
      out.push([item, await worker(item)]);
    }
  }));
  return out;
}

/* Wraps a call so no view can forget the three outcomes. */
async function run(host, label, fn) {
  busy(host, label);
  try {
    const out = await fn();
    return out;
  } catch (err) {
    if (!(err instanceof ApiError)) throw err;
    failed(host, err);
    return undefined;
  }
}

/* ----------------------------------------------------------------- key gate */

function openGate(message) {
  $("#gate").classList.remove("hide");
  $("#key-msg").textContent = message || "";
  $("#key-input").value = "";
  $("#key-input").focus();
}
$("#key-btn").onclick = () => openGate("");
$("#key-save").onclick = async () => {
  const value = $("#key-input").value.trim();
  if (!value) { $("#key-msg").textContent = "пустой ключ — сервер такой не примет"; return; }
  API_KEY = value;
  $("#key-msg").textContent = "проверяю…";
  try {
    await api("/healthz", { timeout: 15000 });
  } catch (err) {
    API_KEY = "";
    $("#key-msg").textContent = err.status === 401 ? "401 — ключ не тот" : `${err.status || "—"}: ${err.message}`;
    return;
  }
  sessionStorage.setItem(KEY_STORE, value);
  $("#gate").classList.add("hide");
  refreshStrip();
  render();
};
$("#key-input")?.addEventListener("keydown", (e) => { if (e.key === "Enter") $("#key-save").click(); });

$("#theme-btn").onclick = () => {
  const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  document.documentElement.dataset.theme = next;
  localStorage.setItem("lake.theme", next);
};
document.documentElement.dataset.theme = localStorage.getItem("lake.theme") || "dark";

/* --------------------------------------------------------------- stat strip */

let LAST_STATS = null;

async function refreshStrip() {
  const strip = $("#strip");
  if (!API_KEY && !NO_AUTH) { strip.replaceChildren(el("span", { class: "chip warn" },
    el("span", { class: "dot" }), "ключ не задан")); return; }
  let health, stats;
  try {
    [health, stats] = await Promise.all([api("/healthz", { timeout: 20000 }),
                                        api("/stats", { timeout: 30000 })]);
  } catch (err) {
    if (err.status === 401) return;
    strip.replaceChildren(el("span", { class: "chip bad" }, el("span", { class: "dot" }),
      `${err.status || "—"} · ${explain(err)}`));
    return;
  }
  LAST_STATS = stats;
  const chips = [];
  const add = (kind, ...kids) => chips.push(el("span", { class: "chip " + kind },
    el("span", { class: "dot" }), ...kids));
  add(health.status === "ok" ? "ok" : "bad", "healthz ", el("b", {}, health.status),
      health.mock ? " (mock)" : "");
  // Said out loud, because from the inside an open server looks exactly like a guarded
  // one: this port answers everything to anyone who can reach it.
  if (NO_AUTH) add("warn", "сервер ", el("b", {}, "--no-auth"), " — ручки открыты");
  add(stats.in_sync ? "ok" : "bad", "индекс/хранилище ",
      el("b", {}, `${fmt(stats.theses_indexed)}/${fmt(stats.theses)}`));
  add("", "источники ", el("b", {}, fmt(stats.sources)));
  add("", "идеи ", el("b", {}, fmt(stats.ideas)));
  add("", "тезисы ", el("b", {}, fmt(stats.theses)));
  add("", "рёбра ", el("b", {}, fmt(stats.edges)));
  if (stats.ideas_without_leaves.length)
    add("bad", "идей без листьев ", el("b", {}, stats.ideas_without_leaves.length));
  if (stats.pending_link) add("warn", "pending_link ", el("b", {}, stats.pending_link));
  if (stats.job_running) add("warn", "занято ", el("b", {}, stats.job_running));
  const dead = Object.entries(stats.workers || {}).filter(([, alive]) => !alive);
  if (dead.length) add("bad", "мертвы: ", el("b", {}, dead.map(([n]) => n).join(", ")));
  strip.replaceChildren(...chips);
}

function answerBlock(answer, label, rewriteAsked) {
  const ideas = answer.ideas || [];
  const padded = ideas.filter((i) => i.via === "padding").length;
  const best = ideas.length ? Math.max(...ideas.map((i) => i.cosine_similarity ?? -1)) : null;
  // The answer body carries no `rewrite_failed` (that field lives in the retrieval log),
  // but it does carry the cost — and a rewrite that ran always spends input tokens. Zero
  // with the arm ON means the step degraded to the raw query: usually no LAKE_KEY_9B, or
  // the school's server refused. Saying "rewrite on" over that would report an ablation
  // arm that never ran.
  const rewriteDead = rewriteAsked && answer.cost.tokens_in === 0;
  return el("div", {},
    el("div", { class: "col-h" }, el("b", {}, label),
      rewriteDead ? el("span", { class: "badge", style: "border-color:var(--warning);color:var(--warning)",
        title: "0 входных токенов при включённом rewrite: шаг деградировал до сырого запроса. "
             + "Обычно это отсутствующий LAKE_KEY_9B или отказ сервера модели." },
        "rewrite не отработал") : null,
      el("span", { class: "dim mono" },
        `${answer.cost.wall_ms.toFixed(0)} мс · ${answer.cost.tokens_in}+${answer.cost.tokens_out} ток. · ${answer.log_id}`),
      best !== null ? el("span", { class: "badge" }, `лучший cosine ${best.toFixed(3)}`) : null,
      padded ? el("span", { class: "badge b-padding" }, el("span", { class: "g" }, "◇"),
                    `${padded} добито до k`) : null),
    ideas.length
      ? el("div", { class: "cards" }, ...ideas.map((item, i) => ideaCard(item, i + 1)))
      : el("div", { class: "status warn" }, el("span", { class: "code" }, "200"),
          "выдача пуста, и это ДАННЫЕ: живое хранилище ответило нулём идей (не 503)"));
}

/* --------------------------------------------------------------- 1b. циферблат */

/* Blue sequential ramp, dark end = closer. Same steps as the trust ramp above, used
   for a different job: here it doubles the radius, so a point that looks close is
   also coloured close and the two encodings cannot disagree. */
const DIAL_RAMP = ["#cde2fb", "#b7d3f6", "#86b6ef", "#6da7ec", "#5598e7",
                   "#3987e5", "#2a78d6", "#256abf", "#1c5cab"];

/* The lake's own shape: every Idea-Idea edge and every idea body, read once per page and
   reused by each hypothesis. `GET /edges` exists for this — the per-idea neighbours route
   costs 859 requests to draw the same thing, which on stage is a demo that does not start.
   Invalidated against `/stats`, so ingest running underneath shows up as a reload, not as
   a picture quietly drawn over yesterday's graph. */
let GRAPH_CACHE = null;
/* Leaf texts, filled one hover at a time (see the hover card in the dial view). A thesis
   is immutable, so a text read once is a text that stays right. */
const LEAF_TEXT = new Map();
let leafTimer = null;

async function loadGraph(force = false) {
  const fresh = GRAPH_CACHE && LAST_STATS
    && GRAPH_CACHE.edgeTotal === LAST_STATS.edges && GRAPH_CACHE.ideaTotal === LAST_STATS.ideas;
  if (GRAPH_CACHE && !force && (fresh || !LAST_STATS)) return GRAPH_CACHE;
  const edges = [];
  let edgeTotal = 0;
  for (let offset = 0; ; offset += 5000) {
    const page = await api(`/edges?limit=5000&offset=${offset}`);
    edgeTotal = page.total;
    edges.push(...page.items);
    if (!page.items.length || edges.length >= edgeTotal) break;
  }
  const ideas = new Map();
  let ideaTotal = 0;
  for (let offset = 0; ; offset += 200) {
    const page = await api(`/ideas?limit=200&offset=${offset}`);
    ideaTotal = page.total;
    for (const body of page.items) ideas.set(body.id, body);
    if (!page.items.length || ideas.size >= ideaTotal) break;
  }
  GRAPH_CACHE = { edges, ideas, edgeTotal, ideaTotal };
  return GRAPH_CACHE;
}

/* Angle-only force layout. The radius is the cosine and stays nailed down — moving a node
   toward its neighbours in radius would be the projection lie all over again — so the only
   free coordinate is the angle: connected ideas swing together, unrelated ones spread.
   Separation is asked for in pixels and converted per node (arc = r·dθ), otherwise nodes
   near the centre pile up while the rim stays empty. */
function ringLayout(nodes, links, iters = 400, gapPx = 19) {
  if (nodes.length < 2) return;
  const index = new Map(nodes.map((n, i) => [n.id, i]));
  const edges = links.map((e) => [index.get(e.source), index.get(e.target), e.weight || 1])
                     .filter(([a, b]) => a !== undefined && b !== undefined && a !== b);
  const TWO_PI = Math.PI * 2;
  const wrap = (a) => ((a % TWO_PI) + TWO_PI) % TWO_PI;
  const delta = (a, b) => { const d = wrap(a - b); return d > Math.PI ? d - TWO_PI : d; };
  for (let step = 0; step < iters; step++) {
    const pull = 0.10 * (1 - step / iters) + 0.01;
    for (const [a, b, weight] of edges) {
      const d = delta(nodes[a].angle, nodes[b].angle) * pull * Math.min(1, Math.log1p(weight));
      nodes[a].angle = wrap(nodes[a].angle - d);
      nodes[b].angle = wrap(nodes[b].angle + d);
    }
    // Three separation passes per step: one only halves the deficit of each adjacent
    // pair, and with the edges pulling every step the ideas collapsed into a clump that
    // looked like one dense cluster the graph does not have.
    for (let pass = 0; pass < 3; pass++) {
      const order = nodes.map((n, i) => i).sort((i, j) => nodes[i].angle - nodes[j].angle);
      for (let pos = 0; pos < order.length; pos++) {
        const a = nodes[order[pos]], b = nodes[order[(pos + 1) % order.length]];
        const want = gapPx / Math.max(24, Math.min(a.r, b.r));
        const gap = wrap(b.angle - a.angle);
        if (gap < want) {
          const push = (want - gap) / 2;
          a.angle = wrap(a.angle - push);
          b.angle = wrap(b.angle + push);
        }
      }
    }
  }
}

view("dial", "Гипотеза", (host) => {
  const statusHost = el("div"), wrap = el("div", { class: "graphwrap" });
  const legendHost = el("div"), listHost = el("div"), ideasHost = el("div");
  const q = el("textarea", { class: "grow", rows: 2, placeholder:
    "гипотеза словами: «шедулить мутации по тому, как часто потомок бьёт родителя»",
    style: "width:100%;background:var(--surface-2);border:1px solid var(--hair);"
         + "border-radius:8px;padding:10px;color:var(--ink);font:inherit;resize:vertical" });
  const k = el("input", { type: "number", min: 1, max: 50, value: 12 });
  // 30 by default because the top ideas all sit in a thin band of cosine — their radii
  // are nearly equal, and that ring only fits so many circles before they overlap.
  const top = el("input", { type: "number", min: 5, max: 300, value: 30 });
  const withGraph = el("input", { type: "checkbox", checked: true });
  const withLeaves = el("input", { type: "checkbox", checked: true });
  let generation = 0;

  async function fire() {
    const text = q.value.trim();
    if (!text) { setStatus(statusHost, "warn", null, "пустой q → 400"); return; }
    const mine = ++generation;
    const stale = () => mine !== generation;
    const data = await run(statusHost, "считаю косинус до каждого листа…", () =>
      api(`/dial?q=${encodeURIComponent(text)}&k=${Number(k.value) || 12}`));
    if (stale() || !data) return;

    // The graph is a separate read and a separate failure: a dead Neo4j costs the idea
    // layer and says so, while the dial — which is index-only — still stands.
    let graph = null, graphError = null;
    if (withGraph.checked) {
      busy(statusHost, "читаю идеи и рёбра…");
      try { graph = await loadGraph(); }
      catch (err) { if (!(err instanceof ApiError)) throw err; graphError = err; }
      if (stale()) return;
    }

    // `total` is the server's count of index rows, not points.length: the two differing
    // would mean the payload lost rows on the way, and that must not read as a thinner lake.
    const lost = data.total !== data.points.length;
    setStatus(statusHost, lost ? "warn" : "ok", 200,
      lost ? `сервер насчитал ${fmt(data.total)} листьев, доехало ${fmt(data.points.length)} — `
             + "картинка неполная, числам ниже верить нельзя"
           : `${fmt(data.total)} листьев расставлены: ближайший ${data.cosine.max.toFixed(3)}, `
             + `медиана озера ${data.cosine.median.toFixed(3)}`);

    let drawn = null;
    try {
      drawn = drawDial(data, graph);
    } catch (err) {
      // A throw here used to mean an empty box under a green 200 — same lie as an empty
      // list for a broken store.
      wrap.replaceChildren();
      setStatus(statusHost, "err", null, "отрисовка упала: " + err.message);
      return;
    }
    // The dial's own line first, then what the graph layer did or did not manage: two
    // reads, two verdicts, and the second must not be able to overwrite the first.
    if (graphError) {
      statusHost.append(el("div", { class: "status " + (graphError.status === 503 ? "err" : "warn") },
        el("span", { class: "code" }, graphError.status || "—"),
        `${explain(graphError)} — идеи и рёбра не прочитаны. Циферблат считается из индекса `
        + "и от графа не зависит."));
    } else if (drawn && drawn.ideas) {
      statusHost.append(el("div", { class: "status" },
        `идей на картинке ${drawn.ideas} из ${fmt(graph.ideaTotal)}, рёбер между ними `
        + `${fmt(drawn.inside)}; наружу из показанных ведут ещё ${fmt(drawn.outside)} — `
        + "окрестность продолжается за кадром, всего в озере "
        + `${fmt(graph.edgeTotal)} рёбер`
        + (drawn.offIdea
            ? `. Попаданий на своей идее ${drawn.onIdea}, на листе ${drawn.offIdea}: `
              + "их идея не вошла в показанные по косинусу лучшего листа"
            : "")));
    }
    renderHits(data);
    loadIdeas(data, stale);
  }

  function drawDial(data, graph) {
    const w = wrap.clientWidth || 1100, h = Math.min(680, Math.round(window.innerHeight * 0.72));
    const cx = w / 2, cy = h / 2, R = Math.min(w, h) / 2 - 42, R0 = R * 0.13;
    const cos = data.points.map((p) => p.cosine);
    const hi = Math.max(...cos), lo = Math.min(...cos);
    const span = Math.max(hi - lo, 1e-6);
    // Radius IS the cosine, linearly — the axis is only zoomed to [lo, hi] and says so.
    // Nothing here is a projection of distance: 2 components of these embeddings carry
    // ~10 % of the variance, which is why the angle is labelled decoration.
    const radius = (c) => R0 + (hi - c) / span * (R - R0);
    const shade = (c) => DIAL_RAMP[Math.max(0, Math.min(8,
      Math.round((c - lo) / span * 8)))];

    const mk = (tag, attrs = {}) => {
      const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
      return node;
    };
    const tip = (parent, txt) => { const t = mk("title"); t.textContent = txt; parent.append(t); };
    const svg = mk("svg", { class: "graph", viewBox: `0 0 ${w} ${h}` });
    const gRings = mk("g"), gPts = mk("g"), gEdges = mk("g"), gIdeas = mk("g"),
          gHits = mk("g"), gLab = mk("g");

    const share = (c) => data.points.filter((p) => p.cosine >= c).length;
    // On the ring goes the number and nothing else — the sentence explaining it lands in
    // the HTML legend below, where it cannot collide with a hit label or with the cloud.
    const rings = [[data.cosine.median, "медиана"], [data.cosine.p90, "p90"],
                   [data.cosine.p99, "p99"]];
    const ringLabel = (r, text) => {
      const tag = mk("text", { x: cx + 7, y: cy + r - 5, class: "ringlab" });
      tag.textContent = text;
      gRings.append(tag);
    };
    for (const [value] of rings) {
      const r = radius(value);
      gRings.append(mk("circle", { cx, cy, r, fill: "none", stroke: "var(--grid)",
                                   "stroke-dasharray": "3 5" }));
      ringLabel(r, value.toFixed(3));
    }
    gRings.append(mk("circle", { cx, cy, r: R, fill: "none", stroke: "var(--axis)" }));
    ringLabel(R, lo.toFixed(3));
    legendHost.replaceChildren(el("div", { class: "legend wrap" },
      el("span", { class: "dim" }, "кольца:"),
      ...rings.reverse().map(([value, label]) => el("span", {},
        `${label} ${value.toFixed(3)} — ближе ${fmt(share(value))} из ${fmt(data.total)}`)),
      el("span", {}, `дальний край ${lo.toFixed(3)}`),
      el("span", { class: "dim" }, "· радиус = косинус, цвет = он же"),
      el("span", { class: "dim" }, graph
        ? "· крупные узлы — идеи, линии между ними — рёбра co-citation; угол задают только "
          + "они, расстояния в нём нет"
        : "· угол ничего не значит")));

    // Every mark also lands here, and the hover card is driven by a nearest-mark search
    // rather than by :hover on the element: a leaf is 1.5 px across, and a target that
    // small is one nobody can point at.
    const marks = [];
    const hoverable = (x, y, r, rank, head, body, leaf = null) =>
      marks.push({ x, y, r, rank, head, body, leaf });
    let onIdeaCount = 0, offIdeaCount = 0;
    const hitIds = new Set(data.hits.map((hit) => hit.thesis_id));
    if (withLeaves.checked) {
      // Leaves step back when the idea layer is on: 3 000 dots at full strength read as
      // the subject of the picture, and there the subject is the graph.
      const leafAlpha = graph ? 0.3 : 0.72, leafR = graph ? 1.5 : 1.9;
      for (const p of data.points) {
        if (hitIds.has(p.thesis_id)) continue;
        const r = radius(p.cosine);
        const x = cx + Math.cos(p.angle) * r, y = cy + Math.sin(p.angle) * r;
        gPts.append(mk("circle", { cx: x, cy: y, r: leafR, fill: shade(p.cosine),
                                   "fill-opacity": leafAlpha }));
        hoverable(x, y, leafR, 0, `лист · cos ${p.cosine.toFixed(3)}`, p.thesis_id, p.thesis_id);
      }
    }

    // --- the lake's own topology, on the same radial scale --------------------
    // An idea's radius is the cosine of its BEST leaf, which is the read path's own rule
    // for lifting a hit to an idea (§5.3) — not an average, and not the idea's own vector,
    // which nothing in retrieval ever compares against.
    let shownIdeas = 0, inside = 0, outside = 0;
    const ideaAt = new Map();   // idea_id -> [x, y] once the ring layout has run
    if (graph) {
      const best = new Map();
      for (const p of data.points) {
        const seen = best.get(p.idea_id);
        if (!seen || p.cosine > seen.cosine) best.set(p.idea_id, p);
      }
      const wanted = Math.min(300, Math.max(5, Number(top.value) || 60));
      const nodes = [...best.entries()]
        .sort((a, b) => b[1].cosine - a[1].cosine)
        .slice(0, wanted)
        // Seeded on the golden angle, NOT at the leaf's projected angle and not in rank
        // order. The projected angle carries ~10 % of the residual variance and drew the
        // ideas as one arc; seeding by rank drew a spiral, because rank and radius move
        // together. Off a decorrelated ring, every grouping left on screen is the edges'
        // doing and nothing else.
        .map(([id, point], i) => ({
          id, cosine: point.cosine, r: radius(point.cosine),
          angle: ((i * 0.6180339887) % 1) * Math.PI * 2, body: graph.ideas.get(id) || null,
        }));
      const on = new Set(nodes.map((n) => n.id));
      const seenEdge = new Set();
      const links = [];
      for (const edge of graph.edges) {
        const here = on.has(edge.source_id), there = on.has(edge.target_id);
        if (!here && !there) continue;
        if (!here || !there) { outside++; continue; }
        // Stored both directions (write_cocitation_edges); one line per pair.
        const key = [edge.source_id, edge.target_id].sort().join("|");
        if (seenEdge.has(key)) continue;
        seenEdge.add(key);
        links.push({ source: edge.source_id, target: edge.target_id, weight: edge.weight || 1 });
      }
      inside = links.length;
      shownIdeas = nodes.length;
      ringLayout(nodes, links);
      const pos = new Map(nodes.map((n) => [n.id, n]));
      const at = (n) => [cx + Math.cos(n.angle) * n.r, cy + Math.sin(n.angle) * n.r];
      for (const link of links) {
        const a = pos.get(link.source), b = pos.get(link.target);
        const [x1, y1] = at(a), [x2, y2] = at(b);
        // Quadratic through a point pulled toward the centre: straight chords across the
        // disc would all pile through the middle, where the hypothesis is.
        const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
        const line = mk("path", {
          d: `M${x1.toFixed(1)} ${y1.toFixed(1)} Q${(cx + (mx - cx) * 0.55).toFixed(1)} `
             + `${(cy + (my - cy) * 0.55).toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}`,
          fill: "none", stroke: "var(--ink-2)",
          "stroke-opacity": Math.min(0.75, 0.34 + 0.14 * Math.log1p(link.weight)),
          "stroke-width": Math.min(2.4, 0.8 + 0.5 * Math.log1p(link.weight)),
        });
        tip(line, `${link.source} — ${link.target}\nвес ${link.weight}`);
        gEdges.append(line);
      }
      const parents = new Set(data.hits.map((hit) => hit.idea_id));
      for (const node of nodes) {
        const [x, y] = at(node);
        ideaAt.set(node.id, [x, y]);
        const leaves = node.body ? (node.body.theses || []).length : 0;
        const dot = mk("circle", { cx: x, cy: y, r: 3.6 + 1.5 * Math.sqrt(leaves),
          fill: shade(node.cosine), stroke: parents.has(node.id) ? "var(--s2)" : "var(--surface)",
          "stroke-width": parents.has(node.id) ? 2 : 1, class: "ideanode" });
        dot.addEventListener("click", () => openIdea(node.id));
        gIdeas.append(dot);
        hoverable(x, y, 3.6 + 1.5 * Math.sqrt(leaves), 1,
          `идея · cos лучшего листа ${node.cosine.toFixed(3)} · листьев ${leaves} · клик — открыть`,
          (node.body ? node.body.text : "(тело идеи не прочитано)") + `\n${node.id}`);
      }
    }
    // The hits are drawn last and joined to the centre: on a plot where the angle means
    // nothing, the line is what carries "this one is actually near", not the position.
    data.hits.forEach((hit, i) => {
      const p = data.points.find((pt) => pt.thesis_id === hit.thesis_id);
      if (!p) return;
      const r = radius(p.cosine);
      // With the graph layer on, the spoke ends on the IDEA the read path would return,
      // not on the leaf that matched: two markers for one hit, at unrelated angles, is a
      // picture that invites the question "why is #1 not on its own idea".
      const onIdea = ideaAt.get(hit.idea_id);
      if (onIdea) onIdeaCount++; else offIdeaCount++;
      const x = onIdea ? onIdea[0] : cx + Math.cos(p.angle) * r;
      const y = onIdea ? onIdea[1] : cy + Math.sin(p.angle) * r;
      gHits.append(mk("line", { x1: cx, y1: cy, x2: x, y2: y, stroke: "var(--s2)",
                                "stroke-width": 1, "stroke-opacity": .45 }));
      const top5 = i < 5;
      const dot = mk("circle", { cx: x, cy: y, r: top5 ? 6.5 : 4, fill: "var(--s2)",
                                 stroke: "var(--surface)", "stroke-width": 2 });
      gHits.append(dot);
      hoverable(x, y, 8, 2, `#${i + 1} · cos ${hit.cosine.toFixed(3)} · `
        + (onIdea ? `на своей идее ${hit.idea_id}` : `лист, идея вне показанных (${hit.idea_id})`),
        hit.text);
      // The rank rides in the mark, not beside it: five wrapped sentences on the plot
      // covered the very cluster they described, and the text is one hover away. Only the
      // first five are numbered — a two-digit badge does not fit the dot, and twelve of
      // them is the clutter this change removed.
      if (top5) {
        const badge = mk("text", { x, y: y + 3.4, class: "hitrank", "text-anchor": "middle" });
        badge.textContent = String(i + 1);
        gLab.append(badge);
      }
    });

    // The centre is the hypothesis at cosine 1.0, and the axis does NOT run there: the
    // nearest leaf is 0.6-something. The gap is drawn as a break, not as empty space,
    // because a filled disc would read as "nothing in the lake got close" — which is a
    // different claim from "the scale starts here".
    gLab.append(mk("circle", { cx, cy, r: R0, fill: "none", stroke: "var(--hair)",
                               "stroke-dasharray": "2 4" }));
    gLab.append(mk("circle", { cx, cy, r: 5, fill: "var(--s2)" }));
    hoverable(cx, cy, 6, 3, "гипотеза · cos 1.000 к самой себе", data.query || "");
    const note = mk("text", { x: cx, y: cy - R0 - 10, class: "hitlab", "text-anchor": "middle" });
    note.textContent = `гипотеза · разрыв шкалы: 1.000 → ${hi.toFixed(3)}`;
    gLab.append(note);

    svg.append(gRings, gPts, gEdges, gIdeas, gHits, gLab);
    const card = el("div", { class: "hovercard hide" });
    const ring = mk("circle", { class: "hoverring hide", r: 11, fill: "none",
                                stroke: "var(--s2)", "stroke-width": 1.5 });
    gLab.append(ring);
    // The svg is width:100% with a fixed viewBox, so client pixels are not viewBox units
    // and the box is letterboxed on the axis that has slack. Both are undone here; using
    // the raw offset put the card a couple of centimetres from the mark it described.
    const toView = (event) => {
      const box = svg.getBoundingClientRect();
      const scale = Math.min(box.width / w, box.height / h);
      return [(event.clientX - box.left - (box.width - w * scale) / 2) / scale,
              (event.clientY - box.top - (box.height - h * scale) / 2) / scale, box, scale];
    };
    svg.addEventListener("mousemove", (event) => {
      const [vx, vy, box, scale] = toView(event);
      let best = null, bestScore = Infinity;
      for (const m of marks) {
        // Distance to the edge of the mark, minus a bump for the layers a pointer is
        // more likely to be aiming at: a hit under a cloud of leaves must still win.
        const score = Math.hypot(m.x - vx, m.y - vy) - m.r - m.rank * 3;
        if (score < bestScore) { bestScore = score; best = m; }
      }
      if (!best || bestScore > 9) {
        card.classList.add("hide");
        ring.classList.add("hide");
        return;
      }
      ring.setAttribute("cx", best.x);
      ring.setAttribute("cy", best.y);
      ring.setAttribute("r", best.r + 5);
      ring.classList.remove("hide");
      card.replaceChildren(el("div", { class: "hc-head" }, best.head),
                           el("div", { class: "hc-body" }, LEAF_TEXT.get(best.leaf) || best.body));
      card.classList.remove("hide");
      // The leaf's own text is NOT in the dial's payload: 3 040 of them is half a megabyte
      // per hypothesis, for a line only the hovered dot ever shows. It is fetched on hover
      // instead, once per leaf, and a dead graph costs that one line and says so — the
      // dial itself is still index-only.
      if (best.leaf && !LEAF_TEXT.has(best.leaf)) {
        const which = best.leaf;
        clearTimeout(leafTimer);
        leafTimer = setTimeout(async () => {
          let text;
          try { text = (await api(`/theses/${encodeURIComponent(which)}`)).text; }
          catch (err) { text = `${which}\n(текст не прочитан: ${explain(err)})`; }
          LEAF_TEXT.set(which, text);
          const shown = card.querySelector(".hc-body");
          if (shown && shown.textContent === which) shown.textContent = text;
        }, 140);
      }
      // Placed relative to the wrapper and kept inside it: a card that runs off the panel
      // is a card whose last words are the ones nobody reads.
      const px = box.left + (box.width - w * scale) / 2 + best.x * scale;
      const py = box.top + (box.height - h * scale) / 2 + best.y * scale;
      const host = wrap.getBoundingClientRect();
      const cw = card.offsetWidth || 320, ch = card.offsetHeight || 90;
      card.style.left = `${Math.max(8, Math.min(host.width - cw - 8, px - host.left + 14))}px`;
      card.style.top = `${Math.max(8, Math.min(host.height - ch - 8, py - host.top + 14))}px`;
    });
    svg.addEventListener("mouseleave", () => {
      card.classList.add("hide");
      ring.classList.add("hide");
    });
    wrap.replaceChildren(svg, card);
    return { ideas: shownIdeas, inside, outside, onIdea: onIdeaCount, offIdea: offIdeaCount };
  }

  function renderHits(data) {
    listHost.replaceChildren(
      el("p", { class: "help" }, `Угол — первые две компоненты PCA остатка, и они несут `
        + `${(data.angle_variance * 100).toFixed(1)} % его дисперсии: это украшение, `
        + `расстояния в нём нет. Правда — радиус и таблица: косинус, тот же, что печатает `
        + `/retrieve. Список — то же, что вернул бы GET /search.`),
      el("div", { class: "scroller" }, el("table", { class: "tbl" },
        el("thead", {}, el("tr", {}, ...["#", "cos", "тезис", "идея", "RRF", "BM25", "vector"]
          .map((head) => el("th", {}, head)))),
        el("tbody", {}, ...data.hits.map((hit, i) => el("tr", {},
          el("td", { class: "num" }, i + 1),
          el("td", { class: "num mono " + cosClass(hit.cosine) }, hit.cosine.toFixed(3)),
          el("td", {}, cut(hit.text, 110)),
          el("td", { class: "mono" }, el("a", { href: "#", onclick: (e) => {
            e.preventDefault(); openIdea(hit.idea_id); } }, hit.idea_id)),
          el("td", { class: "num mono" }, hit.score.toFixed(5)),
          el("td", { class: "num mono" }, hit.bm25_rank ?? "—"),
          el("td", { class: "num mono" }, hit.vec_rank ?? "—")))))));
  }

  /* The dial itself never touches the graph. The idea cards do — so a dead graph costs
     the cards and says so, instead of taking the whole answer down with it. */
  async function loadIdeas(data, stale) {
    const ids = [];
    for (const hit of data.hits) if (!ids.includes(hit.idea_id)) ids.push(hit.idea_id);
    ideasHost.replaceChildren(el("p", { class: "help" }, `Идеи-родители найденных листьев: `
      + `${ids.length} на ${data.hits.length} попаданий. Поиск идёт по тезисам, поэтому это `
      + `идея ближайшего листа, а не ближайшая по своему тексту идея.`));
    let failure = null;
    const bodies = await pool(ids, (id) => api(`/ideas/${encodeURIComponent(id)}`)
      .catch((err) => { failure = failure || err; return null; }));
    if (stale()) return;
    const found = new Map(bodies.filter(([, body]) => body));
    if (failure) {
      ideasHost.append(el("div", { class: "status " + (failure.status === 503 ? "err" : "warn") },
        el("span", { class: "code" }, failure.status || "—"),
        `${explain(failure)} — карточки идей не прочитаны (${found.size} из ${ids.length}). `
        + "Циферблат выше считается из индекса и от графа не зависит."));
    }
    for (const id of ids) {
      const body = found.get(id);
      // No `via`, no `score`: this view did not rank anything, and printing a rank it
      // never computed would be a number with nothing behind it.
      if (body) ideasHost.append(ideaCard({ ...body, idea_id: body.id,
        theses: body.theses || [] }, ids.indexOf(id) + 1));
    }
  }

  host.replaceChildren(
    el("div", { class: "panel" },
      el("h2", {}, "GET /dial — гипотеза против всего озера"),
      el("p", { class: "help" }, "Фраза с трибуны сравнивается с каждым листом индекса. Ни rewrite, "
        + "ни 9B, ни записи: в графе от этого ничего не появляется и в retrieve.jsonl "
        + "(лог замера A/B) строки не остаётся."),
      el("div", { class: "row" }, el("label", { class: "f grow" }, "гипотеза", q),
        el("label", { class: "f" }, "k", k),
        el("label", { class: "f" }, "идей", top),
        el("button", { class: "act", onclick: fire }, "Разложить")),
      el("div", { class: "row" },
        el("label", { class: "cb" }, withGraph, "идеи и рёбра"),
        el("label", { class: "cb" }, withLeaves, "точки-листья"),
        el("button", { class: "ghost sm", onclick: async () => {
          // The graph is cached per page load; ingest running underneath is exactly when
          // an operator needs to say "re-read it" without reloading the tab.
          await run(statusHost, "перечитываю идеи и рёбра…", () => loadGraph(true));
          fire();
        } }, "Перечитать граф")),
      statusHost),
    el("div", { class: "panel" }, wrap, legendHost, listHost),
    el("div", { class: "panel" }, el("h2", {}, "Идеи рядом"), ideasHost));
  q.focus();
});

/* ----------------------------------------------------------------- 2. search */

view("search", "Индекс", (host) => {
  const out = el("div"), statusHost = el("div");
  const q = el("input", { class: "grow", placeholder: "слова как есть, без rewrite" });
  const k = el("input", { type: "number", min: 1, max: 50, value: 10 });

  async function fire() {
    if (!q.value.trim()) { setStatus(statusHost, "warn", null, "пустой q → 400"); return; }
    const hits = await run(statusHost, "ищу по тезисам…", () =>
      api(`/search?q=${encodeURIComponent(q.value.trim())}&k=${Number(k.value) || 10}`));
    if (!hits) return;
    const deadFts = hits.length && hits.every((h) => h.bm25_rank === null);
    setStatus(statusHost, deadFts ? "warn" : "ok", 200,
      deadFts ? "BM25 не вернул ни одной строки: гибрид работает на одном косинусе — проверь FTS-индекс"
              : `${hits.length} попаданий, обе руки индекса живы`);
    out.replaceChildren(hits.length ? el("div", { class: "scroller" },
      el("table", { class: "tbl" },
        el("thead", {}, el("tr", {}, ...["#", "тезис", "идея", "RRF score", "BM25 rank", "vector rank"]
          .map((h) => el("th", {}, h)))),
        el("tbody", {}, ...hits.map((h, i) => el("tr", {},
          el("td", { class: "num" }, i + 1),
          el("td", { class: "mono" }, h.thesis_id),
          el("td", { class: "mono" },
            el("a", { href: "#", onclick: (e) => { e.preventDefault(); openIdea(h.idea_id); } }, h.idea_id)),
          el("td", { class: "num mono" }, h.score.toFixed(5)),
          el("td", { class: "num mono" }, h.bm25_rank ?? "—"),
          el("td", { class: "num mono" }, h.vec_rank ?? "—"))))))
      : el("div", { class: "status warn" }, el("span", { class: "code" }, "200"),
          "индекс ответил нулём строк — это данные, а не поломка"));
  }

  host.replaceChildren(
    el("div", { class: "panel" },
      el("h2", {}, "GET /search"),
      el("p", { class: "help" }, "Сырой гибрид: BM25 + косинус, слитые RRF. Ни rewrite, ни подъёма к "
        + "идеям. Пустая колонка BM25 у всех строк = FTS-индекс мёртв, и это видно только здесь."),
      el("div", { class: "row" },
        el("label", { class: "f grow" }, "q", q),
        el("label", { class: "f" }, "k", k),
        el("button", { class: "act", onclick: fire }, "Искать")),
      statusHost),
    out);
});

/* ------------------------------------------------------------------ 3. ideas */

const PAGE = 25;

function pager(state, total, reload) {
  const from = total ? state.offset + 1 : 0;
  const to = Math.min(state.offset + state.limit, total);
  return el("div", { class: "pager" },
    el("button", { class: "ghost sm", disabled: state.offset === 0 ? "" : null,
      onclick: () => { state.offset = Math.max(0, state.offset - state.limit); reload(); } }, "← назад"),
    el("button", { class: "ghost sm", disabled: to >= total ? "" : null,
      onclick: () => { state.offset += state.limit; reload(); } }, "вперёд →"),
    el("span", {}, `показано ${from}–${to} из ${fmt(total)} (total от сервера, не длина списка)`));
}

let openIdea = () => {};

view("ideas", "Идеи", (host) => {
  const out = el("div"), statusHost = el("div"), detail = el("div");
  const state = { offset: 0, limit: PAGE };
  const jump = el("input", { class: "mono", placeholder: "idea_…" });

  async function load() {
    const page = await run(statusHost, "читаю идеи…", () =>
      api(`/ideas?limit=${state.limit}&offset=${state.offset}`));
    if (!page) return;
    setStatus(statusHost, "ok", 200, `${page.items.length} строк на странице, total ${fmt(page.total)}`);
    out.replaceChildren(
      el("div", { class: "scroller" }, el("table", { class: "tbl" },
        el("thead", {}, el("tr", {}, ...["идея", "текст", "trust", "листьев", "origin", "обновлена", ""]
          .map((h) => el("th", {}, h)))),
        el("tbody", {}, ...page.items.map((idea) => el("tr", {},
          el("td", { class: "mono" }, idea.id),
          el("td", {}, cut(idea.text, 150)),
          el("td", { class: "num" }, idea.trust_score.toFixed(1),
            idea.dirty ? el("span", { class: "badge b-dirty", style: "margin-left:6px" }, "dirty") : null),
          el("td", { class: "num" }, idea.theses.length),
          el("td", {}, idea.origin),
          el("td", { class: "mono dim" }, idea.updated_at || "«»"),
          el("td", {}, el("button", { class: "ghost sm", onclick: () => show(idea.id) }, "открыть"))))))),
      pager(state, page.total, load));
  }

  async function show(ideaId) {
    detail.replaceChildren();
    const statusBox = el("div");
    detail.append(el("div", { class: "panel" }, el("h2", {}, "идея " + ideaId), statusBox));
    const [idea, edges] = await run(statusBox, "читаю идею и её рёбра…", () => Promise.all([
      api(`/ideas/${encodeURIComponent(ideaId)}`),
      api(`/ideas/${encodeURIComponent(ideaId)}/neighbors?hops=1`),
    ])) || [];
    if (!idea) return;
    setStatus(statusBox, "ok", 200, `${idea.theses.length} листьев, ${edges.length} рёбер (1 хоп)`);

    /* PATCH form: only the fields the API allows. `trust_score`, `dirty` and `origin`
       are absent on purpose — the judge writes the first two in one update, and a
       hand-written score would separate them. */
    const editable = ["text", "applicability_conditions", "limitations", "differentiation",
                      "effect_claimed", "effect_observed"];
    const inputs = {};
    const patchStatus = el("div");
    const form = el("div", { class: "panel" },
      el("h2", {}, "PATCH /ideas/{id}"),
      el("p", { class: "help" }, "Правится только то, что ручка принимает. trust_score, dirty и origin "
        + "недоступны намеренно: счёт и флаг пишет судья одной транзакцией, а origin — факт "
        + "происхождения. Меняешь text — сервер сам пересчитает вектор."),
      ...editable.map((field) => {
        const input = el("input", { class: "grow", value: idea[field] ?? "" });
        inputs[field] = input;
        return el("label", { class: "f grow", style: "margin-bottom:8px" }, field, input);
      }),
      el("div", { class: "row" },
        el("button", { class: "act", onclick: async () => {
          const body = {};
          for (const field of editable) {
            const now = inputs[field].value;
            const was = idea[field] ?? "";
            if (now !== was) body[field] = field === "differentiation" && now === "" ? null : now;
          }
          if (!Object.keys(body).length) {
            setStatus(patchStatus, "warn", null, "ничего не изменено — пустой PATCH сервер отклонит (400)");
            return;
          }
          const updated = await run(patchStatus, "пишу…", () =>
            api(`/ideas/${encodeURIComponent(ideaId)}`, { method: "PATCH", body }));
          if (!updated) return;
          setStatus(patchStatus, "ok", 200,
            `записано: ${Object.keys(body).join(", ")}; updated_at ${updated.updated_at || "«»"}`);
          show(ideaId); load();
        } }, "Записать изменения"),
        el("button", { class: "ghost", onclick: () => show(ideaId) }, "Сбросить")),
      patchStatus);

    detail.append(
      el("div", { class: "cards" }, ideaCard(idea, null)),
      form,
      el("div", { class: "panel" },
        el("h2", {}, "рёбра из идеи · GET /ideas/{id}/neighbors"),
        edges.length ? el("div", { class: "scroller" }, el("table", { class: "tbl" },
          el("thead", {}, el("tr", {}, ...["тип", "куда", "вес", "хоп", "свидетельства", "заметка"]
            .map((h) => el("th", {}, h)))),
          el("tbody", {}, ...edges.map((edge) => el("tr", {},
            el("td", {}, el("span", { class: "badge" }, edge.type)),
            el("td", { class: "mono" }, el("a", { href: "#", onclick: (e) => {
              e.preventDefault(); show(edge.target_id); } }, edge.target_id)),
            el("td", { class: "num" }, edge.weight ?? "—"),
            el("td", { class: "num" }, edge.hop),
            el("td", { class: "num" }, (edge.evidence || []).length || "—"),
            el("td", { class: "dim" }, cut(edge.note, 80)))))))
          : el("div", { class: "status" }, el("span", { class: "code" }, "200"),
              "рёбер нет — у этой идеи их действительно ноль (ручка ответила пустым списком)")),
      el("div", { class: "row" },
        el("button", { class: "ghost", onclick: () => { detail.replaceChildren(); } }, "Закрыть карточку")));
    detail.scrollIntoView({ behavior: "smooth", block: "start" });
  }
  openIdea = (id) => { switchTo("ideas"); setTimeout(() => show(id), 0); };

  host.replaceChildren(
    el("div", { class: "panel" },
      el("h2", {}, "GET /ideas"),
      el("p", { class: "help" }, "Ноды графа с листьями. Открытая карточка даёт рёбра и правку полей."),
      el("div", { class: "row" },
        el("label", { class: "f grow" }, "открыть по id", jump),
        el("button", { class: "act", onclick: () => jump.value.trim() && show(jump.value.trim()) }, "Открыть"),
        el("button", { class: "ghost", onclick: load }, "Обновить список")),
      statusHost),
    detail, out);
  load();
});

/* ----------------------------------------------------------------- 4. theses */

view("theses", "Тезисы", (host) => {
  const out = el("div"), statusHost = el("div");
  const state = { offset: 0, limit: PAGE };
  const byIdea = el("input", { class: "mono", placeholder: "idea_…" });

const TRUST_RAMP = ["#1c5cab", "#256abf", "#2a78d6", "#3987e5", "#5598e7",
                    "#6da7ec", "#86b6ef", "#b7d3f6", "#cde2fb"];
const trustColor = (v) => TRUST_RAMP[Math.max(0, Math.min(8, Math.round((v || 0) * 10)))];

/* Fruchterman-Reingold, seeded on a circle. 225 nodes on the main loop is a few
   hundred ms — no worker, no library, and the layout is recomputed on demand only. */
function layout(nodes, links, w, h, iters = 320) {
  const n = nodes.length;
  if (!n) return;
  const k = Math.sqrt((w * h) / n) * 0.62;
  nodes.forEach((node, i) => {
    const a = (i / n) * Math.PI * 2;
    node.x = w / 2 + Math.cos(a) * w * 0.32 * (0.55 + ((i * 37) % 100) / 200);
    node.y = h / 2 + Math.sin(a) * h * 0.32 * (0.55 + ((i * 61) % 100) / 200);
    node.dx = node.dy = 0;
  });
  const index = new Map(nodes.map((node, i) => [node.id, i]));
  const edges = links.map((e) => [index.get(e.source), index.get(e.target), e.weight || 1])
                     .filter(([a, b]) => a !== undefined && b !== undefined);
  for (let step = 0; step < iters; step++) {
    const temp = Math.max(w, h) * 0.06 * Math.pow(1 - step / iters, 1.5) + 0.5;
    for (const node of nodes) node.dx = node.dy = 0;
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        let dx = nodes[i].x - nodes[j].x, dy = nodes[i].y - nodes[j].y;
        let d2 = dx * dx + dy * dy;
        if (d2 < 0.01) { dx = (i % 7) - 3; dy = (j % 5) - 2; d2 = dx * dx + dy * dy + 0.01; }
        const f = (k * k) / d2;
        nodes[i].dx += dx * f; nodes[i].dy += dy * f;
        nodes[j].dx -= dx * f; nodes[j].dy -= dy * f;
      }
    }
    for (const [a, b, weight] of edges) {
      const dx = nodes[a].x - nodes[b].x, dy = nodes[a].y - nodes[b].y;
      const d = Math.hypot(dx, dy) + 1e-6;
      const f = (d * d) / k * Math.log1p(weight) * 0.9 / d;
      nodes[a].dx -= dx * f; nodes[a].dy -= dy * f;
      nodes[b].dx += dx * f; nodes[b].dy += dy * f;
    }
    for (const node of nodes) {
      const d = Math.hypot(node.dx, node.dy) + 1e-9;
      node.x += (node.dx / d) * Math.min(d, temp);
      node.y += (node.dy / d) * Math.min(d, temp);
      node.x = Math.max(18, Math.min(w - 18, node.x));
      node.y = Math.max(18, Math.min(h - 18, node.y));
    }
  }
  // Fit to the box at the end: clipping against the frame during the run leaves the
  // drawing hugging one corner, which reads as "half the graph is missing".
  const xs = nodes.map((node) => node.x), ys = nodes.map((node) => node.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const scale = Math.min((w - 44) / Math.max(x1 - x0, 1e-6), (h - 44) / Math.max(y1 - y0, 1e-6));
  for (const node of nodes) {
    node.x = 22 + (node.x - x0) * scale;
    node.y = 22 + (node.y - y0) * scale;
  }
}

const LOOKS_LIKE_ID = /^idea_[0-9a-f]{6,}$/i;

/* Free text -> идеи, через тот же гибридный индекс, что и read path: BM25 + косинус,
   слитые RRF (`GET /search`). Не `/retrieve`: тот тратит вызов 9B на rewrite и, главное,
   оставляет строку в `retrieve.jsonl` — а этот лог и есть замер A/B, операторская
   навигация по графу в нём загрязнение.

   Поиск идёт по ТЕЗИСАМ, поэтому найденное — идея-родитель лучшего листа, а не
   ближайшая по своему тексту идея. Векторов идей в браузере нет и энкодера тут нет,
   так что честнее так и сказать в интерфейсе, чем сделать вид, что сравниваем идеи. */
async function resolveIdea(text, k = 12) {
  if (LOOKS_LIKE_ID.test(text)) return { id: text, exact: true, candidates: [] };
  const hits = await api(`/search?q=${encodeURIComponent(text)}&k=${k}`);
  const candidates = [];
  for (const hit of hits) {
    if (candidates.some((c) => c.id === hit.idea_id)) continue;
    candidates.push({ id: hit.idea_id, score: hit.score, bm25: hit.bm25_rank,
                      vec: hit.vec_rank, thesis: hit.thesis_id });
  }
  return { id: candidates.length ? candidates[0].id : null, exact: false, candidates };
}

/* Which arm of the hybrid found this row. `—` in one column is not a detail: a hit the
   vector arm alone returned is a semantic match, and one only BM25 returned is a word
   match — the operator picking a root should see which they are getting. */
function armBadge(candidate) {
  const both = candidate.bm25 !== null && candidate.vec !== null;
  const label = both ? "слова + смысл" : candidate.vec !== null ? "смысл" : "слова";
  return el("span", { class: "badge", title:
    `BM25 rank ${candidate.bm25 ?? "—"} · vector rank ${candidate.vec ?? "—"} · RRF ${candidate.score.toFixed(5)}` },
    label);
}

  const statusHost = el("div"), wrap = el("div", { class: "graphwrap" }), info = el("div");
  const picks = el("div", { class: "legend wrap", style: "margin-top:10px" });
  const seed = el("input", { class: "grow", placeholder: "запрос словами, или idea_… (пусто = всё озеро)" });
  const hops = el("select", {}, ...[1, 2, 3].map((n) => el("option", {}, n)));
  const minW = el("input", { type: "number", min: 0, step: 1, placeholder: "любой" });
  const cap = el("input", { type: "number", min: 10, max: 400, value: 200 });

  // Two draws can be in flight — a whole-lake sweep takes 261 requests, an ego graph a
  // handful — and without this the slow one lands last and overwrites the picture the
  // operator actually asked for, status line included. Every await re-checks its turn.
  let generation = 0;

  async function draw(forcedRoot) {
    const mine = ++generation;
    const stale = () => mine !== generation;
    const typed = (forcedRoot || seed.value).trim();
    const limit = Math.min(200, Math.max(10, Number(cap.value) || 200));
    const params = new URLSearchParams({ hops: hops.value });
    if (minW.value) params.set("min_weight", minW.value);
    picks.replaceChildren();

    let rootId = "", found = null;
    if (typed) {
      found = await run(statusHost, "ищу корень по смыслу…", () => resolveIdea(typed));
      if (stale()) return;
      if (!found) return;
      if (!found.id) {
        // NOT a fall-through to the whole lake: drawing 200 unrelated ideas after a
        // query that matched nothing would look like the search had worked.
        wrap.replaceChildren();
        setStatus(statusHost, "warn", 200, `индекс ничего не нашёл по «${typed}» — корня нет, `
          + "граф не построен. Пустое поле нарисует всё озеро.");
        return;
      }
      rootId = found.id;
    }

    const data = await run(statusHost, rootId ? "тяну окрестность идеи…"
      : "тяну идеи и рёбра каждой из них…", async () => {
      if (rootId) {
        const [idea, edges] = await Promise.all([
          api(`/ideas/${encodeURIComponent(rootId)}`),
          api(`/ideas/${encodeURIComponent(rootId)}/neighbors?${params}`),
        ]);
        const ids = [...new Set([idea.id, ...edges.flatMap((e) => [e.source_id, e.target_id])])]
          .filter((id) => id !== idea.id);
        const bodies = new Map([[idea.id, idea]]);
        // Neighbours come back as edges only, so their bodies are fetched one by one —
        // there is no bulk read for a set of ids, and inventing one client-side would
        // mean drawing a node whose trust and leaf count nobody looked up. A 404 here
        // is a real answer (an edge to an idea that is gone), so it drops the node
        // rather than the whole picture.
        for (const [id, body] of await pool(ids, (id) =>
            api(`/ideas/${encodeURIComponent(id)}`).catch((err) => {
              if (err.status === 404) return null;
              throw err;
            })))
          if (body) bodies.set(id, body);
        return { bodies, edges, total: bodies.size, shown: bodies.size, truncated: false };
      }
      const page = await api(`/ideas?limit=${limit}&offset=0`);
      const bodies = new Map(page.items.map((idea) => [idea.id, idea]));
      const edges = [];
      for (const [, part] of await pool([...bodies.keys()], (id) =>
          api(`/ideas/${encodeURIComponent(id)}/neighbors?${params}`)))
        for (const edge of part) if (bodies.has(edge.target_id)) edges.push(edge);
      return { bodies, edges, total: page.total, shown: bodies.size,
               truncated: page.total > bodies.size };
    });
    if (stale() || !data) return;

    const nodes = [...data.bodies.values()].map((idea) => ({
      id: idea.id, idea, r: 4 + 1.5 * Math.sqrt(Math.max(0, idea.theses.length - 1)) }));
    const seen = new Set();
    const links = [];
    for (const edge of data.edges) {
      const key = [edge.source_id, edge.target_id].sort().join("|");
      if (seen.has(key)) continue;
      seen.add(key);
      links.push({ source: edge.source_id, target: edge.target_id, weight: edge.weight || 1,
                   type: edge.type });
    }
    setStatus(statusHost, data.truncated ? "warn" : "ok", 200, rootId
      ? `окрестность: ${nodes.length} узлов, ${links.length} связей на ${hops.value} хоп(а); `
        + `в озере всего ${fmt(LAST_STATS ? LAST_STATS.ideas : data.total)} идей`
        + (found && !found.exact
            ? `. Корень выбран по смыслу: «${typed}» → ${rootId}, лучший из `
              + `${found.candidates.length} идей в ответе индекса`
            : "")
        + (links.length === 0
            ? ". Рёбер у неё нет: co-citation возникает, только когда два листа пришли из "
              + "одного источника — больше хопов тут не помогут, попробуй другое совпадение ниже"
            : "")
      : `узлов ${nodes.length} из ${fmt(data.total)} идей в озере, связей ${links.length}`
        + (data.truncated
            ? ` — СПИСОК ОБРЕЗАН до ${nodes.length}: рёбра к идеям вне выборки не нарисованы`
            : " — обрезки нет"));

    // The other candidates stay on screen: the top hit of a hybrid search is a guess,
    // and the operator is the one who can tell which idea they meant. Rendered AFTER the
    // graph, deliberately: the labels cost six more requests, and the picture must not
    // wait on a convenience.
    const drawPicks = async () => {
    if (found && !found.exact && found.candidates.length > 1) {
      const shortlist = found.candidates.slice(0, 6);
      // The ids are hex; what the operator recognises is the text. Bodies of candidates
      // outside the drawn neighbourhood are not on hand, so they are fetched — six
      // requests, through the same pool, and a failure costs that one label, not the row.
      const missing = shortlist.filter((c) => !data.bodies.has(c.id)).map((c) => c.id);
      const labels = new Map([...data.bodies].map(([id, body]) => [id, body.text]));
      for (const [id, body] of await pool(missing, (id) =>
          api(`/ideas/${encodeURIComponent(id)}`).catch(() => null)))
        if (body) labels.set(id, body.text);
      if (stale()) return;
      picks.append(el("span", { class: "dim" }, "другие совпадения индекса:"));
      for (const candidate of shortlist) {
        const text = labels.get(candidate.id);
        picks.append(el("button", {
          class: "ghost sm",
          style: candidate.id === rootId ? "border-color:var(--s2);color:var(--ink)" : null,
          title: `${candidate.id}\n${text || "(текст не прочитан)"}`,
          onclick: () => draw(candidate.id),
        }, candidate.id === rootId ? "● " : "", text ? cut(text, 64) : candidate.id),
          armBadge(candidate));
      }
    }
    };

    // Everything below is rendering, and a throw here used to leave an empty box under
    // a green "200" — the picture missing while the status said it arrived. Same class
    // of lie as an empty list for a broken store, so it gets the same treatment.
    try {
    const w = wrap.clientWidth || 1200, h = Math.min(720, Math.round(window.innerHeight * 0.7));
    layout(nodes, links, w, h);
    const pos = new Map(nodes.map((node) => [node.id, node]));
    const mk = (tag, attrs = {}) => {
      const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [k2, v] of Object.entries(attrs)) node.setAttribute(k2, v);
      return node;
    };
    // createElementNS, not `el()`: `document.createElement("svg")` builds an
    // HTMLUnknownElement that lays out as nothing and renders no children.
    const svg = mk("svg", { class: "graph", viewBox: `0 0 ${w} ${h}` });
    const tip = (parent, text) => { const t = mk("title"); t.textContent = text; parent.append(t); };
    const gEdges = mk("g", { class: "edges" }), gNodes = mk("g", { class: "nodes" }),
          gLabels = mk("g", { class: "labels" });
    for (const link of links) {
      const a = pos.get(link.source), b = pos.get(link.target);
      if (!a || !b) continue;
      const strength = Math.min(1, Math.log1p(link.weight) / Math.log1p(6));
      const line = mk("line", { class: "edge", x1: a.x.toFixed(1), y1: a.y.toFixed(1),
        x2: b.x.toFixed(1), y2: b.y.toFixed(1), "stroke-opacity": (0.06 + 0.24 * strength).toFixed(3),
        "stroke-width": (0.6 + 0.9 * strength).toFixed(2) });
      tip(line, `${link.type} · вес ${link.weight}`);
      gEdges.append(line);
    }
    for (const node of nodes) {
      const circle = mk("circle", { class: "node" + (node.id === rootId ? " sel" : ""),
        cx: node.x.toFixed(1), cy: node.y.toFixed(1), r: node.r.toFixed(1),
        fill: trustColor(node.idea.trust_score) });
      tip(circle, `${cut(node.idea.text, 160)}\ntrust ${node.idea.trust_score.toFixed(1)} · `
        + `листьев ${node.idea.theses.length}`);
      circle.addEventListener("click", () => {
        info.replaceChildren(el("div", { class: "cards" }, ideaCard(node.idea, null)),
          el("div", { class: "row", style: "margin-top:10px" },
            el("button", { class: "ghost", onclick: () => { seed.value = node.id; draw(); } },
              "Раскрыть окрестность этой идеи"),
            el("button", { class: "ghost", onclick: () => openIdea(node.id) }, "Открыть в «Идеях»")));
        info.scrollIntoView({ behavior: "smooth", block: "nearest" });
      });
      gNodes.append(circle);
      if (node.id === rootId) {
        const label = mk("text", { class: "nl", x: node.x.toFixed(1),
          y: (node.y - node.r - 7).toFixed(1), "text-anchor": "middle" });
        label.textContent = "корень";
        gLabels.append(label);
      }
    }
    svg.append(gEdges, gNodes, gLabels);
    wrap.replaceChildren(svg);
    drawPicks();                     // not awaited: the graph is already on screen
    } catch (err) {
      wrap.replaceChildren();
      setStatus(statusHost, "err", null,
        `данные пришли (${nodes.length} узлов), но отрисовка упала: ${err.message}`);
      throw err;
    }
  }

  host.replaceChildren(
    el("div", { class: "panel" },
      el("h2", {}, "Граф идея—идея"),
      el("p", { class: "help" }, "Корень задаётся словами, а не id: текст уходит в тот же "
        + "гибридный индекс, что и read path (BM25 + косинус, слитые RRF), и корнем берётся "
        + "идея лучшего попадания. Поиск идёт по тезисам, поэтому это идея-родитель "
        + "ближайшего листа, а не ближайшая по своему тексту идея. Точный id, если он есть под "
        + "рукой, тоже принимается. Ничего не нашлось — граф не строится, а не подменяется "
        + "всем озером."),
      el("p", { class: "help" }, "Рёбра читаются через /ideas/{id}/neighbors — по одной идее за вызов, "
        + "массового чтения рёбер в API нет. Поэтому «всё озеро» это N+1 запросов (по 6 в полёте): "
        + "при 261 идее терпимо, при полном корпусе понадобится отдельная ручка. Раскладка "
        + "force-directed в браузере, цвет — trust, размер — число листьев."),
      el("div", { class: "row" },
        el("label", { class: "f grow" }, "корень: запрос или id", seed),
        el("label", { class: "f" }, "хопов", hops),
        el("label", { class: "f" }, "min_weight", minW),
        el("label", { class: "f" }, "идей максимум", cap),
        el("button", { class: "act", onclick: () => draw() }, "Нарисовать")),
      statusHost, picks,
      el("div", { class: "legend" },
        el("span", {}, el("span", { class: "ramp" },
          ...TRUST_RAMP.map((c) => el("i", { style: "background:" + c }))), " trust 0.0 → 0.8"),
        el("span", {}, el("span", { class: "sw", style: "border-radius:50%;width:7px;height:7px" }),
          el("span", { class: "sw", style: "border-radius:50%;width:15px;height:15px;margin-left:4px" }),
          " размер — число листьев"),
        el("span", { class: "dim" }, "клик по узлу — карточка идеи ниже"))),
    wrap, el("div", { style: "height:14px" }), info);
  // Nothing is drawn on mount on purpose: the whole-lake view is one request per idea,
  // and spending 261 of them because a tab was opened is not a default anybody asked for.
  setStatus(statusHost, "", null, "Введи запрос словами — корень найдётся по смыслу. "
    + "Пустое поле нарисует всё озеро, и это по одному запросу на идею.");
});

/* ------------------------------------------------------------------- 8. raw */

view("raw", "Ручки", (host) => {
  const out = el("div"), statusHost = el("div");
  const method = el("select", {}, ...["GET", "POST", "PATCH"].map((m) => el("option", {}, m)));
  const path = el("input", { class: "mono grow", value: "/stats" });
  const body = el("textarea", { class: "mono", rows: 5, style:
    "width:100%;background:var(--surface-2);border:1px solid var(--hair);border-radius:8px;padding:10px",
    placeholder: '{"query": "diversity", "k": 3}' });

  host.replaceChildren(
    el("div", { class: "panel" },
      el("h2", {}, "Прямой вызов"),
      el("p", { class: "help" }, "Тот же ключ, тот же origin, ответ как есть. Полный список ручек — "),
      el("p", { class: "help" }, el("a", { href: "/docs", target: "_blank" }, "/docs"), " · ",
        el("a", { href: "/openapi.json", target: "_blank" }, "/openapi.json"),
        " — эти два пути открыты без ключа: они и есть контракт."),
      el("div", { class: "row" },
        el("label", { class: "f" }, "метод", method),
        el("label", { class: "f grow" }, "путь", path),
        el("button", { class: "act", onclick: async () => {
          let parsed = null;
          if (method.value !== "GET" && body.value.trim()) {
            try { parsed = JSON.parse(body.value); }
            catch (err) { setStatus(statusHost, "err", null, "тело не JSON: " + err.message); return; }
          }
          const res = await run(statusHost, "…", () =>
            api(path.value.trim(), { method: method.value, body: parsed }));
          if (res === undefined) return;
          setStatus(statusHost, "ok", 200, "ответ ниже");
          out.replaceChildren(el("pre", { class: "mono", style:
            "background:var(--surface-2);border:1px solid var(--hair);border-radius:10px;padding:14px;overflow:auto;max-height:60vh" },
            JSON.stringify(res, null, 2)));
        } }, "Позвать")),
      el("label", { class: "f", style: "margin-top:10px;width:100%" }, "тело (JSON)", body),
      statusHost),
    out);
});

/* =================================================================== router */

let CURRENT = location.hash.slice(1) || "retrieve";

function switchTo(id) {
  CURRENT = id;
  history.replaceState(null, "", "#" + id);
  render();
}

function render() {
  const tabs = $("#tabs");
  tabs.replaceChildren(...VIEWS.map((v) => el("button", {
    role: "tab", "aria-selected": String(v.id === CURRENT), onclick: () => switchTo(v.id),
  }, v.title)));
  const main = $("#main");
  main.replaceChildren();
  if (!API_KEY && !NO_AUTH) { openGate(""); return; }
  const chosen = VIEWS.find((v) => v.id === CURRENT) || VIEWS[0];
  chosen.mount(main);
}

window.addEventListener("hashchange", () => {
  const id = location.hash.slice(1);
  if (id && id !== CURRENT) { CURRENT = id; render(); }
});

(async function boot() {
  if (!API_KEY) {
    // One keyless probe. 200 means this server runs --no-auth; a 401 means it does not,
    // and `api()` has already put the gate up.
    try { await api("/healthz", { timeout: 10000 }); NO_AUTH = true; } catch { /* gate */ }
  }
  render();
  if (API_KEY || NO_AUTH) { refreshStrip(); setInterval(refreshStrip, 20000); }
})();
</script>
</body>
</html>
