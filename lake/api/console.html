        el("span", { class: "k" }, "score"), el("span", { class: "v dim" }, item.score.toFixed(2))) : null,
      el("span", { class: "m", title: item.dirty ? "листья менялись после суда: число от прошлого состава" : "" },
        el("span", { class: "k" }, "trust"),
        el("span", { class: "tbar" }, el("i", { style: `width:${(item.trust_score || 0) * 100}%` })),
        el("span", { class: "v" }, (item.trust_score ?? 0).toFixed(1)),
        item.dirty ? el("span", { class: "badge b-dirty" }, "dirty") : null),
      el("span", { class: "m" }, el("span", { class: "k" }, "листьев"),
        el("span", { class: "v" }, leaves.length)),
      item.origin ? el("span", { class: "badge" }, item.origin) : null),
    el("div", { class: "grid2" },
      el("div", {}, el("div", { class: "fl" }, "применимо когда"),
        el("div", { class: "fv" }, item.applicability_conditions || "—")),
      el("div", {}, el("div", { class: "fl" }, "ограничения"),
        el("div", { class: "fv" }, item.limitations || "—")),
      el("div", {}, el("div", { class: "fl" }, "эффект заявленный"),
        el("div", { class: "fv" }, item.effect_claimed || "—")),
      el("div", {}, el("div", { class: "fl" }, "эффект наблюдённый"),
        el("div", { class: "fv" }, item.effect_observed || "—"))),
    (item.failure_modes || []).length ? el("details", { class: "blk" },
      el("summary", {}, `режимы отказа · ${item.failure_modes.length}`),
      el("ul", { class: "fm" }, ...item.failure_modes.map((m) => el("li", {}, m)))) : null,
    el("details", { class: "blk", open: rank === 1 ? "" : null },
      el("summary", {}, `провенанс · ${leaves.length}`),
      ...(leaves.length ? leaves.map((leaf) => el("div", { class: "leaf" },
            el("div", { class: "leaf-t" }, leaf.text),
            el("div", { class: "leaf-m" },
              leaf.url ? el("a", { href: leaf.url, target: "_blank", rel: "noreferrer" },
                            leaf.title || leaf.source_title || leaf.url) : null,
              el("span", { class: "loc" }, leaf.locator || ""),
              leaf.effect ? el("span", { class: "eff" }, leaf.effect) : null)))
          : [el("div", { class: "fv" }, "листьев нет — для origin=extracted это нарушение инварианта")])));
}

function answerBlock(answer, label, rewriteAsked) {
  const ideas = answer.ideas || [];
  const padded = ideas.filter((i) => i.via === "padding").length;
  const best = ideas.length ? Math.max(...ideas.map((i) => i.cosine_similarity ?? -1)) : null;
  // The answer body carries no `rewrite_failed` (that field lives in the retrieval log),
  // but it does carry the cost — and a rewrite that ran always spends input tokens. Zero
  // with the arm ON means the step degraded to the raw query: usually no LAKE_KEY_9B, or
  // the school's server refused. Saying "rewrite on" over that would report an ablation
  // arm that never ran.
  const rewriteDead = rewriteAsked && answer.cost.tokens_in === 0;
  return el("div", {},
    el("div", { class: "col-h" }, el("b", {}, label),
      rewriteDead ? el("span", { class: "badge", style: "border-color:var(--warning);color:var(--warning)",
        title: "0 входных токенов при включённом rewrite: шаг деградировал до сырого запроса. "
             + "Обычно это отсутствующий LAKE_KEY_9B или отказ сервера модели." },
        "rewrite не отработал") : null,
      el("span", { class: "dim mono" },
        `${answer.cost.wall_ms.toFixed(0)} мс · ${answer.cost.tokens_in}+${answer.cost.tokens_out} ток. · ${answer.log_id}`),
      best !== null ? el("span", { class: "badge" }, `лучший cosine ${best.toFixed(3)}`) : null,
      padded ? el("span", { class: "badge b-padding" }, el("span", { class: "g" }, "◇"),
                    `${padded} добито до k`) : null),
    ideas.length
      ? el("div", { class: "cards" }, ...ideas.map((item, i) => ideaCard(item, i + 1)))
      : el("div", { class: "status warn" }, el("span", { class: "code" }, codeOf(answer)),
          "выдача пуста, и это ДАННЫЕ: живое хранилище ответило нулём идей (не 503)"));
}

view("retrieve", "Retrieve", (host, ctx) => {
  const out = el("div"), statusHost = el("div");
  const p = ctx.params;
  const q = el("input", { class: "grow", placeholder: "как задача или как решение…", value: p.q || "" });
  const k = el("input", { type: "number", min: 1, max: 50, value: Number(p.k) || 5 });
  const budget = el("input", { type: "number", min: 1, placeholder: "по умолчанию", value: p.budget || "" });
  const runId = el("input", { placeholder: "run_id (в трейс)", value: p.run_id || "" });
  const rewrite = el("input", { type: "checkbox", checked: p.rewrite === "0" ? null : true });

  function syncParams() {
    setParams({
      q: q.value.trim() || undefined,
      k: (Number(k.value) || 5) !== 5 ? k.value : undefined,
      budget: budget.value || undefined,
      run_id: runId.value.trim() || undefined,
      rewrite: rewrite.checked ? undefined : "0",
    });
  }
  for (const [field, evt] of [[q, "input"], [k, "input"], [budget, "input"], [runId, "input"],
                               [rewrite, "change"]])
    field.addEventListener(evt, syncParams);

  // Pure render of an already-answered call — no `api()` call, so the mount-time restore
  // path below can call it on a cached `res` without a request.
  function renderAnswer(res) {
    const totalMs = res.reduce((s, [, a]) => s + a.cost.wall_ms, 0);
    // Each arm's own code, checked rather than assumed: nothing in the protocol says two
    // POSTs to the same route must answer with the same status. Print one only if they
    // in fact agree; otherwise show both, so a mixed result cannot read as a clean one.
    const codes = new Set(res.map(([, a]) => codeOf(a)));
    setStatus(statusHost, "ok", [...codes].join("/"),
      `${res.length} вызов(а) · ${totalMs.toFixed(0)} мс суммарно`);
    out.replaceChildren(el("div", { class: res.length > 1 ? "ab" : "" },
      ...res.map(([rw, a]) => answerBlock(a, rw ? "rewrite on" : "rewrite off", rw))));
  }

  async function fire(both) {
    const query = q.value.trim();
    if (!query) { setStatus(statusHost, "warn", null, "пустой запрос — сервер ответит 400"); return; }
    syncParams();
    const base = { query, k: Number(k.value) || 5 };
    if (budget.value) base.budget = Number(budget.value);
    if (runId.value.trim()) base.run_id = runId.value.trim();
    const arms = both ? [true, false] : [rewrite.checked];
    // §4.1 (defect 1): on `ctx.state`, not a local `let seq = 0` — a per-mount counter
    // starts back at 0 every time this tab is left and reopened, so okSeq/errSeq minted in
    // different mounts could tie or compare backwards (see the dial view for the full story).
    const mine = ctx.state.seq = (ctx.state.seq || 0) + 1;
    // §4.1: the params THIS call answers — see the dial view for why this has to travel
    // with the result rather than being re-read off the fields later.
    const reqParams = { query, k: base.k, arms: arms.slice() };
    out.replaceChildren();
    await run(statusHost, both ? "гоню оба плеча…" : "запрос в озеро…", async () => {
      try {
        const res = [];
        for (const rw of arms) res.push([rw, await api("/retrieve", { method: "POST", body: { ...base, rewrite: rw } })]);
        // A 200 body of the wrong shape (captive portal, transparent proxy) must throw
        // here, not surface as a spinner stuck forever after the caller already moved on.
        for (const [, a] of res) {
          if (!a || typeof a !== "object" || !Array.isArray(a.ideas) || !a.cost
              || typeof a.cost.wall_ms !== "number" || typeof a.cost.tokens_in !== "number"
              || typeof a.cost.tokens_out !== "number")
            throw new Error("ответ /retrieve — не {ideas, cost}: " + JSON.stringify(a).slice(0, 200));
        }
        renderAnswer(res);
        ctx.state.res = res;   // §2.2: cached for the mount-time restore path below
        ctx.state.reqParams = reqParams; ctx.state.okSeq = mine;
        return res;
      } catch (err) {
        // §4.1 regime 2: a failed call must read back as failed after a tab switch.
        ctx.state.err = err; ctx.state.errParams = reqParams; ctx.state.errSeq = mine;
        throw err;
      }
    });
  }

  host.replaceChildren(
    el("div", { class: "panel" },
      el("h2", {}, "POST /retrieve"),
      el("p", { class: "help" }, "Запрос эволюции → идеи с провенансом. Recall-first: отказа по низкому "
        + "скору нет, выдача дозаполняется до k — поэтому смотри via и cosine, а не score."),
      ignoredRunNote(ctx),
      el("div", { class: "row" },
        el("label", { class: "f grow" }, "запрос", q),
        el("label", { class: "f" }, "k", k),
        el("label", { class: "f" }, "budget (ток.)", budget),
        el("label", { class: "f" }, "run_id", runId),
        el("label", { class: "cb" }, rewrite, "rewrite"),
        el("button", { class: "act", onclick: guard(() => fire(false)) }, "Спросить озеро"),
        el("button", { class: "ghost", onclick: guard(() => fire(true)) }, "Оба плеча рядом")),
      statusHost),
    out);
  q.focus();
  // §2.2: a previous answer lives on this tab's own VIEW_STATE entry — redraw it, no
  // request. `run=1` is deliberately NOT honoured here (§9.3): a fired /retrieve writes a
  // row to retrieve.jsonl, the A/B measurement, so this tab never fires on its own.
  const curForMatch = { query: p.q || "", k: Number(p.k) || 5, rewrite: p.rewrite !== "0" };
  if (ctx.state.errSeq && ctx.state.errSeq > (ctx.state.okSeq || 0)) {
    // §4.1 regime 2: the last call on this tab failed — show that again, not the green
    // line of a query that happened to succeed before it.
    failed(statusHost, ctx.state.err);
    const ep = ctx.state.errParams;
    if (ep && (ep.query !== curForMatch.query || ep.k !== curForMatch.k
        || !ep.arms.includes(curForMatch.rewrite)))
      statusHost.append(el("div", { class: "status warn" },
        `неудачным был запрос «${ep.query}» (k=${ep.k}) — текущий запрос другой, жми «Спросить озеро» для него`));
  } else if (ctx.state.res) {
    renderAnswer(ctx.state.res);
    const rp = ctx.state.reqParams;
    if (rp && (rp.query !== curForMatch.query || rp.k !== curForMatch.k
        || !rp.arms.includes(curForMatch.rewrite)))
      markAnswerStale(statusHost,
        `показан ответ на прежний запрос «${rp.query}» (k=${rp.k}) — текущий запрос другой, жми «Спросить озеро» для него`);
  }
});

/* --------------------------------------------------------------- 1b. циферблат */

/* Blue sequential ramp, dark end = closer. Same steps as the trust ramp above, used
   for a different job: here it doubles the radius, so a point that looks close is
   also coloured close and the two encodings cannot disagree. */
const DIAL_RAMP = ["#cde2fb", "#b7d3f6", "#86b6ef", "#6da7ec", "#5598e7",
                   "#3987e5", "#2a78d6", "#256abf", "#1c5cab"];

/* The lake's own shape: every Idea-Idea edge and every idea body, read once per page and
   reused by each hypothesis. `GET /edges` exists for this — the per-idea neighbours route
   costs 859 requests to draw the same thing, which on stage is a demo that does not start.
   Invalidated against `/stats`, so ingest running underneath shows up as a reload, not as
   a picture quietly drawn over yesterday's graph. */
let GRAPH_CACHE = null;
/* Leaf texts, filled one hover at a time (see the hover card in the dial view). A thesis
   is immutable, so a text read once is a text that stays right. */
const LEAF_TEXT = new Map();

/* §2.2: one object per TAB, never per mount. `render()` hands this to `mount(host, ctx)`
   as `ctx.state` and never clears it — a view that stashes its last response body (and
   its query params, and its own timer ids) here survives a tab switch instead of losing
   everything the moment `render()` wipes `#main` (§0.2). Kept in a plain module-level
   `Map`, next to `GRAPH_CACHE`, and NOT in `sessionStorage`: a `/dial` answer alone is
   ~285 KB, and `sessionStorage` would mean putting the lake's own data into browser
   storage — something nothing else in this console does. */
const VIEW_STATE = new Map();
function stateFor(tab) {
  if (!VIEW_STATE.has(tab)) VIEW_STATE.set(tab, {});
  return VIEW_STATE.get(tab);
}

/* §4.1 (restoration-from-VIEW_STATE defect): a mount-time redraw of `ctx.state` is a redraw
   of whatever request produced it — which is not necessarily the request the fields/address
   show right now (the field was edited after the answer came back, or a later call on the
   same tab failed). Green can only mean "this is the answer to what's on screen"; anything
   else has to say in words which request it is actually showing. `markAnswerStale` demotes
   the already-rendered status box (never re-creates it — that would erase whatever the
   view appended after its own `setStatus`, e.g. the dial's graph-coverage line) and adds
   one line naming the mismatch. */
function markAnswerStale(statusHost, message) {
  const box = statusHost.firstElementChild;
  if (box) { box.classList.remove("ok"); if (!box.classList.contains("err")) box.classList.add("warn"); }
  statusHost.insertBefore(el("div", { class: "status warn" }, message), box ? box.nextSibling : null);
}

async function loadGraph(force = false) {
  const fresh = GRAPH_CACHE && LAST_STATS
    && GRAPH_CACHE.edgeTotal === LAST_STATS.edges && GRAPH_CACHE.ideaTotal === LAST_STATS.ideas;
  if (GRAPH_CACHE && !force && (fresh || !LAST_STATS)) return GRAPH_CACHE;
  const edges = [];
  let edgeTotal = 0;
  for (let offset = 0; ; offset += 5000) {
    const page = await api(`/edges?limit=5000&offset=${offset}`);
    edgeTotal = page.total;
    edges.push(...page.items);
    if (!page.items.length || edges.length >= edgeTotal) break;
  }
  const ideas = new Map();
  let ideaTotal = 0;
  for (let offset = 0; ; offset += 200) {
    const page = await api(`/ideas?limit=200&offset=${offset}`);
    ideaTotal = page.total;
    for (const body of page.items) ideas.set(body.id, body);
    if (!page.items.length || ideas.size >= ideaTotal) break;
  }
  GRAPH_CACHE = { edges, ideas, edgeTotal, ideaTotal };
  return GRAPH_CACHE;
}

/* Angle-only force layout. The radius is the cosine and stays nailed down — moving a node
   toward its neighbours in radius would be the projection lie all over again — so the only
   free coordinate is the angle: connected ideas swing together, unrelated ones spread.
   Separation is asked for in pixels and converted per node (arc = r·dθ), otherwise nodes
   near the centre pile up while the rim stays empty. */
function ringLayout(nodes, links, iters = 400, gapPx = 19) {
  if (nodes.length < 2) return;
  const index = new Map(nodes.map((n, i) => [n.id, i]));
  const edges = links.map((e) => [index.get(e.source), index.get(e.target), e.weight || 1])
                     .filter(([a, b]) => a !== undefined && b !== undefined && a !== b);
  const TWO_PI = Math.PI * 2;
  const wrap = (a) => ((a % TWO_PI) + TWO_PI) % TWO_PI;
  const delta = (a, b) => { const d = wrap(a - b); return d > Math.PI ? d - TWO_PI : d; };
  for (let step = 0; step < iters; step++) {
    const pull = 0.10 * (1 - step / iters) + 0.01;
    for (const [a, b, weight] of edges) {
      const d = delta(nodes[a].angle, nodes[b].angle) * pull * Math.min(1, Math.log1p(weight));
      nodes[a].angle = wrap(nodes[a].angle - d);
      nodes[b].angle = wrap(nodes[b].angle + d);
    }
    // Three separation passes per step: one only halves the deficit of each adjacent
    // pair, and with the edges pulling every step the ideas collapsed into a clump that
    // looked like one dense cluster the graph does not have.
    for (let pass = 0; pass < 3; pass++) {
      const order = nodes.map((n, i) => i).sort((i, j) => nodes[i].angle - nodes[j].angle);
      for (let pos = 0; pos < order.length; pos++) {
        const a = nodes[order[pos]], b = nodes[order[(pos + 1) % order.length]];
        const want = gapPx / Math.max(24, Math.min(a.r, b.r));
        const gap = wrap(b.angle - a.angle);
        if (gap < want) {
          const push = (want - gap) / 2;
          a.angle = wrap(a.angle - push);
          b.angle = wrap(b.angle + push);
        }
      }
    }
  }
}

/* Nearest-mark search, pulled out of the mousemove handler below so the self-test can
   exercise the layer-weight rule (a hit must win over a co-located leaf) without a mouse,
   and so the touch handler a later commit adds can reuse it with its own search radius.
   `rank` is the layer priority (0 leaf, 1 idea, 2 hit, 3 hypothesis centre) — subtracted
   harder than plain distance so a hit buried under a cloud of leaves still wins. */
function nearestMark(marks, x, y) {
  let mark = null, score = Infinity;
  for (const m of marks) {
    const s = Math.hypot(m.x - x, m.y - y) - m.r - m.rank * 3;
    if (s < score) { score = s; mark = m; }
  }
  return { mark, score };
}

view("dial", "Гипотеза", (host, ctx) => {
  const statusHost = el("div"), wrap = el("div", { class: "graphwrap" });
  const legendHost = el("div"), listHost = el("div"), ideasHost = el("div");
  const p = ctx.params;
  const q = el("textarea", { class: "grow", rows: 2, placeholder:
    "гипотеза словами: «шедулить мутации по тому, как часто потомок бьёт родителя»",
    style: "width:100%;background:var(--surface-2);border:1px solid var(--hair);"
         + "border-radius:8px;padding:10px;color:var(--ink);font:inherit;resize:vertical" });
  // `<textarea>` has no `value` ATTRIBUTE — unlike `<input>`, the browser only reads its
  // initial value off child text content, so `el()`'s `setAttribute("value", …)` above
  // would have been silently ignored and every restored/linked hypothesis would render
  // as an empty box. Set as the DOM property instead, which is what actually works.
  q.value = p.q || "";
  const k = el("input", { type: "number", min: 1, max: 50, value: Number(p.k) || 12 });
  // 30 by default because the top ideas all sit in a thin band of cosine — their radii
  // are nearly equal, and that ring only fits so many circles before they overlap.
  const top = el("input", { type: "number", min: 5, max: 300, value: Number(p.top) || 30 });
  const withGraph = el("input", { type: "checkbox", checked: p.graph === "0" ? null : true });
  const withLeaves = el("input", { type: "checkbox", checked: p.leaves === "0" ? null : true });

  // §2.2: the address mirrors the form so the view is a link, not just a screen. Called
  // on every field change AND at the top of `fire()` (a button click "тоже обновляет
  // адрес" even if no field's own listener already caught the value) — `replaceState`
  // only, so this never remounts the view out from under the SVG it is about to draw.
  function syncParams() {
    setParams({
      q: q.value.trim() || undefined,
      k: (Number(k.value) || 12) !== 12 ? k.value : undefined,
      top: (Number(top.value) || 30) !== 30 ? top.value : undefined,
      graph: withGraph.checked ? undefined : "0",
      leaves: withLeaves.checked ? undefined : "0",
    });
  }
  for (const [field, evt] of [[q, "input"], [k, "input"], [top, "input"],
                               [withGraph, "change"], [withLeaves, "change"]])
    field.addEventListener(evt, syncParams);

  // Everything the picture needs, given an already-fetched `/dial` answer and an already
  // -loaded (or already-failed) graph read — no `api()` call anywhere in here. Shared by
  // a live `fire()` and by the mount-time restore below, which is what makes "switch tabs
  // and back redraws without a request" true rather than aspirational.
  function renderAll(data, graph, graphError, ideasInfo) {
    // `total` is the server's count of index rows, not points.length: the two differing
    // would mean the payload lost rows on the way, and that must not read as a thinner lake.
    const lost = data.total !== data.points.length;
    setStatus(statusHost, lost ? "warn" : "ok", codeOf(data),
      lost ? `сервер насчитал ${fmt(data.total)} листьев, доехало ${fmt(data.points.length)} — `
             + "картинка неполная, числам ниже верить нельзя"
           : `${fmt(data.total)} листьев расставлены: ближайший ${data.cosine.max.toFixed(3)}, `
             + `медиана озера ${data.cosine.median.toFixed(3)}`);

    let drawn = null;
    try {
      drawn = drawDial(data, graph);
    } catch (err) {
      // A throw here used to mean an empty box under a green 200 — same lie as an empty
      // list for a broken store.
      wrap.replaceChildren();
      setStatus(statusHost, "err", null, "отрисовка упала: " + err.message);
      return;
    }
    // The dial's own line first, then what the graph layer did or did not manage: two
    // reads, two verdicts, and the second must not be able to overwrite the first.
    // Defect 2: all of this is gated on the LIVE checkbox. `graph`/`graphError` here are
    // whatever ctx.state cached from whichever fetch produced `data` — possibly one where
    // "идеи и рёбра" was checked differently than it is right now. If the box says off,
    // the picture already draws no idea layer (above) and there is nothing honest to say
    // about it. If the box says on but nothing was ever fetched for it (a cached answer
    // from a graph-off request, or the very first restore of an old answer), the coverage
    // line above cannot be printed — no drawn.ideas exists — so say in words that this
    // picture predates the current setting, not green.
    if (!withGraph.checked) {
      // nothing to report — checkbox and picture already agree (no layer, no claim about one)
    } else if (graphError) {
      statusHost.append(el("div", { class: "status " + (graphError.status === 503 ? "err" : "warn") },
        el("span", { class: "code" }, graphError.status || "—"),
        `${explain(graphError)} — идеи и рёбра не прочитаны. Циферблат считается из индекса `
        + "и от графа не зависит."));
    } else if (drawn && drawn.ideas) {
      statusHost.append(el("div", { class: "status" },
        `идей на картинке ${drawn.ideas} из ${fmt(graph.ideaTotal)}, рёбер между ними `
        + `${fmt(drawn.inside)}; наружу из показанных ведут ещё ${fmt(drawn.outside)} — `
        + "окрестность продолжается за кадром, всего в озере "
        + `${fmt(graph.edgeTotal)} рёбер`
        + (drawn.offIdea
            ? `. Попаданий на своей идее ${drawn.onIdea}, на листе ${drawn.offIdea}: `
              + "их идея не вошла в показанные по косинусу лучшего листа"
            : "")));
    } else if (!graph) {
      statusHost.append(el("div", { class: "status warn" },
        `«идеи и рёбра» включены, но показанный ответ прочитан без графа — картинка отвечает `
        + "прежней настройке, жми «Разложить» заново, чтобы прочитать идеи и рёбра"));
    }
    renderHits(data);
    if (ideasInfo) renderIdeasBlock(ideasInfo);
  }

  async function fire() {
    const text = q.value.trim();
    if (!text) { setStatus(statusHost, "warn", null, "пустой q → 400"); return; }
    syncParams();
    // §4.1 (defect 1): the counter lives on `ctx.state`, not a local closure variable — a
    // `let` here starts back at 0 on every mount, so an okSeq/errSeq minted by mount 1 and
    // one minted by mount 2 could collide (both "1") or compare backwards, and the ranking
    // below (`errSeq > okSeq`) would pick the wrong outcome after a tab switch. `ctx.state`
    // is the one thing that survives a mount (§2.2), so the counter rides there instead.
    const mine = ctx.state.seq = (ctx.state.seq || 0) + 1;
    const stale = () => mine !== ctx.state.seq;
    // §4.1: the params THIS call answers, stashed with whatever it returns — a later mount
    // compares them against the fields/address instead of trusting that a cached body still
    // matches whatever text happens to sit in the textarea by then.
    const reqParams = { q: text, k: Number(k.value) || 12 };
    await run(statusHost, "считаю косинус до каждого листа…", async () => {
      try {
        const data = await api(`/dial?q=${encodeURIComponent(text)}&k=${Number(k.value) || 12}`);
        if (stale()) return data;

        // The graph is a separate read and a separate failure: a dead Neo4j costs the idea
        // layer and says so, while the dial — which is index-only — still stands.
        let graph = null, graphError = null;
        if (withGraph.checked) {
          busy(statusHost, "читаю идеи и рёбра…");
          try { graph = await loadGraph(); }
          catch (err) { if (!(err instanceof ApiError)) throw err; graphError = err; }
          if (stale()) return data;
        }

        const ideasInfo = await loadIdeas(data, stale);
        if (stale()) return data;
        renderAll(data, graph, graphError, ideasInfo);
        // Cached for the mount-time restore path (§2.2): the whole point is that leaving
        // this tab and coming back redraws THIS, not a fresh /dial + graph + N /ideas reads.
        ctx.state.data = data; ctx.state.graph = graph; ctx.state.graphError = graphError;
        ctx.state.ideas = ideasInfo; ctx.state.reqParams = reqParams; ctx.state.okSeq = mine;
        return data;
      } catch (err) {
        // §4.1 regime 2: a failed call must read back as failed after a tab switch, not as
        // the green line of whichever hypothesis last succeeded. `stale()` keeps a
        // superseded request's late failure from clobbering a newer request's own outcome.
        if (!stale()) { ctx.state.err = err; ctx.state.errParams = reqParams; ctx.state.errSeq = mine; }
        throw err;
      }
    });
  }

  function drawDial(data, graph) {
    const w = wrap.clientWidth || 1100, h = Math.min(680, Math.round(window.innerHeight * 0.72));
    const cx = w / 2, cy = h / 2, R = Math.min(w, h) / 2 - 42, R0 = R * 0.13;
    const cos = data.points.map((p) => p.cosine);
    const hi = Math.max(...cos), lo = Math.min(...cos);
    const span = Math.max(hi - lo, 1e-6);
    // Radius IS the cosine, linearly — the axis is only zoomed to [lo, hi] and says so.
    // Nothing here is a projection of distance: 2 components of these embeddings carry
    // ~10 % of the variance, which is why the angle is labelled decoration.
    const radius = (c) => R0 + (hi - c) / span * (R - R0);
    const shade = (c) => DIAL_RAMP[Math.max(0, Math.min(8,
      Math.round((c - lo) / span * 8)))];

    const mk = (tag, attrs = {}) => {
      const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
      return node;
    };
    const tip = (parent, txt) => { const t = mk("title"); t.textContent = txt; parent.append(t); };
    // §2.3, one rule, one place: mouse is the only pointer type with a hover concept — pen
    // and touch are both "no hover" and go through the same tap flow below. Every listener
    // in this function that branches on pointer type calls this instead of repeating the
    // comparison, so the rule cannot drift into two different conditions again (it did:
    // the click guard below used to check `=== "touch"`, letting a pen's synthetic click
    // straight through the two-tap flow it was meant to be gated by).
    const hasHover = (event) => event.pointerType === "mouse";
    const svg = mk("svg", { class: "graph", viewBox: `0 0 ${w} ${h}` });
    const gRings = mk("g"), gPts = mk("g"), gEdges = mk("g"), gIdeas = mk("g"),
          gHits = mk("g"), gLab = mk("g");

    const share = (c) => data.points.filter((p) => p.cosine >= c).length;
    // On the ring goes the number and nothing else — the sentence explaining it lands in
    // the HTML legend below, where it cannot collide with a hit label or with the cloud.
    const rings = [[data.cosine.median, "медиана"], [data.cosine.p90, "p90"],
                   [data.cosine.p99, "p99"]];
    const ringLabel = (r, text) => {
      const tag = mk("text", { x: cx + 7, y: cy + r - 5, class: "ringlab" });
      tag.textContent = text;
      gRings.append(tag);
    };
    for (const [value] of rings) {
      const r = radius(value);
      gRings.append(mk("circle", { cx, cy, r, fill: "none", stroke: "var(--grid)",
                                   "stroke-dasharray": "3 5" }));
      ringLabel(r, value.toFixed(3));
    }
    gRings.append(mk("circle", { cx, cy, r: R, fill: "none", stroke: "var(--axis)" }));
    ringLabel(R, lo.toFixed(3));
    // Single source of truth for "is the idea layer actually going to be drawn this pass":
    // the checkbox alone lies after a tab switch (cached `graph` from a graph-off fetch),
    // and `graph` alone lies too (stale cache from BEFORE the checkbox was unticked). Every
    // place that used to repeat `withGraph.checked && graph` — the legend caption, the leaf
    // dimming below, and the idea/edge draw itself — reads this one flag instead.
    const drawIdeas = Boolean(withGraph.checked && graph);
    legendHost.replaceChildren(el("div", { class: "legend wrap" },
      el("span", { class: "dim" }, "кольца:"),
      ...rings.reverse().map(([value, label]) => el("span", {},
        `${label} ${value.toFixed(3)} — ближе ${fmt(share(value))} из ${fmt(data.total)}`)),
      el("span", {}, `дальний край ${lo.toFixed(3)}`),
      el("span", { class: "dim" }, "· радиус = косинус, цвет = он же"),
      el("span", { class: "dim" }, drawIdeas
        ? "· крупные узлы — идеи, линии между ними — рёбра co-citation; угол задают только "
          + "они, расстояния в нём нет"
        : "· угол ничего не значит")));

    // Every mark also lands here, and the hover card is driven by a nearest-mark search
    // rather than by :hover on the element: a leaf is 1.5 px across, and a target that
    // small is one nobody can point at.
    const marks = [];
    // `openId` is only set for idea nodes — the one mark type a second tap opens.
    const hoverable = (x, y, r, rank, head, body, leaf = null, openId = null) =>
      marks.push({ x, y, r, rank, head, body, leaf, openId });
    let onIdeaCount = 0, offIdeaCount = 0;
    const hitIds = new Set(data.hits.map((hit) => hit.thesis_id));
    if (withLeaves.checked) {
      // Leaves step back when the idea layer is on: 3 000 dots at full strength read as
      // the subject of the picture, and there the subject is the graph. Gated on `drawIdeas`,
      // not on `graph` alone — a cached graph from an earlier fetch must not dim the leaves
      // for a layer that (per the checkbox) isn't actually drawn this pass.
      const leafAlpha = drawIdeas ? 0.3 : 0.72, leafR = drawIdeas ? 1.5 : 1.9;
      for (const p of data.points) {
        if (hitIds.has(p.thesis_id)) continue;
        const r = radius(p.cosine);
        const x = cx + Math.cos(p.angle) * r, y = cy + Math.sin(p.angle) * r;
        gPts.append(mk("circle", { cx: x, cy: y, r: leafR, fill: shade(p.cosine),
                                   "fill-opacity": leafAlpha }));
        hoverable(x, y, leafR, 0, `лист · cos ${p.cosine.toFixed(3)}`, p.thesis_id, p.thesis_id);
      }
    }

    // --- the lake's own topology, on the same radial scale --------------------
    // An idea's radius is the cosine of its BEST leaf, which is the read path's own rule
    // for lifting a hit to an idea (§5.3) — not an average, and not the idea's own vector,
    // which nothing in retrieval ever compares against.
    let shownIdeas = 0, inside = 0, outside = 0;
    const ideaAt = new Map();   // idea_id -> [x, y] once the ring layout has run
    if (drawIdeas) {
      const best = new Map();
      for (const p of data.points) {
        const seen = best.get(p.idea_id);
        if (!seen || p.cosine > seen.cosine) best.set(p.idea_id, p);
      }
      const wanted = Math.min(300, Math.max(5, Number(top.value) || 60));
      const nodes = [...best.entries()]
        .sort((a, b) => b[1].cosine - a[1].cosine)
        .slice(0, wanted)
        // Seeded on the golden angle, NOT at the leaf's projected angle and not in rank
        // order. The projected angle carries ~10 % of the residual variance and drew the
        // ideas as one arc; seeding by rank drew a spiral, because rank and radius move
        // together. Off a decorrelated ring, every grouping left on screen is the edges'
        // doing and nothing else.
        .map(([id, point], i) => ({
          id, cosine: point.cosine, r: radius(point.cosine),
          angle: ((i * 0.6180339887) % 1) * Math.PI * 2, body: graph.ideas.get(id) || null,
        }));
      const on = new Set(nodes.map((n) => n.id));
      const seenEdge = new Set();
      const links = [];
      for (const edge of graph.edges) {
        const here = on.has(edge.source_id), there = on.has(edge.target_id);
        if (!here && !there) continue;
        if (!here || !there) { outside++; continue; }
        // Stored both directions (write_cocitation_edges); one line per pair.
        const key = [edge.source_id, edge.target_id].sort().join("|");
        if (seenEdge.has(key)) continue;
        seenEdge.add(key);
        links.push({ source: edge.source_id, target: edge.target_id, weight: edge.weight || 1 });
      }
      inside = links.length;
      shownIdeas = nodes.length;
      ringLayout(nodes, links);
      const pos = new Map(nodes.map((n) => [n.id, n]));
      const at = (n) => [cx + Math.cos(n.angle) * n.r, cy + Math.sin(n.angle) * n.r];
      for (const link of links) {
        const a = pos.get(link.source), b = pos.get(link.target);
        const [x1, y1] = at(a), [x2, y2] = at(b);
        // Quadratic through a point pulled toward the centre: straight chords across the
        // disc would all pile through the middle, where the hypothesis is.
        const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
        const line = mk("path", {
          d: `M${x1.toFixed(1)} ${y1.toFixed(1)} Q${(cx + (mx - cx) * 0.55).toFixed(1)} `
             + `${(cy + (my - cy) * 0.55).toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}`,
          fill: "none", stroke: "var(--ink-2)",
          "stroke-opacity": Math.min(0.75, 0.34 + 0.14 * Math.log1p(link.weight)),
          "stroke-width": Math.min(2.4, 0.8 + 0.5 * Math.log1p(link.weight)),
        });
        tip(line, `${link.source} — ${link.target}\nвес ${link.weight}`);
        gEdges.append(line);
      }
      const parents = new Set(data.hits.map((hit) => hit.idea_id));
      for (const node of nodes) {
        const [x, y] = at(node);
        ideaAt.set(node.id, [x, y]);
        const leaves = node.body ? (node.body.theses || []).length : 0;
        const dot = mk("circle", { cx: x, cy: y, r: 3.6 + 1.5 * Math.sqrt(leaves),
          fill: shade(node.cosine), stroke: parents.has(node.id) ? "var(--s2)" : "var(--surface)",
          "stroke-width": parents.has(node.id) ? 2 : 1, class: "ideanode" });
        // §2.3: Chromium tags a tap's synthetic `click` with the tapping pointer's own
        // `pointerType` (`"touch"` or `"pen"`, never `"mouse"`) — `hasHover` skips both here
        // so a first tap or pen-tap does not open the idea before the two-tap flow below (the
        // `pointerdown` listener near the bottom of this function) gets a look. A confirmed
        // second tap on the same mark still ends up at this exact `openIdea` call, just
        // invoked directly rather than through this listener — one path to open, not two.
        // (`preventDefault` on the touch `pointerdown` does NOT reliably suppress this
        // synthetic click — confirmed against CDP's `Input.dispatchTouchEvent`, the same
        // primitive `tools/e2e_console.py`'s `tap()` uses — so the guard lives here instead
        // of relying on that.)
        // Cost of the dependency: `hasHover` compares against `"mouse"`, so anything that is
        // NOT `"mouse"` — `"touch"`, `"pen"`, even an engine that synthesizes a plain
        // `MouseEvent` with an empty-string or missing `pointerType` — is caught by this
        // guard, same as before. The only way this silently breaks is an engine reporting
        // `"mouse"` for a touch or pen's own synthetic click; the two-tap flow below still
        // runs its own state machine on `pointerdown` regardless, so nothing crashes — "read
        // the card first" would just quietly revert to "tap opens immediately", and nothing
        // here would tell you.
        dot.addEventListener("click", (event) => {
          if (!hasHover(event)) return;
          openIdea(node.id);
        });
        gIdeas.append(dot);
        hoverable(x, y, 3.6 + 1.5 * Math.sqrt(leaves), 1,
          `идея · cos лучшего листа ${node.cosine.toFixed(3)} · листьев ${leaves} · `
            + `открыть: клик мышью, на тач-экране — второй тап по метке`,
          (node.body ? node.body.text : "(тело идеи не прочитано)") + `\n${node.id}`,
          null, node.id);
      }
    }
    // The hits are drawn last and joined to the centre: on a plot where the angle means
    // nothing, the line is what carries "this one is actually near", not the position.
    data.hits.forEach((hit, i) => {
      const p = data.points.find((pt) => pt.thesis_id === hit.thesis_id);
      if (!p) return;
      const r = radius(p.cosine);
      // With the graph layer on, the spoke ends on the IDEA the read path would return,
      // not on the leaf that matched: two markers for one hit, at unrelated angles, is a
      // picture that invites the question "why is #1 not on its own idea".
      const onIdea = ideaAt.get(hit.idea_id);
      if (onIdea) onIdeaCount++; else offIdeaCount++;
      const x = onIdea ? onIdea[0] : cx + Math.cos(p.angle) * r;
      const y = onIdea ? onIdea[1] : cy + Math.sin(p.angle) * r;
      gHits.append(mk("line", { x1: cx, y1: cy, x2: x, y2: y, stroke: "var(--s2)",
                                "stroke-width": 1, "stroke-opacity": .45 }));
      const top5 = i < 5;
      const dot = mk("circle", { cx: x, cy: y, r: top5 ? 6.5 : 4, fill: "var(--s2)",
                                 stroke: "var(--surface)", "stroke-width": 2 });
      gHits.append(dot);
      hoverable(x, y, 8, 2, `#${i + 1} · cos ${hit.cosine.toFixed(3)} · `
        + (onIdea ? `на своей идее ${hit.idea_id}` : `лист, идея вне показанных (${hit.idea_id})`),
        hit.text);
      // The rank rides in the mark, not beside it: five wrapped sentences on the plot
      // covered the very cluster they described, and the text is one hover away. Only the
      // first five are numbered — a two-digit badge does not fit the dot, and twelve of
      // them is the clutter this change removed.
      if (top5) {
        const badge = mk("text", { x, y: y + 3.4, class: "hitrank", "text-anchor": "middle" });
        badge.textContent = String(i + 1);
        gLab.append(badge);
      }
    });

    // The centre is the hypothesis at cosine 1.0, and the axis does NOT run there: the
    // nearest leaf is 0.6-something. The gap is drawn as a break, not as empty space,
    // because a filled disc would read as "nothing in the lake got close" — which is a
    // different claim from "the scale starts here".
    gLab.append(mk("circle", { cx, cy, r: R0, fill: "none", stroke: "var(--hair)",
                               "stroke-dasharray": "2 4" }));
    gLab.append(mk("circle", { cx, cy, r: 5, fill: "var(--s2)" }));
    hoverable(cx, cy, 6, 3, "гипотеза · cos 1.000 к самой себе", data.query || "");
    const note = mk("text", { x: cx, y: cy - R0 - 10, class: "hitlab", "text-anchor": "middle" });
    note.textContent = `гипотеза · разрыв шкалы: 1.000 → ${hi.toFixed(3)}`;
    gLab.append(note);

    svg.append(gRings, gPts, gEdges, gIdeas, gHits, gLab);
    const card = el("div", { class: "hovercard hide" });
    const ring = mk("circle", { class: "hoverring hide", r: 11, fill: "none",
                                stroke: "var(--s2)", "stroke-width": 1.5 });
    gLab.append(ring);
    // The svg is width:100% with a fixed viewBox, so client pixels are not viewBox units
    // and the box is letterboxed on the axis that has slack. Both are undone here; using
    // the raw offset put the card a couple of centimetres from the mark it described.
    const toView = (event) => {
      const box = svg.getBoundingClientRect();
      const scale = Math.min(box.width / w, box.height / h);
      return [(event.clientX - box.left - (box.width - w * scale) / 2) / scale,
              (event.clientY - box.top - (box.height - h * scale) / 2) / scale, box, scale];
    };
    // Armed by a tap that showed a mark's card (pointerdown below), so a second tap on the
    // SAME mark knows to open instead of just re-showing. Declared here, next to `hideCard`,
    // because `hideCard` is the one place that disarms it: every path that can hide the card
    // — a tap that misses (inside `showMark`), a mouse leaving the svg, or the open branch
    // below — must also forget which mark was armed, or a stale mark can open on a plain tap
    // that only ever showed a card (see the pointerdown listener below for the failure mode
    // this closes).
    let lastTapMark = null;
    const hideCard = () => {
      card.classList.add("hide");
      ring.classList.add("hide");
      lastTapMark = null;
    };
    // Shared by the mouse-hover branch and the finger-tap branch below: finds the nearest
    // mark within `radius` view units and fills the card/ring for it, or hides both and
    // returns null. Positioning is left to the caller — the mouse path places the card next
    // to the pointer, the touch path pins it to the bottom (§2.3, CSS media block above).
    const showMark = (vx, vy, radius) => {
      const { mark: best, score: bestScore } = nearestMark(marks, vx, vy);
      if (!best || bestScore > radius) { hideCard(); return null; }
      ring.setAttribute("cx", best.x);
      ring.setAttribute("cy", best.y);
      ring.setAttribute("r", best.r + 5);
      ring.classList.remove("hide");
      card.replaceChildren(el("div", { class: "hc-head" }, best.head),
                           el("div", { class: "hc-body" }, LEAF_TEXT.get(best.leaf) || best.body));
      card.classList.remove("hide");
      // The leaf's own text is NOT in the dial's payload: 3 040 of them is half a megabyte
      // per hypothesis, for a line only the hovered dot ever shows. It is fetched on hover
      // instead, once per leaf, and a dead graph costs that one line and says so — the
      // dial itself is still index-only.
      if (best.leaf && !LEAF_TEXT.has(best.leaf)) {
        const which = best.leaf;
        // Lives on the TAB's own state, not a module-level variable: §4.2 requires this
        // timer to die when the operator leaves the dial, and a variable shared by every
        // future mount can only ever be cleared by whichever mount's closure created it.
        clearTimeout(ctx.state.leafTimer);
        ctx.state.leafTimer = setTimeout(async () => {
          let text;
          try { text = (await api(`/theses/${encodeURIComponent(which)}`)).text; }
          catch (err) { text = `${which}\n(текст не прочитан: ${explain(err)})`; }
          LEAF_TEXT.set(which, text);
          const shown = card.querySelector(".hc-body");
          if (shown && shown.textContent === which) shown.textContent = text;
        }, 140);
      }
      return best;
    };
    // Placed relative to the wrapper and kept inside it: a card that runs off the panel
    // is a card whose last words are the ones nobody reads. (At max-width:620 the CSS
    // media block above overrides this with `!important` and pins the card to the bottom
    // instead — a finger over the mark would otherwise cover the card that follows it.)
    const positionCard = (box, scale, best) => {
      const px = box.left + (box.width - w * scale) / 2 + best.x * scale;
      const py = box.top + (box.height - h * scale) / 2 + best.y * scale;
      const host = wrap.getBoundingClientRect();
      const cw = card.offsetWidth || 320, ch = card.offsetHeight || 90;
      card.style.left = `${Math.max(8, Math.min(host.width - cw - 8, px - host.left + 14))}px`;
      card.style.top = `${Math.max(8, Math.min(host.height - ch - 8, py - host.top + 14))}px`;
    };
    // §2.3: mousemove/mouseleave replaced by pointermove/pointerdown, branching on
    // pointerType — touch never fires mousemove/mouseleave at all, which is exactly why the
    // card was invisible on a phone before this change.
    svg.addEventListener("pointermove", (event) => {
      if (!hasHover(event)) return;   // no hover concept for touch/pen
      const [vx, vy, box, scale] = toView(event);
      const best = showMark(vx, vy, 9);
      if (best) positionCard(box, scale, best);
    });
    svg.addEventListener("pointerleave", (event) => {
      if (!hasHover(event)) return;
      hideCard();
    });
    // One tap shows the card; a second tap on the SAME mark opens its idea (marks without
    // an `openId` — leaves, hits, the hypothesis centre — just stay shown); a tap that hits
    // no mark hides the card (and disarms `lastTapMark` — see `hideCard`, above). The idea
    // node's own `click` listener, above, is what actually guards against the tap's
    // synthetic click opening on the first tap — `preventDefault` here does not reliably
    // suppress it (see that listener's comment).
    svg.addEventListener("pointerdown", (event) => {
      if (hasHover(event)) return;   // real mouse clicks open via `click`, above
      // Measured on 390×844 with a real touchStart/touchMove/touchEnd sequence centred on the
      // dial (`tools/e2e_console.py`): scrollY moved 914 → 1079, i.e. this does NOT stop
      // Chromium from panning the page, and it should not — the operator has to be able to
      // scroll a 390 px-wide page whose middle is one big svg. `touch-action` is not set
      // anywhere in this file, so panning was always going to survive a `preventDefault` on
      // `pointerdown` alone. What the call still buys:
      // it is the only guard in this file against the touch-callout/selection affordances a
      // long or dragged press on the svg would otherwise trigger (no `user-select` or
      // `touch-action` CSS backs it up), so it stays for that, not for scroll and not for
      // suppressing the synthetic click (that guard lives on the `click` listener above).
      event.preventDefault();
      const [vx, vy, box, scale] = toView(event);
      const best = showMark(vx, vy, 18);
      if (!best) return;   // showMark already called hideCard, which disarmed lastTapMark
      if (best === lastTapMark && best.openId) {
        openIdea(best.openId);
        hideCard();
        return;
      }
      lastTapMark = best;
      positionCard(box, scale, best);
    });
    wrap.replaceChildren(svg, card);
    return { ideas: shownIdeas, inside, outside, onIdea: onIdeaCount, offIdea: offIdeaCount };
  }

  function renderHits(data) {
    listHost.replaceChildren(
      el("p", { class: "help" }, `Угол — первые две компоненты PCA остатка, и они несут `
        + `${(data.angle_variance * 100).toFixed(1)} % его дисперсии: это украшение, `
        + `расстояния в нём нет. Правда — радиус и таблица: косинус, тот же, что печатает `
        + `/retrieve. Список — то же, что вернул бы GET /search.`),
      el("div", { class: "scroller" }, el("table", { class: "tbl" },
        el("thead", {}, el("tr", {}, ...["#", "cos", "тезис", "идея", "RRF", "BM25", "vector"]
          .map((head) => el("th", {}, head)))),
        el("tbody", {}, ...data.hits.map((hit, i) => el("tr", {},
          el("td", { class: "num" }, i + 1),
          el("td", { class: "num mono " + cosClass(hit.cosine) }, hit.cosine.toFixed(3)),
          el("td", {}, cut(hit.text, 110)),
          el("td", { class: "mono" }, el("a", { href: "#", onclick: (e) => {
            e.preventDefault(); openIdea(hit.idea_id); } }, hit.idea_id)),
          el("td", { class: "num mono" }, hit.score.toFixed(5)),
          el("td", { class: "num mono" }, hit.bm25_rank ?? "—"),
          el("td", { class: "num mono" }, hit.vec_rank ?? "—")))))));
  }

  function ideasIntro(ids, hitsLen) {
    return el("p", { class: "help" }, `Идеи-родители найденных листьев: `
      + `${ids.length} на ${hitsLen} попаданий. Поиск идёт по тезисам, поэтому это `
      + `идея ближайшего листа, а не ближайшая по своему тексту идея.`);
  }

  // Pure render of what `loadIdeas` fetched -- no `api()` call, so the mount-time restore
  // path below can call it directly on a cached `ideasInfo` without a request.
  function renderIdeasBlock(info) {
    const { ids, found, failure, hitsLen } = info;
    ideasHost.replaceChildren(ideasIntro(ids, hitsLen));
    if (failure) {
      ideasHost.append(el("div", { class: "status " + (failure.status === 503 ? "err" : "warn") },
        el("span", { class: "code" }, failure.status || "—"),
        `${explain(failure)} — карточки идей не прочитаны (${found.size} из ${ids.length}). `
        + "Циферблат выше считается из индекса и от графа не зависит."));
    }
    for (const id of ids) {
      const body = found.get(id);
      // No `via`, no `score`: this view did not rank anything, and printing a rank it
      // never computed would be a number with nothing behind it.
      if (body) ideasHost.append(ideaCard({ ...body, idea_id: body.id,
        theses: body.theses || [] }, ids.indexOf(id) + 1));
    }
  }

  /* The dial itself never touches the graph. The idea cards do -- so a dead graph costs
     the cards and says so, instead of taking the whole answer down with it. Returns the
     fetched bodies (not just side-effects) so `fire()` can cache them for the mount-time
     restore path -- the whole reason this used to be void. */
  async function loadIdeas(data, stale) {
    const ids = [];
    for (const hit of data.hits) if (!ids.includes(hit.idea_id)) ids.push(hit.idea_id);
    ideasHost.replaceChildren(ideasIntro(ids, data.hits.length));
    let failure = null;
    const bodies = await pool(ids, (id) => api(`/ideas/${encodeURIComponent(id)}`)
      .catch((err) => { failure = failure || err; return null; }));
    if (stale()) return null;
    const found = new Map(bodies.filter(([, body]) => body));
    return { ids, found, failure, hitsLen: data.hits.length };
  }

  host.replaceChildren(
    el("div", { class: "panel" },
      el("h2", {}, "GET /dial — гипотеза против всего озера"),
      el("p", { class: "help" }, "Фраза с трибуны сравнивается с каждым листом индекса. Ни rewrite, "
        + "ни 9B, ни записи: в графе от этого ничего не появляется и в retrieve.jsonl "
        + "(лог замера A/B) строки не остаётся."),
      el("div", { class: "row" }, el("label", { class: "f grow" }, "гипотеза", q),
        el("label", { class: "f" }, "k", k),
        el("label", { class: "f" }, "идей", top),
        el("button", { class: "act", onclick: guard(fire) }, "Разложить")),
      el("div", { class: "row" },
        el("label", { class: "cb" }, withGraph, "идеи и рёбра"),
        el("label", { class: "cb" }, withLeaves, "точки-листья"),
        el("button", { class: "ghost sm", onclick: guard(async () => {
          // The graph is cached per page load; ingest running underneath is exactly when
          // an operator needs to say "re-read it" without reloading the tab. loadGraph(true)
          // only overwrites GRAPH_CACHE after BOTH paged reads finish clean, so a failure
          // here never touched the cache — the redraw just has to not run to say so.
          const fresh = await run(statusHost, "перечитываю идеи и рёбра…", async () => {
            try { await loadGraph(true); }
            catch (err) {
              // GRAPH_CACHE is assigned exactly once, at the very end of loadGraph — so
              // ANY failure here leaves it physically untouched, whether it's an ApiError
              // (a real 4xx/5xx) or a plain throw from the paging loop itself (a malformed
              // 200 for /edges makes `edges.push(...page.items)` throw a TypeError, not an
              // ApiError). The reassurance holds regardless of what threw, so it is not
              // conditioned on err's type.
              const note = "граф остался прежним";
              const message = err.message ? `${err.message} — ${note}` : note;
              if (err instanceof ApiError) throw new ApiError(err.status, message, err.body);
              throw new Error(message);
            }
            return true;
          });
          if (fresh) fire();
        }) }, "Перечитать граф")),
      statusHost),
    el("div", { class: "panel" }, wrap, legendHost, listHost),
    el("div", { class: "panel" }, el("h2", {}, "Идеи рядом"), ideasHost));
  q.focus();

  // §4.1: three mutually exclusive outcomes for whatever this tab last did, ranked by
  // `okSeq`/`errSeq` (both fed by the same `ctx.state.seq` counter `fire()` already used to
  // reject its own stale responses) — whichever is higher is the last thing that actually
  // happened, so a success that predates a later failure must not outrank it. Living on
  // `ctx.state` (not a local variable) is what makes the two numbers comparable ACROSS a
  // tab switch, not just within one mount.
  if (ctx.state.errSeq && ctx.state.errSeq > (ctx.state.okSeq || 0)) {
    // Regime 2: the last call on this tab failed. Redraw whatever earlier answer exists
    // (real data, not garbage — same as the mismatch branch below), then paint the failure
    // on top, exactly like the live screen looked the moment it happened — not the green
    // line of the success that came before it.
    if (ctx.state.data) renderAll(ctx.state.data, ctx.state.graph, ctx.state.graphError, ctx.state.ideas);
    failed(statusHost, ctx.state.err);
    const ep = ctx.state.errParams;
    if (ep && (ep.q !== (p.q || "") || ep.k !== (Number(p.k) || 12)))
      statusHost.append(el("div", { class: "status warn" },
        `неудачным был запрос «${ep.q}» (k=${ep.k}) — текущая гипотеза другая, жми «Разложить» для неё`));
  } else if (ctx.state.data) {
    // §2.2: a previous answer lives on this tab's own VIEW_STATE entry — redraw it, no
    // request. This is the entire fix for "switch tabs and back loses the dial".
    renderAll(ctx.state.data, ctx.state.graph, ctx.state.graphError, ctx.state.ideas);
    const rp = ctx.state.reqParams;
    const cur = { q: p.q || "", k: Number(p.k) || 12 };
    if (rp && (rp.q !== cur.q || rp.k !== cur.k))
      markAnswerStale(statusHost,
        `показан ответ на прежний запрос «${rp.q}» (k=${rp.k}) — текущая гипотеза другая, жми «Разложить» для ответа на неё`);
  } else if (p.run === "1" && p.q) {
    // The ONE exception to "no auto-request on open" (§2.2, §9.3): `/dial` only reads the
    // index and writes nowhere — no retrieve.jsonl row, no log_id, nothing an A/B
    // measurement depends on — so a link with an explicit `run=1` is safe to fire without
    // a click. Every other tab ignores this param (see their own mount, below).
    fire();
  }
});

/* ----------------------------------------------------------------- 2. search */

view("search", "Индекс", (host, ctx) => {
  const out = el("div"), statusHost = el("div");
  const q = el("input", { class: "grow", placeholder: "слова как есть, без rewrite", value: ctx.params.q || "" });
  const k = el("input", { type: "number", min: 1, max: 50, value: Number(ctx.params.k) || 10 });
  for (const field of [q, k])
    field.addEventListener("input", () => setParams({ q: q.value.trim() || undefined,
      k: (Number(k.value) || 10) !== 10 ? k.value : undefined }));

  function renderHits(hits) {
    setStatus(statusHost, hits.deadFts ? "warn" : "ok", hits.code,
      hits.deadFts ? "BM25 не вернул ни одной строки: гибрид работает на одном косинусе — проверь FTS-индекс"
                   : `${hits.length} попаданий, обе руки индекса живы`);
    out.replaceChildren(hits.length ? el("div", { class: "scroller" },
      el("table", { class: "tbl" },
        el("thead", {}, el("tr", {}, ...["#", "тезис", "идея", "RRF score", "BM25 rank", "vector rank"]
          .map((h) => el("th", {}, h)))),
        el("tbody", {}, ...hits.map((h, i) => el("tr", {},
          el("td", { class: "num" }, i + 1),
          el("td", { class: "mono" }, h.thesis_id),
          el("td", { class: "mono" },
            el("a", { href: "#", onclick: (e) => { e.preventDefault(); openIdea(h.idea_id); } }, h.idea_id)),
          el("td", { class: "num mono" }, h.score.toFixed(5)),
          el("td", { class: "num mono" }, h.bm25_rank ?? "—"),
          el("td", { class: "num mono" }, h.vec_rank ?? "—"))))))
      : el("div", { class: "status warn" }, el("span", { class: "code" }, hits.code),
          "индекс ответил нулём строк — это данные, а не поломка"));
  }

  async function fire() {
    const text = q.value.trim();
    if (!text) { setStatus(statusHost, "warn", null, "пустой q → 400"); return; }
    setParams({ q: text, k: (Number(k.value) || 10) !== 10 ? k.value : undefined });
    // §4.1 (defect 1): on `ctx.state`, not a local `let seq = 0` — see the dial view for why
    // a per-mount counter makes okSeq/errSeq incomparable across a tab switch.
    const mine = ctx.state.seq = (ctx.state.seq || 0) + 1;
    // §4.1: the params THIS call answers — see the dial view for why.
    const reqParams = { q: text, k: Number(k.value) || 10 };
    await run(statusHost, "ищу по тезисам…", async () => {
      try {
        const hits = await api(`/search?q=${encodeURIComponent(text)}&k=${reqParams.k}`);
        // `hits.length` alone treats any non-array body (a shape mismatch) as the falsy
        // "zero rows" case below — a captive portal's `{surprise: ...}` would read as a
        // clean empty result instead of the broken response it is.
        if (!Array.isArray(hits)) throw new Error("ответ /search — не массив: " + JSON.stringify(hits).slice(0, 200));
        hits.deadFts = hits.length && hits.every((h) => h.bm25_rank === null);
        hits.code = codeOf(hits);
        renderHits(hits);
        ctx.state.hits = hits;   // §2.2: cached for the mount-time restore path below
        ctx.state.reqParams = reqParams; ctx.state.okSeq = mine;
        return hits;
      } catch (err) {
        // §4.1 regime 2: a failed call must read back as failed after a tab switch.
        ctx.state.err = err; ctx.state.errParams = reqParams; ctx.state.errSeq = mine;
        throw err;
      }
    });
  }

  host.replaceChildren(
    el("div", { class: "panel" },
      el("h2", {}, "GET /search"),
      el("p", { class: "help" }, "Сырой гибрид: BM25 + косинус, слитые RRF. Ни rewrite, ни подъёма к "
        + "идеям. Пустая колонка BM25 у всех строк = FTS-индекс мёртв, и это видно только здесь."),
      ignoredRunNote(ctx),
      el("div", { class: "row" },
        el("label", { class: "f grow" }, "q", q),
        el("label", { class: "f" }, "k", k),
        el("button", { class: "act", onclick: guard(fire) }, "Искать")),
      statusHost),
    out);
  // §2.2: a previous answer lives on this tab's own VIEW_STATE entry — redraw it, no
  // request. No auto-fire on a bare open, same as every non-dial view (§9.3).
  const curSearch = { q: ctx.params.q || "", k: Number(ctx.params.k) || 10 };
  if (ctx.state.errSeq && ctx.state.errSeq > (ctx.state.okSeq || 0)) {
    // §4.1 regime 2: the last call on this tab failed — show that again, not the green
    // line of a query that happened to succeed before it.
    failed(statusHost, ctx.state.err);
    const ep = ctx.state.errParams;
    if (ep && (ep.q !== curSearch.q || ep.k !== curSearch.k))
      statusHost.append(el("div", { class: "status warn" },
        `неудачным был запрос «${ep.q}» (k=${ep.k}) — текущий запрос другой, жми «Искать» для него`));
  } else if (ctx.state.hits) {
    renderHits(ctx.state.hits);
    const rp = ctx.state.reqParams;
    if (rp && (rp.q !== curSearch.q || rp.k !== curSearch.k))
      markAnswerStale(statusHost,
        `показан ответ на прежний запрос «${rp.q}» (k=${rp.k}) — текущий запрос другой, жми «Искать» для него`);
  }
});

/* ------------------------------------------------------------------ 3. ideas */

const PAGE = 25;

// `reload` is the view's `load(offset)`: it takes the CANDIDATE offset and only commits
// it to `state.offset` once that page actually arrives. Moving `state.offset` here,
// before the request settles, is how a flaky "вперёд" used to lose rows silently — three
// failed pages forward and the next success would quietly start mid-list.
function pager(state, total, reload) {
  const from = total ? state.offset + 1 : 0;
  const to = Math.min(state.offset + state.limit, total);
  return el("div", { class: "pager" },
    el("button", { class: "ghost sm", disabled: state.offset === 0 ? "" : null,
      onclick: () => reload(Math.max(0, state.offset - state.limit)) }, "← назад"),
    el("button", { class: "ghost sm", disabled: to >= total ? "" : null,
      onclick: () => reload(state.offset + state.limit) }, "вперёд →"),
    el("span", {}, `показано ${from}–${to} из ${fmt(total)} (total от сервера, не длина списка)`));
}

view("ideas", "Идеи", (host, ctx) => {
  const out = el("div"), statusHost = el("div"), detail = el("div");
  // Outside `detail` on purpose: `show()` wipes `detail` on every re-read, and a write
  // confirmation living inside it would vanish the instant the page re-fetches the idea
  // it just wrote — "Записано" that is never seen is the same lie as no confirmation.
  // scroll-margin-top: native scrollIntoView(block:"start") lands the target's top edge
  // at viewport y=0, which the sticky header+tabs then draw straight over — "on screen"
  // per the DOM, invisible in the rendered page. Not a constant: on a narrow viewport the
  // chip strip wraps to several lines and the header's real height is nothing like its
  // desktop height, so it is measured fresh right before each scroll instead.
  const writeStatus = el("div");
  // §2.2: this IS ctx.state — the same object across every mount of this tab, not a
  // fresh `{offset: 0}` literal. `offset` still comes from the URL first (a shared link
  // has to win), falling back to whatever this tab last remembered.
  const state = ctx.state;
  state.limit = PAGE;
  state.offset = Number(ctx.params.offset) || 0;
  const jump = el("input", { class: "mono", placeholder: "idea_…" });
  let shownIdeaId = null;
  // Same guard as the dial/graph views: two `show()` calls can be in flight at once (a
  // second "Записать изменения" click before the first's own re-read lands — the PATCH
  // button does not disable itself), and without this the later `await` to resolve wins
  // the DOM regardless of which one the operator actually meant, which is how two idea
  // ids ended up with two live PATCH forms on screen at once.
  let generation = 0;

  // Pure render of an already-fetched page — no `api()` call, so the mount-time restore
  // path below can call it on `state.page` directly.
  function renderPage(page) {
    setStatus(statusHost, "ok", codeOf(page), `${page.items.length} строк на странице, total ${fmt(page.total)}`);
    out.replaceChildren(
      el("div", { class: "scroller" }, el("table", { class: "tbl" },
        el("thead", {}, el("tr", {}, ...["идея", "текст", "trust", "листьев", "origin", "обновлена", ""]
          .map((h) => el("th", {}, h)))),
        el("tbody", {}, ...page.items.map((idea) => el("tr", {},
          el("td", { class: "mono" }, idea.id),
          el("td", {}, cut(idea.text, 150)),
          el("td", { class: "num" }, idea.trust_score.toFixed(1),
            idea.dirty ? el("span", { class: "badge b-dirty", style: "margin-left:6px" }, "dirty") : null),
          el("td", { class: "num" }, idea.theses.length),
          el("td", {}, idea.origin),
          el("td", { class: "mono dim" }, idea.updated_at || "«»"),
          el("td", {}, el("button", { class: "ghost sm", onclick: () => openIdea(idea.id) }, "открыть"))))))),
      pager(state, page.total, load));
  }

  async function load(offset = state.offset) {
    await run(statusHost, "читаю идеи…", async () => {
      const page = await api(`/ideas?limit=${state.limit}&offset=${offset}`);
      // Same shape check as /search above: a 200 with the wrong body (captive portal,
      // transparent proxy) must not commit `offset` — committing here first is what let
      // the stale pager's next click silently skip a page of rows.
      if (!Array.isArray(page.items) || typeof page.total !== "number")
        throw new Error("ответ /ideas — не страница: " + JSON.stringify(page).slice(0, 200));
      state.offset = offset;   // committed only now — the page actually has items+total
      setParams({ offset: offset || undefined });
      state.page = page;
      state.pageOffset = offset;   // §2.2: what the CACHED page above actually is
      renderPage(page);
      return page;
    });
  }

  async function show(ideaId) {
    const mine = ++generation;
    const stale = () => mine !== generation;
    // A stale "Записано" belongs to whatever idea was actually written, not to the next
    // one someone happens to open — clear it only when the id actually changes, so the
    // re-read that follows a successful PATCH (same id) leaves it standing.
    if (ideaId !== shownIdeaId) writeStatus.replaceChildren();
    shownIdeaId = ideaId;
    detail.replaceChildren();
    const statusBox = el("div");
    detail.append(el("div", { class: "panel" }, el("h2", {}, "идея " + ideaId), statusBox));
    await run(statusBox, "читаю идею и её рёбра…", async () => {
    const [idea, edges] = await Promise.all([
      api(`/ideas/${encodeURIComponent(ideaId)}`),
      api(`/ideas/${encodeURIComponent(ideaId)}/neighbors?hops=1`),
    ]);
    // A newer show() started (another id, or this same PATCH form's own post-write
    // re-read) while this one was in flight — `detail` belongs to that newer call now,
    // and this response has nowhere honest left to land. This is what used to leave two
    // idea ids each with a live PATCH form on screen at once.
    //
    // Defense in depth, not dead code: today every tab switch goes through `hashchange`,
    // and render() fully replaces #main's children on each one, which orphans this whole
    // closure (generation included) before a stale response can ever land here — so right
    // now there is no reachable failure for this line to catch, and no mutation of this
    // guard can be caught either (proven live: deleting it leaves the whole e2e suite
    // green). It stays because that orphaning is about to stop being the only guard: once
    // the tab survives a hashchange without remounting (§2.2, VIEW_STATE keeps `ideas`'
    // state across a switch instead of remounting it), two show() calls can share this
    // same closure again, and this check becomes the one thing standing between that and
    // the two-card defect described above.
    if (stale()) return idea;
    setStatus(statusBox, "ok", codeOf(idea), `${idea.theses.length} листьев, ${edges.length} рёбер (1 хоп)`);

    /* PATCH form: only the fields the API allows. `trust_score`, `dirty` and `origin`
       are absent on purpose — the judge writes the first two in one update, and a
       hand-written score would separate them. */
    const editable = ["text", "applicability_conditions", "limitations", "differentiation",
                      "effect_claimed", "effect_observed"];
    const inputs = {};
    const patchStatus = el("div");
    const form = el("div", { class: "panel" },
      el("h2", {}, "PATCH /ideas/{id}"),
      el("p", { class: "help" }, "Правится только то, что ручка принимает. trust_score, dirty и origin "
        + "недоступны намеренно: счёт и флаг пишет судья одной транзакцией, а origin — факт "
        + "происхождения. Меняешь text — сервер сам пересчитает вектор."),
      ...editable.map((field) => {
        const input = el("input", { class: "grow", value: idea[field] ?? "" });
        inputs[field] = input;
        return el("label", { class: "f grow", style: "margin-bottom:8px" }, field, input);
      }),
      el("div", { class: "row" },
        el("button", { class: "act", onclick: guard(async () => {
          const body = {};
          for (const field of editable) {
            const now = inputs[field].value;
            const was = idea[field] ?? "";
            if (now !== was) body[field] = field === "differentiation" && now === "" ? null : now;
          }
          if (!Object.keys(body).length) {
            setStatus(patchStatus, "warn", null, "ничего не изменено — пустой PATCH сервер отклонит (400)");
            return;
          }
          // A fresh attempt starts with no stale confirmation: a failing second PATCH
          // must not leave a first PATCH's green "записано" standing.
          writeStatus.replaceChildren();
          const updated = await run(patchStatus, "пишу…", async () => {
            const res = await api(`/ideas/${encodeURIComponent(ideaId)}`, { method: "PATCH", body });
            // `updated_at` is a required string on every real IdeaOut (§ schemas.py) — "",
            // never absent. A body that isn't an idea at all (a captive portal's
            // `{surprise: ...}`) has no such key, so `res.updated_at` comes back
            // `undefined` — and undefined prints exactly like the honest "«»" a real
            // response uses for "server didn't stamp a time", which is what let this
            // slip through as a green "записано" before. Checking the key is present
            // (not just truthy — "" must pass) tells the two apart.
            if (!res || typeof res !== "object" || typeof res.updated_at !== "string")
              throw new Error(`ответ PATCH /ideas/${ideaId} — не идея: ` + JSON.stringify(res).slice(0, 200));
            return res;
          });
          if (!updated) return;
          // Lives in `writeStatus`, not `patchStatus`: `show()` below rebuilds `detail`
          // (and `patchStatus` is inside it) to re-read the idea, and this line must
          // outlive that — including a re-read that itself fails.
          setStatus(writeStatus, "ok", codeOf(updated),
            `записано: ${Object.keys(body).join(", ")}; updated_at ${updated.updated_at || "«»"}`);
          // Scrolled from here, not from show()'s tail: a re-read that 503s returns out of
          // show() before it ever reaches its own scrollIntoView, and whether the
          // confirmation lands in frame would then depend on the browser's scroll anchoring
          // instead of on this line.
          writeStatus.style.scrollMarginTop = (Math.max(
            $("header.bar").getBoundingClientRect().bottom,
            $("nav.tabs").getBoundingClientRect().bottom) + 10) + "px";
          writeStatus.scrollIntoView({ behavior: "smooth", block: "start" });
          show(ideaId); load();
        }) }, "Записать изменения"),
        el("button", { class: "ghost", onclick: () => show(ideaId) }, "Сбросить")),
      patchStatus);

    detail.append(
      el("div", { class: "cards" }, ideaCard(idea, null)),
      form,
      el("div", { class: "panel" },
        el("h2", {}, "рёбра из идеи · GET /ideas/{id}/neighbors"),
        edges.length ? el("div", { class: "scroller" }, el("table", { class: "tbl" },
          el("thead", {}, el("tr", {}, ...["тип", "куда", "вес", "хоп", "свидетельства", "заметка"]
            .map((h) => el("th", {}, h)))),
          el("tbody", {}, ...edges.map((edge) => el("tr", {},
            el("td", {}, el("span", { class: "badge" }, edge.type)),
            el("td", { class: "mono" }, el("a", { href: "#", onclick: (e) => {
              e.preventDefault(); openIdea(edge.target_id); } }, edge.target_id)),
            el("td", { class: "num" }, edge.weight ?? "—"),
            el("td", { class: "num" }, edge.hop),
            el("td", { class: "num" }, (edge.evidence || []).length || "—"),
            el("td", { class: "dim" }, cut(edge.note, 80)))))))
          : el("div", { class: "status" }, el("span", { class: "code" }, codeOf(edges)),
              "рёбер нет — у этой идеи их действительно ноль (ручка ответила пустым списком)")),
      el("div", { class: "row" },
        el("button", { class: "ghost", onclick: () => {
          // Closing clears the confirmation too: a "записано" that outlives its card
          // reads as fresh on the next open, of this idea or another.
          detail.replaceChildren(); writeStatus.replaceChildren();
          // openIdea() is the one way in (§1.2: the address IS the state) — closing has
          // to be the way out, or F5/a forwarded link reopens what the operator just
          // closed, and clicking the SAME idea again is a dead click (an unchanged hash
          // never fires `hashchange`). history.replaceState, not location.hash=: this
          // must not fire a real navigation and remount the whole tab out from under the
          // list the operator is still looking at.
          if (CURRENT_ARG) {
            CURRENT_ARG = null;
            history.replaceState(null, "", formatHash(CURRENT, null, CURRENT_PARAMS));
          }
        } }, "Закрыть карточку")));
    // Scroll to whichever the operator needs to see: a just-written confirmation sits
    // ABOVE `detail`, and `block:"start"` on `detail` alone would run it off the top.
    (writeStatus.childNodes.length ? writeStatus : detail)
      .scrollIntoView({ behavior: "smooth", block: "start" });
    return idea;
    });
  }

  host.replaceChildren(
    el("div", { class: "panel" },
      el("h2", {}, "GET /ideas"),
      el("p", { class: "help" }, "Ноды графа с листьями. Открытая карточка даёт рёбра и правку полей."),
      ignoredRunNote(ctx),
      el("div", { class: "row" },
        el("label", { class: "f grow" }, "открыть по id", jump),
        el("button", { class: "act", onclick: () => jump.value.trim() && openIdea(jump.value.trim()) }, "Открыть"),
        el("button", { class: "ghost", onclick: () => load() }, "Обновить список")),
      statusHost),
    writeStatus, detail, out);
  // §2.2: the exact page for this offset is already sitting in state — redraw it, no
  // request. A different offset (a shared link, a hand-edited hash) still fetches: this
  // is the "листание в идеях, уход и возврат — offset не потерян" check, not a reason to
  // ever show the wrong page.
  if (state.page && state.pageOffset === state.offset) renderPage(state.page); else load(state.offset);
  // The one place `openIdea` actually lands: a route arrives here as `ctx.arg`, already
  // mounted (not `setTimeout`-raced against mounting), so the idea opens on the FIRST
  // click, from any tab, on a page that has never shown this tab before.
  if (ctx.arg) show(ctx.arg);
});

/* ----------------------------------------------------------------- 4. theses */

view("theses", "Тезисы", (host, ctx) => {
  const out = el("div"), statusHost = el("div");
  // §2.2: ctx.state itself, not a fresh literal — see «Идеи» above for why.
  const state = ctx.state;
  state.limit = PAGE;
  state.offset = Number(ctx.params.offset) || 0;
  const byIdea = el("input", { class: "mono", placeholder: "idea_…", value: ctx.params.idea_id || "" });
  const bySource = el("input", { class: "mono", placeholder: "источник", value: ctx.params.source_id || "" });
  // What the LAST fetched `state.page` was actually filtered by — a fresh navigation with
  // a different filter (the «тезисы» button in «Источники») must refetch, not show
  // yesterday's cached page for someone else's source_id.
  const fingerprint = () => `${state.offset}|${byIdea.value.trim()}|${bySource.value.trim()}`;

  function renderPage(page) {
    setStatus(statusHost, "ok", codeOf(page), `total ${fmt(page.total)} при этом фильтре`);
    out.replaceChildren(
      el("div", { class: "scroller" }, el("table", { class: "tbl" },
        el("thead", {}, el("tr", {}, ...["тезис", "текст", "эффект", "локатор", "источник", "идея"]
          .map((h) => el("th", {}, h)))),
        el("tbody", {}, ...page.items.map((leaf) => el("tr", {},
          el("td", { class: "mono" }, leaf.id),
          el("td", {}, cut(leaf.text, 180)),
          el("td", {}, leaf.effect || "—"),
          el("td", { class: "mono dim" }, leaf.locator || "—"),
          el("td", {}, el("a", { href: leaf.source_url, target: "_blank", rel: "noreferrer" },
            cut(leaf.source_title, 60)),
            el("span", { class: "badge b-" + leaf.source_type, style: "margin-left:6px" }, leaf.source_type)),
          el("td", { class: "mono" }, el("a", { href: "#", onclick: (e) => {
            e.preventDefault(); openIdea(leaf.idea_id); } }, leaf.idea_id))))))),
      pager(state, page.total, load));
  }

  async function load(offset = state.offset) {
    const params = new URLSearchParams({ limit: state.limit, offset });
    if (byIdea.value.trim()) params.set("idea_id", byIdea.value.trim());
    if (bySource.value.trim()) params.set("source_id", bySource.value.trim());
    await run(statusHost, "читаю тезисы…", async () => {
      const page = await api(`/theses?${params}`);
      // Same shape check as /search above: a 200 with the wrong body must not commit
      // `offset` — committing here first is what let the stale pager's next click
      // silently skip a page of rows.
      if (!Array.isArray(page.items) || typeof page.total !== "number")
        throw new Error("ответ /theses — не страница: " + JSON.stringify(page).slice(0, 200));
      state.offset = offset;   // committed only now — the page actually has items+total
      setParams({ offset: offset || undefined, idea_id: byIdea.value.trim() || undefined,
                  source_id: bySource.value.trim() || undefined });
      state.page = page;
      state.pageFp = fingerprint();
      renderPage(page);
      return page;
    });
  }

  host.replaceChildren(
    el("div", { class: "panel" },
      el("h2", {}, "GET /theses"),
      el("p", { class: "help" }, "Листья. Ручки на запись тезиса нет и не будет: тезис неизменяем и "
        + "создаётся только фазой 2, которая назначает ему идею через арбитра."),
      ignoredRunNote(ctx),
      el("div", { class: "row" },
        el("label", { class: "f" }, "idea_id", byIdea),
        el("label", { class: "f" }, "source_id", bySource),
        el("button", { class: "act", onclick: guard(() => load(0)) }, "Фильтровать")),
      statusHost),
    out);
  // §2.2: reuse the cached page only if it was fetched with these exact filters+offset —
  // a `source_id` arriving via a fresh link (§4.2's item 6, the «Источники» → «Тезисы»
  // navigation) must fetch, not show a stale unfiltered (or differently filtered) page.
  if (state.page && state.pageFp === fingerprint()) renderPage(state.page); else load(state.offset);
});

      state.offset = offset;   // committed only now — the page actually has items+total

  const f = {

    title: el("input", { class: "grow" }),
