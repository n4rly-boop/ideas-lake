# Собрать образ, прогнать на нём проверки, выложить в GHCR, обновить сервер.
#
# Сервер исходники не держит и ничего не собирает: приезжает готовый образ, а
# логин в GHCR делается токеном самого прогона — он живёт минуты, поэтому на
# машине не остаётся долгоживущего PAT.
#
# Секреты (Settings → Secrets → Actions):
#   DEPLOY_HOST         82.202.156.206
#   DEPLOY_USER         User10
#   DEPLOY_SSH_KEY      приватный ключ пары, чей public лежит в authorized_keys
#   DEPLOY_KNOWN_HOSTS  вывод `ssh-keyscan -H <host>` — чтобы не отключать
#                       проверку хоста и не пускать MITM в деплой
#
# На сервере нужны только `docker-compose.yml` (его кладёт этот же workflow),
# `.env.local` с ключами и каталог данных. `.env.local` в CI не приезжает
# никогда: ключи школы и LAKE_API_KEY живут на машине.
#
# D11: этот образ читает граф только из Neo4j, чтения из SQLite в коде нет.
# Если на сервере данные ещё в старом `lake.db` — их сначала переливают в Neo4j
# операционно, вручную, старым образом, и только потом катят этот образ
# (`.env.local.example`, раздел «Граф»). Гейт проверяет это ДО первой записи на
# сервер (до копирования `docker-compose.yml`) — см. шаг `verify data reached
# Neo4j before touching the server` — читает каталог из `LAKE_DATA` в `.env.local`
# самого сервера (не хардкодит `lake/data`), и доказывает, что данные ДОЕХАЛИ в
# Neo4j (счётчик узлов), а не только что файла `lake.db` не видно: разница
# важна, потому что «не видно по неверному пути» и «переехало» иначе не
# различить, а первое как раз выглядело бы зелёным при старой проверке.
name: build & deploy

on:
  push:
    branches: [main]
    paths:
      - 'lake/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Два прогона подряд не должны обновлять сервер одновременно: у ингеста слот
# один на процесс, и перезапуск посреди чужого up -d — это гонка на ровном месте.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ideas-lake

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    # Единственный бэкенд графа — Neo4j (D11): selfcheck отказывается стартовать
    # без него (`graph_client._select_backend()`). Сервис публикует 7687 на
    # localhost раннера; healthcheck в `options` — раннер ждёт готовности сам,
    # без сна вслепую.
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: none
        ports:
          - 7687:7687
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"   # GHCR требует нижний регистр

      # --provenance=false: иначе buildx делает манифест-лист с attestation, а
      # `docker push` такого листа падает на GHCR как `unknown blob` — блобы
      # аттестации в локальном сторе не лежат. Нам нужен обычный однослойный
      # образ: его же гоняют проверки ниже, его же тянет сервер.
      - name: build
        run: |
          docker build --provenance=false \
            -t "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" .

      # Проверки гоняются В СОБРАННОМ ОБРАЗЕ, а не в отдельном окружении: иначе
      # зелёный прогон говорит про питон раннера, а не про то, что поедет на
      # сервер. Порядок — от дешёвого к дорогому.
      #
      # Ни одна из трёх не ходит в интернет и не требует ключей школы: 6.1
      # (канарейка LLM) пропускается сама, `--offline` это её единственный
      # сетевой пункт. Но все три требуют живого Neo4j (D11: единственный
      # бэкенд) — сервис `neo4j` выше, `--network host` даёт контейнеру видеть
      # `localhost:7687` раннера, на котором сервис публикует порт.
      - name: self-checks inside the image
        env:
          NEO4J_URI: bolt://localhost:7687
        run: |
          img="${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
          for check in "lake.ingest.run selfcheck" "lake.api.selfcheck" "lake.selfcheck --offline"; do
            echo "::group::$check"
            docker run --rm --network host -e NEO4J_URI="$NEO4J_URI" "$img" python -m $check
            echo "::endgroup::"
          done

      - name: push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          img="${{ steps.meta.outputs.image }}"
          docker tag "$img:${{ steps.meta.outputs.tag }}" "$img:latest"
          docker push "$img:${{ steps.meta.outputs.tag }}"
          docker push "$img:latest"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # Секреты только через env и никогда внутрь строки, которую разбирает
      # удалённый shell: значение с кавычкой иначе выходит из своих кавычек и
      # исполняется на сервере.
      - name: ssh
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts

      # D11: этот образ не читает SQLite вовсе. Три поправки против старой версии
      # этого шага (ревью):
      #  (а) стоит ДО первой записи на сервер (до `copy compose file` ниже) — отказ
      #      здесь не должен уже менять сервер;
      #  (б) путь SQLite читается из LAKE_DATA в `.env.local` САМОГО СЕРВЕРА, а не
      #      хардкодится `lake/data` — нестандартный каталог раньше давал ПРОХОДЯЩУЮ
      #      проверку (файла по хардкоду не видно) при реально немигрированных данных;
      #  (в) доказывает, что данные ДОЕХАЛИ в Neo4j — считает узлы в графе, а не
      #      только что файла lake.db не видно. Отсутствие ОБОИХ (ни lake.db, ни
      #      данных в Neo4j) — тоже отказ, не проход: это неинициализированное
      #      состояние, не подтверждённая миграция.
      - name: verify data reached Neo4j before touching the server
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          ssh "$TARGET" bash -s <<'EOF'
            set -euo pipefail
            cd ~/ideas-lake
            if [ ! -f .env.local ]; then
              echo "REFUSED: ~/ideas-lake/.env.local not found on the server — cannot read LAKE_DATA/NEO4J_* to verify anything"
              exit 1
            fi
            set -a
            source .env.local
            set +a

            sqlite_path="${LAKE_DATA:-./lake/data}/lake.db"
            has_sqlite=0
            [ -f "$sqlite_path" ] && has_sqlite=1

            # Local compose Neo4j, published on the loopback interface
            # (`docker-compose.yml`) — reachable directly from the server's own shell,
            # no docker exec/container-name guesswork needed.
            neo4j_ok=0
            neo4j_count=0
            if out=$(docker exec ideas-lake-neo4j-1 cypher-shell \
                       -a bolt://localhost:7687 \
                       -u "${NEO4J_USERNAME:-neo4j}" -p "${NEO4J_PASSWORD:-ignored-locally}" \
                       -d "${NEO4J_DATABASE:-neo4j}" --format plain \
                       "MATCH (n) RETURN count(n) AS c;" 2>&1); then
              neo4j_count=$(printf '%s\n' "$out" | tail -n1 | tr -dc '0-9')
              [ -n "$neo4j_count" ] && neo4j_ok=1
            fi

            if [ "$has_sqlite" = 1 ]; then
              echo "REFUSED: $sqlite_path still present on the server — migrate it to Neo4j first (D11), then remove it"
              exit 1
            fi
            if [ "$neo4j_ok" != 1 ] || [ "$neo4j_count" -eq 0 ]; then
              echo "REFUSED: no $sqlite_path AND Neo4j (NEO4J_URI=${NEO4J_URI:-<unset>}) is unreachable or empty (nodes: ${neo4j_count:-unreachable}) — this looks uninitialized, not migrated. Refusing to deploy over it (D11)."
              exit 1
            fi
            echo "ok: no $sqlite_path, Neo4j has $neo4j_count node(s) — data landed, deploy may proceed"
          EOF

      # Один файл, не исходники: всё остальное внутри образа.
      - name: copy compose file
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: scp docker-compose.yml "$TARGET:ideas-lake/docker-compose.yml"

      - name: pull & up
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          TAG: ${{ needs.build.outputs.tag }}
        # Логин отдельным вызовом: токен уезжает по stdin самого ssh, поэтому на
        # сервере он не появляется ни в argv, ни в истории, ни в файле. Внутри
        # heredoc это было бы невозможно — stdin там занят самим скриптом.
        # Токен живёт минуты, долгоживущего PAT на машине не остаётся.
        run: |
          printf '%s' "$TOKEN" | ssh "$TARGET" docker login ghcr.io -u "$ACTOR" --password-stdin
          ssh "$TARGET" bash -s -- "$TAG" <<'EOF'
            set -euo pipefail
            cd ~/ideas-lake
            export LAKE_TAG="$1"
            docker compose --env-file .env.local pull lake
            docker compose --env-file .env.local up -d
            docker logout ghcr.io
          EOF

      # Без этого шага прогон зеленеет над мёртвым сервисом: up -d возвращает 0,
      # как только контейнер СОЗДАН, а не когда он отвечает. Здоровье считает сам
      # healthcheck compose — он ходит в /healthz с ключом, то есть проверяет и
      # авторизацию, и то, что индекс сходится с хранилищем.
      - name: wait for healthy
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          ssh "$TARGET" bash -s <<'EOF'
            set -euo pipefail
            for i in $(seq 1 40); do
              status=$(docker inspect --format '{{.State.Health.Status}}' ideas-lake-lake-1 2>/dev/null || echo missing)
              case "$status" in
                healthy) echo "healthy after ${i}0s"; exit 0 ;;
                unhealthy) echo "UNHEALTHY"; docker compose -f ~/ideas-lake/docker-compose.yml logs lake --tail 40; exit 1 ;;
              esac
              sleep 10
            done
            echo "still $status after 400s"
            docker logs ideas-lake-lake-1 --tail 40
            exit 1
          EOF
