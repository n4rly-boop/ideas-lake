# Ideas Lake, блок A.
#
#   docker compose --env-file .env.local up -d
#   docker compose --env-file .env.local run --rm lake python -m lake.neo4j_load --dry-run
#   docker compose down -v                                       # с томом графа
#
# `--env-file .env.local` подставляет окружение приложения; compose по умолчанию
# читает `.env`, а тот принадлежит запуску с хоста. Файл с ключами в репозиторий
# не идёт, образец — `.env.local.example`.
#
# Флаг можно и забыть: интерполяции в этом файле нет, поэтому `docker compose
# down -v` и `ps` работают без него. Забытый флаг у `up` стоит только пустых
# ключей в контейнере, а не отказа разобрать конфиг.
#
# Граф — только Neo4j (D11): `graph_client._select_backend()` требует
# `NEO4J_URI` в `.env.local`, пусто — отказ на старте, тихого SQLite-фолбэка в
# коде больше нет. `neo4j` ниже — локальный сервис под штатный
# `NEO4J_URI=bolt://neo4j:7687`; `lake` стартует только после того, как он
# отвечает на healthcheck (`depends_on` ниже), иначе первый же запрос ушёл бы в
# несуществующий граф.
#
# Реальная заливка (без `--dry-run`) пишет через ОТДЕЛЬНЫЕ NEO4J_TARGET_* (не
# `NEO4J_URI` выше — это то, что `neo4j_load.py` ЧИТАЕТ, локальное озеро), см.
# `.env.local.example`, раздел «Облачный граф вместо локального» — там же
# однострочная команда с `-e NEO4J_TARGET_URI=...` для разовой заливки в Aura,
# без переключения самого сервиса `lake` (`13` §4.4 п.1, BLOCKER третьего раунда).
#
# Указать вместо локального графа облачный (Aura) для самого сервиса `lake` — те
# же четыре `NEO4J_*` выше (не `NEO4J_TARGET_*`), см. комментарий в
# `.env.local.example`: это значит, что и сам сервис `lake` пишет прямо в чужую
# базу блока B (`07:79`), согласовывать отдельно.

services:
  lake:
    # Образ собирает CI и кладёт в GHCR (`.github/workflows/deploy.yml`); сервер
    # его тянет и исходников не держит. `LAKE_TAG` деплой выставляет в короткий
    # sha прогона — тогда откат это тот же up с другим тегом, а не пересборка.
    # `build:` остаётся для локальной разработки: `docker compose build` собирает
    # и метит тем же именем, `up` без pull возьмёт локальный образ.
    #
    # Деплой пишет `LAKE_TAG=<sha>` в `.env.local` на сервере (идемпотентно —
    # заменяет строку, не плодит дубли), так что и ручной `docker compose
    # up`/`run` без флагов резолвит тот же образ, что и последний деплой — не
    # только команда самого workflow. Дефолт здесь — `local`, не `latest`:
    # `latest` в GHCR двигает сам CI при каждой сборке и это чужой, мутируемый
    # указатель — если `.env.local` когда-нибудь потеряет `LAKE_TAG` (свежий
    # чекаут, ручная правка), `pull` на `:local` упадёт явно («тег не найден»,
    # такого тега в реестре нет), а не тихо подставит образ неизвестной
    # свежести. Разобрано на живом сервере: контейнер бежал на
    # `f9ebcd10efc9`, а `docker compose run` без `LAKE_TAG` тянул `:latest` и
    # падал `No module named lake.idea_edges` — то есть `:latest` в GHCR на
    # тот момент был старым образом.
    image: ghcr.io/n4rly-boop/ideas-lake:${LAKE_TAG:-local}
    build: .
    # Всё окружение отсюда: LAKE_KEY_9B, LAKE_KEY_35B, NEO4J_*.
    env_file: [.env.local]
    # Внутри контейнера uvicorn слушает все интерфейсы; наружу порт отдаёт вот
    # эта строка, и по умолчанию — только на петлю хоста. Чтобы блок C ходил с
    # другой машины, в `.env.local`: `LAKE_BIND=0.0.0.0`.
    #
    # Это не «просто переменная»: ключ (`LAKE_API_KEY`) ходит в заголовке открытым
    # текстом, TLS здесь нет. 0.0.0.0 без прокси с TLS — осознанный размен, а не
    # настройка по умолчанию.
    ports: ["${LAKE_BIND:-127.0.0.1}:8077:8077"]
    volumes:
      # Bind, а не именованный том: `lake/data` — это результаты живых прогонов,
      # и они должны остаться видимыми на хосте (`10` §2).
      #
      # Каталог переключается через `LAKE_DATA` в `.env.local`. Чистый прогон —
      # это другой каталог, а не удаление старого: в `lake/data` лежат тезисы,
      # добытые живыми вызовами LLM, и второй раз они бесплатно не появятся.
      # Значение по умолчанию есть, поэтому голые `down`/`ps` не ломаются.
      - ${LAKE_DATA:-./lake/data}:/app/lake/data
    healthcheck:
      # `/healthz` сверяет индекс с хранилищем, а не просто отвечает 200 — но сама
      # ручка (`lake/ops.py:health()`) НИКОГДА не поднимает код ответа выше 200:
      # недоступный граф читается как `{"status": "degraded", ...}`, а не 503
      # (осознанно — «healthz, который падает, говорит меньше, чем тот, что
      # объясняет, что не так»). Поэтому статус-код тут смотреть недостаточно:
      # тело нужно разобрать и свериться с `status`, иначе degraded читается как
      # здоровый на уровне compose/Docker (`13` §4.4 п.4). Это и есть тот самый
      # «честный /healthz» — после ребута хоста `restart: unless-stopped` поднимает
      # контейнеры без порядка `depends_on` (тот соблюдается только `up`), и `lake`
      # может стартовать раньше графа; вместо вечного ложного `healthy` над
      # degraded-сервисом Docker теперь видит `unhealthy`, пока граф не поднялся, и
      # `healthy` снова — как только `ops.health()` перечитает граф успешно (без
      # рестарта процесса: `_get_driver()` переоткрывает соединение сам).
      #
      # Ключ идёт из окружения того же контейнера: ручка закрыта наравне с
      # остальными — она отдаёт число листьев, — а healthcheck без ключа получал бы
      # 401 и вечный `unhealthy` на живом сервисе.
      test: ["CMD", "python", "-c",
             "import json,os,urllib.request,sys; r=urllib.request.Request('http://localhost:8077/healthz', headers={'Authorization': 'Bearer ' + os.environ.get('LAKE_API_KEY', '')}); resp=urllib.request.urlopen(r, timeout=5); body=json.load(resp); sys.exit(0 if resp.status==200 and body.get('status')=='ok' else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 120s   # первый старт греет энкодер до открытия порта
      retries: 3
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
      # SearXNG/Docling/Crawl4AI здесь НЕ перечислены и не описаны сервисами: они
      # уже работают на school10 отдельным проектом `research_stack`
      # (`~/gigaevo-core-memory/tools/research_stack/compose.yaml`), и `lake` ходит
      # к ним через внешнюю сеть — см. `networks:` ниже. Поднимать свои копии
      # значило бы держать второй Docling с его моделями рядом с уже живым.
    networks:
      # `default` — своя сеть проекта, в ней `neo4j`. `research` — чужая, уже
      # существующая: в ней у сервисов есть алиасы `searxng`, `docling`,
      # `crawl4ai`, и `.env.local` адресует их по этим именам.
      - default
      - research

  neo4j:
    image: neo4j:5-community
    # `env_file: .env.local` сюда дать нельзя: образ трактует ЛЮБУЮ переменную
    # `NEO4J_*` как настройку сервера и падает на нераспознанной — проверено,
    # `NEO4J_DATABASE` роняет контейнер словами «Unrecognized setting».
    #
    # Интерполяции (`${NEO4J_PASSWORD}`) здесь тоже нет намеренно: compose
    # подставляет переменные на КАЖДОЙ команде, и `docker compose down` без
    # `--env-file` падал бы на отсутствующем значении, не дав даже погасить стек.
    #
    # Отсюда `AUTH: none`. Это одноразовая база на петлевом интерфейсе; логин и
    # пароль из `.env.local` она игнорирует, драйвер шлёт их и сервер не смотрит
    # (проверено). Путь с паролем остаётся боевым на облаке.
    environment:
      NEO4J_AUTH: none
    ports:
      # Только 127.0.0.1: без этого compose публикует на 0.0.0.0, и база без
      # аутентификации оказывается видна из локальной сети.
      - "127.0.0.1:7474:7474"   # HTTP-браузер
      - "127.0.0.1:7687:7687"   # Bolt
    volumes:
      - neo4j-data:/data
    healthcheck:
      # `lake` теперь ждёт этого (`depends_on` выше): без него сервис стартовал
      # бы раньше графа и падал в цикл рестарта на первом же запросе, а не
      # держался бы за пустой порт. HTTP-браузер, не Bolt — не требует пароля,
      # который `NEO4J_AUTH: none` всё равно игнорирует.
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

volumes:
  neo4j-data:

networks:
  default:

  # --- Веб-исследование: чужая сеть, не свои сервисы -----------------------------
  #
  # SearXNG, Docling и Crawl4AI уже работают на school10 проектом `research_stack`
  # (`~/gigaevo-core-memory/tools/research_stack/compose.yaml`), с алиасами
  # `searxng`, `docling`, `crawl4ai` в сети `research_stack_default`. `lake`
  # подключается к ней вторым интерфейсом и ходит по этим именам
  # (`LAKE_SEARXNG_URL` и соседи в `.env.local`) — свои копии не поднимаем: второй
  # Docling с его моделями рядом с уже живым это память впустую, а второй SearXNG
  # ещё и второй открытый прокси в интернет.
  #
  # `external: true` намеренно жёсткое: если `research_stack` не поднят, `docker
  # compose up` падает на отсутствующей сети — громко, до старта `lake`. Тихая
  # альтернатива (создать пустую сеть и получить ConnectError на каждом запросе)
  # выглядела бы как «агент работает, просто ничего не находит».
  #
  # Локально вне school10 сеть нужна ВСЕГДА, даже в graph-only режиме: compose
  # разрешает сети до конфигурации сервисов, `lake` подключён к `research`
  # безусловно, и `up` падает раньше, чем кто-либо прочитает `LAKE_RESEARCH_WEB`.
  # Порядок: `docker network create research_stack_default`, и дальше либо поднять
  # сервисы в ней самому, либо `LAKE_RESEARCH_WEB=0` — пустая сеть безвредна,
  # `search_client is None` и никто в неё не звонит.
  research:
    name: research_stack_default
    external: true
